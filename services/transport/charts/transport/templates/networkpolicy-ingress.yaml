{{- /* GENERATED by deploy/scripts/gen_networkpolicies.py, identical in every service chart: edit the script, not this file. */ -}}
{{- $np := .Values.ingressPolicy | default dict }}
{{- if $np.enabled }}
{{- if empty $np.podNames }}{{ fail "ingressPolicy.podNames must list this chart's app.kubernetes.io/name labels" }}{{ end }}
# Default-deny ingress for every pod of this service (ADR-0006 rule 6, D1). Services trust the gateway-asserted X-Depot-*
# headers, so the API port admits only the Envoy pods of the Gateways in ingressPolicy.gateway.names and the peer services
# that call this one (ingressPolicy.peers, generated from the service grant table and the charts' *_URL clients); the
# metrics port admits only Prometheus. Any other pod, in this namespace or another, is refused. Egress is not restricted here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    depot.dev/network-policy: default-deny-ingress
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: {{ toJson $np.podNames }} }
  policyTypes: [Ingress]
  ingress:
    {{- if or $np.gateway.names $np.peers }}
    - from:
        {{- with $np.gateway.names }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.gateway.podsNamespace | quote }}
          podSelector:
            matchExpressions:
              - { key: gateway.envoyproxy.io/owning-gateway-namespace, operator: In, values: [{{ $np.gateway.gatewaysNamespace | quote }}] }
              - { key: gateway.envoyproxy.io/owning-gateway-name, operator: In, values: {{ toJson . }} }
        {{- end }}
        {{- with $np.peers }}
        {{- include "depot.ingressPolicy.peers" . | trim | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $np.apiPort }} }
    {{- end }}
    {{- with $np.metricsPorts }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.prometheus.podLabels | nindent 14 }}
      ports:
        {{- range . }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- if and $np.ingressController (.Values.ingress | default dict).enabled }}
    # The smoke Ingress (templates/ingress.yaml) routes /healthz and /readyz through the cluster's ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $np.apiPort }} }
    {{- end }}
    {{- if and $np.regionFencePeers (.Values.global | default dict).regionFenceUrl }}
    # global.regionFenceUrl: every service polls this service's /healthz/region (platform/go/httpx/fence.go).
    - from:
        {{- include "depot.ingressPolicy.peers" $np.regionFencePeers | trim | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $np.apiPort }} }
    {{- end }}
{{- end }}
{{- define "depot.ingressPolicy.peers" }}
{{- range . }}
{{- if .namespace }}
- namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .namespace | quote }}
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: {{ toJson .podNames }} }
{{- else }}
- podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: {{ toJson .podNames }} }
{{- end }}
{{- end }}
{{- end }}
