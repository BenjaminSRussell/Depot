image:
  repository: ghcr.io/benjaminsrussell/depot/transport
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

# DATABASE_URL is read from this secret (key: url); never set inline.
database:
  secretName: transport-db
  secretKey: url

env:
  DEPOT_ENV: dev
  SERVICE_NAME: transport
  HTTP_ADDR: ":8080"
  ADMIN_ADDR: ":9090"
  MIGRATE_ON_START: "false"
  # Rate-shop cache window in minutes (rating_cache_min, 0 to 60, 0 turns it off).
  TMS_RATING_CACHE_MIN: "10"

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: false
  interval: 30s

# Base URL of the routing-py optimizer (VRP and load-plan stacking), for example
# http://depot-tms-optimizer:8080. Empty leaves route optimization and load
# plans answering 503 TMS-0123.
optimizer:
  url: ""

serviceIdentity:
  publicKeys: ""

features:
  tmsEnabled: true
  landedCost: false
  vrp: false

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [transport]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: workflow
    podNames: [workflow]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
