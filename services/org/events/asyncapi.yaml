asyncapi: 3.0.0
info:
  title: org
  version: 0.13.0
  description: CloudEvents 1.0 envelope from platform/go/events; payloads below are the data member.
channels:
  depot.org.legalentity:
    address: depot.org.legalentity
    messages:
      created:
        $ref: '#/components/messages/legalEntityCreated'
      updated:
        $ref: '#/components/messages/legalEntityUpdated'
      copied:
        $ref: '#/components/messages/legalEntityCopied'
  depot.org.operatingunit:
    address: depot.org.operatingunit
    messages:
      created:
        $ref: '#/components/messages/operatingUnitCreated'
      updated:
        $ref: '#/components/messages/operatingUnitUpdated'
  depot.org.site:
    address: depot.org.site
    messages:
      created:
        $ref: '#/components/messages/siteCreated'
      updated:
        $ref: '#/components/messages/siteUpdated'
  depot.org.warehouse:
    address: depot.org.warehouse
    messages:
      created:
        $ref: '#/components/messages/warehouseCreated'
      updated:
        $ref: '#/components/messages/warehouseUpdated'
  depot.org.fiscalcalendar:
    address: depot.org.fiscalcalendar
    messages:
      generated:
        $ref: '#/components/messages/fiscalCalendarGenerated'
  depot.org.hierarchyversion:
    address: depot.org.hierarchyversion
    messages:
      activated:
        $ref: '#/components/messages/hierarchyVersionActivated'
  depot.org.teammembership:
    address: depot.org.teammembership
    messages:
      changed:
        $ref: '#/components/messages/teamMembershipChanged'
  depot.org.location:
    address: depot.org.location
    messages:
      created:
        $ref: '#/components/messages/locationCreated'
      updated:
        $ref: '#/components/messages/locationUpdated'
  depot.org.address:
    address: depot.org.address
    messages:
      changed:
        $ref: '#/components/messages/addressChanged'
  depot.org.currencyrounding:
    address: depot.org.currencyrounding
    messages:
      changed:
        $ref: '#/components/messages/currencyRoundingChanged'
  depot.org.democompany:
    address: depot.org.democompany
    messages:
      removed:
        $ref: '#/components/messages/demoCompanyRemoved'
operations:
  onDemoCompanyRemoved:
    action: send
    channel: { $ref: '#/channels/depot.org.democompany' }
    messages: [{ $ref: '#/channels/depot.org.democompany/messages/removed' }]
  onLegalEntityCreated:
    action: send
    channel: { $ref: '#/channels/depot.org.legalentity' }
    messages: [{ $ref: '#/channels/depot.org.legalentity/messages/created' }]
  onLegalEntityUpdated:
    action: send
    channel: { $ref: '#/channels/depot.org.legalentity' }
    messages: [{ $ref: '#/channels/depot.org.legalentity/messages/updated' }]
  onOperatingUnitCreated:
    action: send
    channel: { $ref: '#/channels/depot.org.operatingunit' }
    messages: [{ $ref: '#/channels/depot.org.operatingunit/messages/created' }]
  onOperatingUnitUpdated:
    action: send
    channel: { $ref: '#/channels/depot.org.operatingunit' }
    messages: [{ $ref: '#/channels/depot.org.operatingunit/messages/updated' }]
  onSiteCreated:
    action: send
    channel: { $ref: '#/channels/depot.org.site' }
    messages: [{ $ref: '#/channels/depot.org.site/messages/created' }]
  onSiteUpdated:
    action: send
    channel: { $ref: '#/channels/depot.org.site' }
    messages: [{ $ref: '#/channels/depot.org.site/messages/updated' }]
  onWarehouseCreated:
    action: send
    channel: { $ref: '#/channels/depot.org.warehouse' }
    messages: [{ $ref: '#/channels/depot.org.warehouse/messages/created' }]
  onWarehouseUpdated:
    action: send
    channel: { $ref: '#/channels/depot.org.warehouse' }
    messages: [{ $ref: '#/channels/depot.org.warehouse/messages/updated' }]
  onFiscalCalendarGenerated:
    action: send
    channel: { $ref: '#/channels/depot.org.fiscalcalendar' }
    messages: [{ $ref: '#/channels/depot.org.fiscalcalendar/messages/generated' }]
  onHierarchyVersionActivated:
    action: send
    channel: { $ref: '#/channels/depot.org.hierarchyversion' }
    messages: [{ $ref: '#/channels/depot.org.hierarchyversion/messages/activated' }]
  onTeamMembershipChanged:
    action: send
    channel: { $ref: '#/channels/depot.org.teammembership' }
    messages: [{ $ref: '#/channels/depot.org.teammembership/messages/changed' }]
  onLocationCreated:
    action: send
    channel: { $ref: '#/channels/depot.org.location' }
    messages: [{ $ref: '#/channels/depot.org.location/messages/created' }]
  onLocationUpdated:
    action: send
    channel: { $ref: '#/channels/depot.org.location' }
    messages: [{ $ref: '#/channels/depot.org.location/messages/updated' }]
  onAddressChanged:
    action: send
    channel: { $ref: '#/channels/depot.org.address' }
    messages: [{ $ref: '#/channels/depot.org.address/messages/changed' }]
  onCurrencyRoundingChanged:
    action: send
    channel: { $ref: '#/channels/depot.org.currencyrounding' }
    messages: [{ $ref: '#/channels/depot.org.currencyrounding/messages/changed' }]
components:
  messages:
    legalEntityCreated:
      name: created
      title: Legal entity created
      payload:
        type: object
        required: [id, code, name, country_code, accounting_currency, time_zone]
        properties:
          id: { type: string, format: uuid }
          code: { type: string }
          name: { type: string }
          country_code: { type: string }
          accounting_currency: { type: string }
          time_zone: { type: string }
      x-depot-type: dev.depot.org.legalentity.created.v1
    legalEntityUpdated:
      name: updated
      title: Legal entity updated
      description: changed_fields names the snake_case columns that changed, including fiscal_calendar_id when a fiscal calendar is assigned or cleared.
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-depot-type: dev.depot.org.legalentity.updated.v1
    legalEntityCopied:
      name: copied
      title: Legal entity copied
      summary: A legal entity was created from another; number sequences and parameters are for the owning waves to copy.
      payload:
        type: object
        required: [source_id, target_id, sites, warehouses, locations, rounding_rules, calendar_copied]
        properties:
          source_id: { type: string, format: uuid }
          target_id: { type: string, format: uuid }
          sites: { type: integer }
          warehouses: { type: integer }
          locations: { type: integer }
          rounding_rules: { type: integer }
          calendar_copied: { type: boolean }
      x-depot-type: dev.depot.org.legalentity.copied.v1
    operatingUnitCreated:
      name: created
      title: Operating unit created
      payload:
        type: object
        required: [id, type, code, name]
        properties:
          id: { type: string, format: uuid }
          type: { type: string }
          code: { type: string }
          name: { type: string }
      x-depot-type: dev.depot.org.operatingunit.created.v1
    operatingUnitUpdated:
      name: updated
      title: Operating unit updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-depot-type: dev.depot.org.operatingunit.updated.v1
    siteCreated:
      name: created
      title: Site created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid }
          type: { type: [string, 'null'] }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
          default_warehouse_id: { type: string, format: uuid, description: Present only when the site was created with a default warehouse; that warehouse's own warehouse.created event follows this one. }
      x-depot-type: dev.depot.org.site.created.v1
    siteUpdated:
      name: updated
      title: Site updated
      description: changed_fields names the fields whose value changed, including fiscal_calendar_id when the site's fiscal calendar is set, changed or cleared and default_warehouse_id when the site's default warehouse is set, re-pointed or cleared.
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-depot-type: dev.depot.org.site.updated.v1
    warehouseCreated:
      name: created
      title: Warehouse created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid, description: The site id. }
          type: { type: [string, 'null'], description: 'standard, transit, quarantine or subcontractor' }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
      x-depot-type: dev.depot.org.warehouse.created.v1
    warehouseUpdated:
      name: updated
      title: Warehouse updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-depot-type: dev.depot.org.warehouse.updated.v1
    locationCreated:
      name: created
      title: Location created
      payload:
        type: object
        required: [id, legal_entity_id, parent_id, type, address_id]
        properties:
          id: { type: string, format: uuid }
          legal_entity_id: { type: string, format: uuid }
          parent_id: { type: [string, 'null'], format: uuid, description: The warehouse id. }
          type: { type: [string, 'null'], description: 'storage, receiving, shipping or quarantine' }
          address_id: { type: [string, 'null'], format: uuid, description: Null until the address slice. }
      x-depot-type: dev.depot.org.location.created.v1
    locationUpdated:
      name: updated
      title: Location updated
      payload:
        type: object
        required: [id, changed_fields, version]
        properties:
          id: { type: string, format: uuid }
          changed_fields: { type: array, items: { type: string } }
          version: { type: integer }
      x-depot-type: dev.depot.org.location.updated.v1
    addressChanged:
      name: changed
      title: Address changed
      description: Emitted for every new address version, on create and on every PATCH.
      payload:
        type: object
        required: [address_id, version_id, owner_type, owner_id, purposes, valid_from]
        properties:
          address_id: { type: string, format: uuid, description: Stable across versions. }
          version_id: { type: string, format: uuid, description: The postal_address row that documents hold. }
          owner_type: { type: string, enum: [legal_entity, operating_unit, site, warehouse, location, party] }
          owner_id: { type: string, format: uuid }
          purposes: { type: array, items: { type: string, enum: [business, delivery, invoice, remit_to, service, home, other] } }
          valid_from: { type: string, format: date }
      x-depot-type: dev.depot.org.address.changed.v1
    fiscalCalendarGenerated:
      name: generated
      title: Fiscal year generated
      description: Emitted when a fiscal year's periods are first generated and again on every forced regeneration; an idempotent replay emits nothing.
      payload:
        type: object
        required: [calendar_id, fiscal_year, periods]
        properties:
          calendar_id: { type: string, format: uuid }
          fiscal_year: { type: integer }
          periods:
            type: array
            items:
              type: object
              required: [period_no, name, start_date, end_date, type, week53]
              properties:
                period_no: { type: integer }
                name: { type: string }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                type: { type: string, enum: [opening, operating, closing, adjustment] }
                week53: { type: boolean }
      x-depot-type: dev.depot.org.fiscalcalendar.generated.v1
    hierarchyVersionActivated:
      name: activated
      title: Hierarchy version activated
      description: Emitted when a draft hierarchy version is published, also for a future effective_from; the activation timer at effective_from is not built.
      payload:
        type: object
        required: [hierarchy_type_id, purposes, version_id, version_no, effective_from, node_count, superseded_version_id, backdate_reason]
        properties:
          hierarchy_type_id: { type: string, format: uuid }
          purposes: { type: array, items: { type: string } }
          version_id: { type: string, format: uuid }
          version_no: { type: integer }
          effective_from: { type: string, format: date }
          node_count: { type: integer }
          superseded_version_id: { type: [string, 'null'], format: uuid }
          backdate_reason: { type: [string, 'null'], description: The audit reason of a backdated publish. }
      x-depot-type: dev.depot.org.hierarchyversion.activated.v1
    teamMembershipChanged:
      name: changed
      title: Team membership changed
      description: Emitted when a member is added to a team (POST /v1/org/teams/{id}/members), ended (POST /v1/org/teams/{id}/members/{memberId}:end) or removed as entered in error (DELETE /v1/org/teams/{id}/members/{memberId}); a replay or a re-sent end date emits nothing. An add carries the new member in added with empty removed and as_of is its validFrom, the first day in force. An end carries empty added and the member in removed, and as_of is the day after validTo, the first day the member is no longer in force. A removal carries empty added and the member in removed, and as_of is the row's validFrom because the member is treated as never having been in force.
      payload:
        type: object
        required: [team_id, added, removed, as_of]
        properties:
          team_id: { type: string, format: uuid }
          added: { type: array, items: { type: object, required: [member_kind, member_id, member_role], properties: { member_kind: { type: string, enum: [user, party] }, member_id: { type: string, format: uuid }, member_role: { type: string, enum: [member, lead] } } } }
          removed: { type: array, items: { type: object, required: [member_kind, member_id, member_role], properties: { member_kind: { type: string, enum: [user, party] }, member_id: { type: string, format: uuid }, member_role: { type: string, enum: [member, lead] } } } }
          as_of: { type: string, format: date }
      x-depot-type: dev.depot.org.teammembership.changed.v1
    currencyRoundingChanged:
      name: changed
      title: Currency rounding rule changed
      description: Emitted by a PUT of a currency rounding rule that creates a row or changes its unit or method; an identical repeat emits nothing. Also emitted by a DELETE of a rule, carrying the rule now in force (the tenant row, or the currency's minor unit with half_even). legal_entity_id is null for a tenant row.
      payload:
        type: object
        required: [currency_code, purpose, unit, method]
        properties:
          currency_code: { type: string }
          purpose: { type: string }
          legal_entity_id: { type: [string, 'null'], format: uuid }
          unit: { type: string }
          method: { type: string }
      x-depot-type: dev.depot.org.currencyrounding.changed.v1
    demoCompanyRemoved:
      name: removed
      title: Demo company removed
      description: Emitted by POST /v1/org/demo-company:reset when it deletes the records the demo company loader created (keyed by the tenant id). It names who asked and the organization records removed; consumers that keep copies of them drop those copies. The reset then loads the demo again, which emits the usual created events with new ids. Nothing is emitted when there was no demo data to remove.
      payload:
        type: object
        required: [actor, legal_entity_ids, operating_unit_ids, site_ids, warehouse_ids, location_ids, removed]
        properties:
          actor: { type: string }
          legal_entity_ids: { type: array, items: { type: string, format: uuid } }
          operating_unit_ids: { type: array, items: { type: string, format: uuid } }
          site_ids: { type: array, items: { type: string, format: uuid } }
          warehouse_ids: { type: array, items: { type: string, format: uuid } }
          location_ids: { type: array, items: { type: string, format: uuid } }
          removed: { type: integer, minimum: 1 }
      x-depot-type: dev.depot.org.democompany.removed.v1
