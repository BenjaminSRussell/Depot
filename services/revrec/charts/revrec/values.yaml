image:
  repository: ghcr.io/benjaminsrussell/revrec
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
# DATABASE_URL is read from this secret, never from values.
databaseSecret: revrec-db
# Dev only, with migrateJob.enabled false: apply migrations at start. Otherwise the chart's migration Job (migrateJob) applies them as the owner role.
migrateOnStart: false
# Unset, the ledger postings and the GL 2400 reconciliation answer 503 REV-0200.
ledgerUrl: ""
# Legal entity id -> ledger id; required when ledgerUrl is set (rendered as REVREC_LEDGER_IDS).
ledgerIds: {}
# Billing base URL for the modification billing reporter (#29): a contract modification's price change is sent to billing's
# POST /v1/billing/contract-modifications (needs serviceIdentity.signingKeySecret). Unset, the requests wait PENDING.
billingUrl: ""
# How often the reporter sends due requests (REVREC_BILLING_INTERVAL).
billingInterval: 30s
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""
replicaCount: 2
# The credit-note consumer (#29, args [consume]): reverses the revenue schedules of
# billing's creditnote.booked (BR-29.6) so the roll-forward keeps tying to GL 2400.
# It exits at start unless service:revrec-creditnotes is seeded in the service
# principal table. Its KafkaUser, ACLs and dead-letter topic are
# deploy/kafka/revrec-consumer.yaml; off by default, like the other consumers in
# dev, until it is turned on per environment (billing's outbox connector, which
# creates depot.billing.invoice, is not deployed yet).
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: revrec-creditnotes
    username: revrec-consumer
    dlqTopic: depot.revrec.creditnotes.dlq
    secret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
service:
  port: 8080
  adminPort: 9090
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: false
  interval: 30s
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  command: []
  args: [migrate]
  ownerSecret: revrec-db-owner
  ownerSecretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [revrec]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: billing
    podNames: [billing]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
