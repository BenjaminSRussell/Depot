image:
  repository: ghcr.io/benjaminsrussell/depot/fulfillment
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

# Secret holding DATABASE_URL (and DATABASE_MIGRATOR_URL when migrations run in-process).
database:
  secretName: fulfillment-db
  secretKey: DATABASE_URL

config:
  gs1CompanyPrefix: ""          # 6 to 12 digits, required (BR-28.5)
  ssccExtensionDigit: "0"
  releaseHorizonDays: "2"       # RELEASE_HORIZON_DAYS (FR-28.1)
  releaseRequiresFullAtp: "true"
  migrateOnStart: "false"       # dev only; stage and prod run the Argo PreSync migration Job

# Inventory holds on packing-slip post (wave 33 AC2). Empty skips the check.
inventoryUrl: ""

# carrier-gateway (#482) for rate shopping, labels and tracking pulls. Empty answers the carrier routes 503 FUL-0070.
# Needs serviceIdentity.signingKeySecret; carrier-gateway must list fulfillment's public key.
carrierGatewayUrl: ""

# Sales (#496): each posted packing slip is reported to POST /v1/sales/orders/{id}:record-progress
# by a reporter in every API replica (leased, so each report is sent by one replica at a time).
# Empty queues the reports (PENDING) without sending them; they go out once this is set.
# Needs serviceIdentity.signingKeySecret; sales must list fulfillment's public key.
salesUrl: ""
salesReportInterval: "30s"      # SALES_REPORT_INTERVAL, how often due reports are looked for

# Intrastat data for packingslip.posted (#13): with both set, a post reads the customer's VAT country from party
# (party.tax-registration.read) and each product's commodity code, origin and weight from product (product.customs.read)
# and puts them on the event. Needs serviceIdentity.signingKeySecret; party and product must list fulfillment's public key.
# A failed read posts the slip without them. Empty leaves the event without Intrastat data.
partyUrl: ""
productUrl: ""

# Callers (edi reads shipments) present a signed service token verified against these
# keys, formatted name=base64-public-key and comma separated. signingKeySecret is
# required with inventoryUrl, carrierGatewayUrl or salesUrl (fulfillment signs those calls).
# List edi's public key here as edi=<base64 Ed25519 key> (the edi service signs its shipment reads, grant
# fulfillment.shipment.read, with its serviceIdentity key; the edi outbound consumer of #35 needs it).
serviceIdentity:
  publicKeys: ""
  signingKeySecret: ""
  keyId: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

serviceMonitor:
  enabled: false
  interval: 30s

# The sales order consumer (slice 19). It exits at start until
# service:fulfillment-order is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: fulfillment-order
    username: fulfillment-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [fulfillment]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: edi
    podNames: [edi]
  - name: sales
    podNames: [sales]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
