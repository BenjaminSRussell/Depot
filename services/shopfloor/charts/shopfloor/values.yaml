image:
  repository: ghcr.io/benjaminsrussell/depot/shopfloor
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

# Name of a Secret holding key DATABASE_URL (depot_app role, no BYPASSRLS).
databaseSecret:
  name: shopfloor-db
  key: DATABASE_URL

config:
  env: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  serviceName: shopfloor
  # How recently (seconds, 30 to 3600) a signer must have authenticated for an electronic signature on a PI step to be
  # accepted (21 CFR 11.200). The gateway forwards the token's auth_time as X-Depot-Auth-Time; an older one is SF-0188.
  signatureMaxAuthAgeSeconds: 300

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: false
  interval: 30s

# The CA that signs edge connector client certificates (25-4, dev and demo plant; the platform
# certificate issuer is not built). A Secret with keys ca.crt and ca.key. Empty: enrollment answers SF-0173.
edgeCa:
  secret: ""

# The platform issuer of the same certificates (25-4): cert-manager signs a CertificateRequest the service creates,
# 90 days of life, no CA key in the service. mode `cert-manager` replaces edgeCa (set one, not both). With
# createIssuer the chart makes a CA and its issuer; otherwise issuerName names an Issuer (or issuerKind
# ClusterIssuer) that already exists. The connector's request names edge:<node id>, which the service checks.
edgePki:
  mode: ""              # "" (edgeCa or none) | cert-manager
  createIssuer: true
  issuerName: ""        # default <release>-edge-ca
  issuerKind: Issuer    # Issuer | ClusterIssuer
  caDuration: 87600h

# The production operation status consumer (slice 17). It exits at start until
# service:shopfloor-production is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: shopfloor-production
    username: shopfloor-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The tenant sweeper (#25, 25-1): `shopfloor sweep` runs the andon sweep (1m), OEE rollup (15m),
# auto clock-out (1h) and process message retry (1m) for the listed tenants. "0" switches a job off.
sweeper:
  enabled: false
  tenantIds: ""        # comma-separated tenant UUIDs; with tenantSource identity, extra tenants on top of the registry's
  # config: sweep tenantIds. identity: also sweep every active tenant of the identity registry (read at the
  # start of every run). That needs identityUrl, the platform operator tenant, and a service signing key whose
  # public key identity trusts for the caller "shopfloor" (the grant shopfloor -> identity.tenant-registry.read).
  tenantSource: config
  identityUrl: ""
  operatorTenantId: ""
  signingKeySecret: ""  # Secret with key signing-key (base64 Ed25519 seed)
  keyId: ""
  andonInterval: 1m
  rollupInterval: 15m
  autoClockInterval: 1h
  retryInterval: 1m
  autoClockAfterHours: 16
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  command: []
  args: [migrate]
  ownerSecret: shopfloor-db-owner
  ownerSecretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: ""
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [shopfloor]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api, depot-edge]
  peers:
  - name: iot-edge
    podNames: [iot-edge]
  - name: processmfg
    podNames: [processmfg]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
