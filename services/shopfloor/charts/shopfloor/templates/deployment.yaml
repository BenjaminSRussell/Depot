apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shopfloor
  labels:
    app.kubernetes.io/name: shopfloor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shopfloor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopfloor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
{{- if eq .Values.edgePki.mode "cert-manager" }}
      serviceAccountName: {{ .Release.Name }}-shopfloor
{{- end }}
      containers:
        - name: shopfloor
          image: "{{ (include "depot.imageRepository" $) }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            {{- include "depot.cloudEnv" $ | nindent 12 }}
            - name: DEPOT_ENV
              value: {{ .Values.config.env | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.config.serviceName | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminAddr | quote }}
            - name: SHOPFLOOR_SIGNATURE_MAX_AUTH_AGE_SECONDS
              value: {{ .Values.config.signatureMaxAuthAgeSeconds | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: {{ .Values.databaseSecret.key }}
{{- if eq .Values.edgePki.mode "cert-manager" }}
            - name: SHOPFLOOR_EDGE_ISSUER
              value: cert-manager
            - name: SHOPFLOOR_EDGE_ISSUER_NAME
              value: {{ default (printf "%s-edge-ca" .Release.Name) .Values.edgePki.issuerName | quote }}
            - name: SHOPFLOOR_EDGE_ISSUER_KIND
              value: {{ .Values.edgePki.issuerKind | quote }}
{{- end }}
{{- if .Values.edgeCa.secret }}
            - name: SHOPFLOOR_EDGE_CA_CERT_FILE
              value: /var/run/depot/edge-ca/ca.crt
            - name: SHOPFLOOR_EDGE_CA_KEY_FILE
              value: /var/run/depot/edge-ca/ca.key
{{- end }}
{{- if .Values.identityUrl }}
            # Assigning workers to a legal entity confirms it with identity first (B-03b, grant shopfloor -> identity).
            - name: IDENTITY_URL
              value: {{ .Values.identityUrl | quote }}
            - name: DEPOT_SERVICE_NAME
              value: shopfloor
            - name: DEPOT_SERVICE_SIGNING_KEY_FILE
              value: /var/run/depot/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: DEPOT_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if or .Values.edgeCa.secret .Values.identityUrl }}
          volumeMounts:
{{- if .Values.edgeCa.secret }}
            - { name: edge-ca, mountPath: /var/run/depot/edge-ca, readOnly: true }
{{- end }}
{{- if .Values.identityUrl }}
            - { name: service-identity, mountPath: /var/run/depot/service-identity, readOnly: true }
{{- end }}
{{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if or .Values.edgeCa.secret .Values.identityUrl }}
      volumes:
{{- if .Values.edgeCa.secret }}
        - name: edge-ca
          secret:
            secretName: {{ .Values.edgeCa.secret | quote }}
            defaultMode: 0440
{{- end }}
{{- if .Values.identityUrl }}
        - name: service-identity
          secret:
            secretName: {{ required "serviceIdentity.signingKeySecret is required with identityUrl" .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
{{- end }}
