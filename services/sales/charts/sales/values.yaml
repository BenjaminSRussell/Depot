image:
  repository: ghcr.io/benjaminsrussell/depot-sales
  # Stage and prod pin the digest (cosign-signed) through Argo CD; the tag is for dev.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

serviceName: sales

config:
  depotEnv: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"

# DATABASE_URL is read from this secret (Vault via External Secrets), never inline.
databaseSecret:
  name: depot-sales-db
  key: url

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  # Callers' public keys (name[:kid]=base64 Ed25519 public key, comma separated; not secret).
  # List fulfillment's key so its packing slip reports reach :record-progress (#496,
  # sales.order.record-delivery only) and billing's for invoice reports. List edi's key as edi=<base64 Ed25519 key>
  # too: edi reads sales orders and posts channel intake orders (sales.channel.intake) with it (#35).
  publicKeys: ""

upstream:
  productUrl: "http://product:8080"
  productionUrl: "http://production:8080"
  partyUrl: "http://party:8080"
  # Prices a portal order for a product the customer has not bought before (pricing.price.resolve); empty keeps the reorder-only rule.
  pricingUrl: "http://pricing:8080"
  billingUrl: "http://billing:8080"
  fulfillmentUrl: "http://fulfillment:8080"
  inventoryUrl: "http://inventory:8080"
  receivablesUrl: "http://receivables:8080"
  returnOffsetAccount: ""

# Customer portal orders reuse the price of the customer's last approved order of a product; older than this many days is not offered.
portal:
  priceWindowDays: 365

# Field encryption (platform fieldcrypt) for the buyer of a one-time customer
# order: keysSecret is a Secret with a "keys" entry of id=base64(32 bytes)
# lines, mounted as FIELDCRYPT_KEYS_FILE; currentKeyId names the sealing key.
# Unset, one-time orders are refused (503 SLS-0054).
fieldCrypt:
  keysSecret: ""
  currentKeyId: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: sales
  command: []
  args: [migrate]
  ownerSecret: depot-sales-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: config.migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [sales]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: billing
    podNames: [billing]
  - name: customer-portal
    podNames: [customer-portal]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: edi
    podNames: [edi]
  - name: fulfillment
    podNames: [fulfillment]
  - name: planning
    podNames: [planning]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
