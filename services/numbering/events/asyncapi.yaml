asyncapi: 3.0.0
info:
  title: numbering
  version: 0.1.0
channels:
  depot.numbering.sequence:
    address: depot.numbering.sequence
    messages:
      allocated:
        $ref: '#/components/messages/allocated'
      confirmed:
        $ref: '#/components/messages/confirmed'
      voided:
        $ref: '#/components/messages/voided'
operations:
  onAllocated:
    action: send
    channel:
      $ref: '#/channels/depot.numbering.sequence'
    messages:
      - $ref: '#/channels/depot.numbering.sequence/messages/allocated'
  onConfirmed:
    action: send
    channel:
      $ref: '#/channels/depot.numbering.sequence'
    messages:
      - $ref: '#/channels/depot.numbering.sequence/messages/confirmed'
  onVoided:
    action: send
    channel:
      $ref: '#/channels/depot.numbering.sequence'
    messages:
      - $ref: '#/channels/depot.numbering.sequence/messages/voided'
components:
  messages:
    allocated:
      name: allocated
      title: Sequence number allocated
      payload:
        type: object
        required: [sequence, value, formatted, legalEntityId]
        properties:
          sequence: { type: string }
          value: { type: integer }
          formatted: { type: string }
          legalEntityId: { type: string, format: uuid }
      x-depot-type: dev.depot.numbering.sequence.allocated.v1
    confirmed:
      name: confirmed
      title: Reserved number confirmed
      payload:
        type: object
        required: [reservationId, sequence, value, formatted, legalEntityId, documentRef]
        properties:
          reservationId: { type: string, format: uuid }
          sequence: { type: string }
          value: { type: integer }
          formatted: { type: string }
          legalEntityId: { type: string, format: uuid }
          documentRef: { type: string }
      x-depot-type: dev.depot.numbering.reservation.confirmed.v1
    voided:
      name: voided
      title: Reserved number voided
      payload:
        type: object
        required: [reservationId, sequence, value, formatted, legalEntityId, reason]
        properties:
          reservationId: { type: string, format: uuid }
          sequence: { type: string }
          value: { type: integer }
          formatted: { type: string }
          legalEntityId: { type: string, format: uuid }
          reason: { type: string }
      x-depot-type: dev.depot.numbering.reservation.voided.v1
