openapi: 3.1.0
info:
  title: numbering
  version: 0.1.0
  description: Per-legal-entity number sequences with gap-free allocation for fiscal documents.
servers:
  - url: https://app.local.depot.dev
paths:
  /v1/numbering/sequences:
    get:
      operationId: listSequences
      summary: "List the number sequences in the caller's legal-entity scope"
      description: Sequences of every legal entity the caller's claim covers (all of the tenant's for an all-scope caller), in id order, each with the number its next allocation issues. A caller with no legal-entity scope gets 403 AUTH-0003.
      x-depot-duty: numbering.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One page of sequences.
          content: { application/json: { schema: { $ref: '#/components/schemas/SequencePage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSequence
      summary: "Create a number sequence for a legal entity"
      x-depot-duty: numbering.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSequence' } } }
      responses:
        '201':
          description: Sequence created, or the original on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sequence' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}:
    get:
      operationId: getSequence
      summary: "Get a number sequence"
      x-depot-duty: numbering.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sequence definition.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sequence' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}/next:
    post:
      operationId: allocateNext
      summary: "Allocate the next number of a sequence"
      x-depot-duty: numbering.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '200':
          description: Next value. Gap-free sequences never skip or repeat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Issued' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-depot-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-depot-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    CreateSequence:
      type: object
      additionalProperties: false
      required: [code, name, format, legalEntityId, mode]
      properties:
        code: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        format: { type: string, description: 'Exactly one {######} or {000000} token' }
        legalEntityId: { type: string, format: uuid }
        mode: { type: string, enum: [gap_free, continuous, non_continuous] }
        startFrom: { type: integer, minimum: 1, default: 1 }
    Sequence:
      type: object
      required: [id, code, name, format, legalEntityId, mode, startFrom]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        format: { type: string }
        legalEntityId: { type: string, format: uuid }
        mode: { type: string, enum: [gap_free, continuous, non_continuous] }
        startFrom: { type: integer }
    ListedSequence:
      allOf:
        - $ref: '#/components/schemas/Sequence'
        - type: object
          required: [nextValue]
          properties:
            nextValue: { type: integer, description: The value the next allocation issues; startFrom before the first. }
            nextFormatted: { type: string, description: nextValue in the sequence's format; absent when the padded width is exhausted. }
    SequencePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ListedSequence' } }
        nextCursor: { type: string, description: Absent on the last page. }
    Issued:
      type: object
      required: [value, formatted, sequence, legalEntityId]
      properties:
        value: { type: integer }
        formatted: { type: string }
        sequence: { type: string }
        legalEntityId: { type: string, format: uuid }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
