openapi: 3.1.0
info:
  title: numbering
  version: 0.1.0
  description: Per-legal-entity number sequences with gap-free allocation for fiscal documents.
servers:
  - url: https://app.local.depot.dev
paths:
  /v1/numbering/sequences:
    get:
      operationId: listSequences
      summary: "List number sequences in the caller's legal-entity scope"
      x-depot-duty: numbering.read
      parameters:
        - { name: after, in: query, schema: { type: string, format: uuid }, description: 'Cursor: the next value of the previous page' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page in id order. next is empty on the last page.
          content: { application/json: { schema: { $ref: '#/components/schemas/SequencePage' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSequence
      summary: "Create a number sequence for a legal entity"
      x-depot-duty: numbering.write
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSequence' } } }
      responses:
        '201':
          description: Sequence created, or the original on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sequence' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}:
    get:
      operationId: getSequence
      summary: "Get a number sequence"
      x-depot-duty: numbering.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sequence definition.
          content: { application/json: { schema: { $ref: '#/components/schemas/Sequence' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}/next:
    post:
      operationId: allocateNext
      summary: "Allocate the next number of a sequence"
      x-depot-duty: numbering.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        '200':
          description: Next value. Gap-free sequences never skip or repeat.
          content: { application/json: { schema: { $ref: '#/components/schemas/Issued' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}/reserve:
    post:
      operationId: reserveNumber
      summary: "Reserve the next number of a sequence until it is confirmed, voided or its lease expires"
      x-depot-duty: numbering.write
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReserveNumber' } } }
      responses:
        '201':
          description: Reserved number, or the original on an Idempotency-Key replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/reservations/{id}/confirm:
    post:
      operationId: confirmReservation
      summary: "Confirm a reservation once the document that carries the number is committed"
      x-depot-duty: numbering.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmReservation' } } }
      responses:
        '200':
          description: Confirmed reservation.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        '404': { description: 'NUM-0007 reservation not found.' }
        '409': { description: 'NUM-0005 the lease expired and the number was voided, or NUM-0006 the reservation is already confirmed or voided.' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/reservations/{id}/void:
    post:
      operationId: voidReservation
      summary: "Void a reservation; the number is logged and never offered again"
      x-depot-duty: numbering.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoidReservation' } } }
      responses:
        '200':
          description: Voided reservation.
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        '404': { description: 'NUM-0007 reservation not found.' }
        '409': { description: 'NUM-0006 the reservation is already confirmed or voided.' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/numbering/sequences/{code}/voided:
    get:
      operationId: listVoidedNumbers
      summary: "Voided-number log of a sequence; overdue leases are voided first"
      x-depot-duty: numbering.read
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: One page in id order. next is empty on the last page.
          content: { application/json: { schema: { $ref: '#/components/schemas/VoidedPage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-depot-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-depot-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    CreateSequence:
      type: object
      additionalProperties: false
      required: [code, name, format, legalEntityId, mode]
      properties:
        code: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        format: { type: string, description: 'Exactly one {######} or {000000} token' }
        legalEntityId: { type: string, format: uuid }
        mode: { type: string, enum: [gap_free, continuous, non_continuous] }
        startFrom: { type: integer, minimum: 1, default: 1 }
    Sequence:
      type: object
      required: [id, code, name, format, legalEntityId, mode, startFrom]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        format: { type: string }
        legalEntityId: { type: string, format: uuid }
        mode: { type: string, enum: [gap_free, continuous, non_continuous] }
        startFrom: { type: integer }
    SequencePage:
      type: object
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Sequence' } }
        next: { type: string }
    Issued:
      type: object
      required: [value, formatted, sequence, legalEntityId]
      properties:
        value: { type: integer }
        formatted: { type: string }
        sequence: { type: string }
        legalEntityId: { type: string, format: uuid }
    ReserveNumber:
      type: object
      additionalProperties: false
      properties:
        leaseSeconds: { type: integer, minimum: 1, maximum: 3600, default: 300 }
    ConfirmReservation:
      type: object
      additionalProperties: false
      required: [documentRef]
      properties:
        documentRef: { type: string, minLength: 1, maxLength: 200 }
    VoidReservation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
    Reservation:
      type: object
      required: [id, sequence, legalEntityId, value, formatted, status, leaseExpiresAt]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: string }
        legalEntityId: { type: string, format: uuid }
        value: { type: integer }
        formatted: { type: string }
        status: { type: string, enum: [reserved, confirmed, voided] }
        leaseExpiresAt: { type: string, format: date-time }
        documentRef: { type: string }
        voidReason: { type: string }
    VoidedNumber:
      type: object
      required: [id, value, formatted, reason, voidedAt]
      properties:
        id: { type: string, format: uuid }
        value: { type: integer }
        formatted: { type: string }
        reason: { type: string }
        voidedAt: { type: string, format: date-time }
    VoidedPage:
      type: object
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VoidedNumber' } }
        next: { type: string }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
