image: { repository: ghcr.io/benjaminsrussell/depot-customer-portal, digest: "", tag: "", pullPolicy: IfNotPresent }
# One replica unless sessionStore.url is set: without a shared store sessions live in the pod's memory, a restart signs everyone out and a
# second replica would not know the first one's sessions, so the chart refuses replicaCount > 1 then. The rate limiter stays per pod.
replicaCount: 1
sessionStore:
  # redis:// or rediss:// (TLS) URL of a Valkey or Redis server in the cluster, e.g. redis://valkey.valkey.svc:6379. Empty: in memory.
  url: ""
  # Secret holding the server's password under passwordSecretKey; empty when the server has none.
  passwordSecretName: ""
  passwordSecretKey: password
  # The namespace and port the network policy opens egress to when url is set.
  namespace: valkey
  port: 6379
oidc:
  # The Keycloak realm URL, e.g. https://keycloak.<env>.depot.dev/realms/depot. Required.
  issuer: ""
  clientId: depot-portal-customer
  # The redirect URI registered on the client: https://customer.<env>.depot.dev/bff/callback
  redirectUri: ""
  # Secret holding the client secret under the key "client-secret". Created outside Git.
  clientSecretName: customer-portal-oidc
# The origin the app is served from, e.g. https://customer.<env>.depot.dev. Required.
appOrigin: ""
# Owning services, as in-cluster URLs.
upstreams:
  receivables: http://receivables.receivables.svc:8080
  billing: http://billing.billing.svc:8080
  sales: http://sales.sales.svc:8080
  party: http://party.party.svc:8080
  identity: http://identity.identity.svc:8080
  # Renders the invoice and statement PDFs from what the portal read (print.customer-portal.render) and serves the documents print delivered to the portal (print.customer-portal.documents).
  print: http://print.print.svc:8080
# Secret holding this service's Ed25519 seed under the key "signing-key". Its public key is added to
# DEPOT_SERVICE_PUBLIC_KEYS of receivables, billing, sales, party, identity and print as customer-portal=...
serviceSigningSecretName: customer-portal-signing
resources:
  requests: { cpu: 25m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  upstreamNamespaces: [receivables, billing, sales, party, identity, print]
  # Keycloak is reached on 443.
  identityProviderCidr: 0.0.0.0/0

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [customer-portal]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-portals]
  peers: []
  metricsPorts: []
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
