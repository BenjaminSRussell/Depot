image:
  repository: ghcr.io/benjaminsrussell/search
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: search-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor:
  enabled: false
# The index consumer (args [consume]) keeps the index current from the events of
# every searchable record type. It exits at start unless service:search-index
# is seeded in the service principal table. Its KafkaUser, ACLs and dead-letter
# topic are deploy/kafka/search-consumer.yaml; off by default, like the other
# consumers in dev, until it is turned on per environment.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: search-index
    username: search-consumer
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [search]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
