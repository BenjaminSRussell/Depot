image:
  repository: ghcr.io/benjaminsrussell/depot-hr
  # Digest-pin in deploy/ (Argo CD sync); the tag is for local k3d use only.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  httpPort: 8080
  adminPort: 9090

# DATABASE_URL, FIELDCRYPT_CURRENT_KEY_ID and the legacy HR_PII_KEY (opens values written before
# fieldcrypt; optional, remove it once `hr reseal-pii` reports rewritten=0 for every tenant) are read
# from this secret (Vault via External Secrets). Its FIELDCRYPT_KEYS entry is mounted as the file
# /var/run/depot/field-crypt/keys (FIELDCRYPT_KEYS_FILE), not passed in the environment.
secret:
  name: depot-hr-secrets
  databaseUrlKey: DATABASE_URL
  piiKeyKey: HR_PII_KEY
  fieldcryptKeysKey: FIELDCRYPT_KEYS
  fieldcryptCurrentKeyIdKey: FIELDCRYPT_CURRENT_KEY_ID

config:
  managerMaxDepth: "10"
  migrateOnStart: "false"
  # Comma-separated tenant UUIDs the in-process due personnel-action sweep (#263) runs for; empty disables it.
  actionSweepTenantIds: ""
  actionSweepInterval: "15m"
  # Kill switch for POST /v1/hr/candidates/purge and the retention-purge CronJob; "false" turns both off.
  retentionPurgeEnabled: "true"
  # DEPOT_PHI_READ_AUDIT: records every read of protected health information (benefits elections, life events) in the
  # audit service before the data is returned (#606). "" or "auto" follows the cloud profile (on when global.cloudOverlays
  # includes hipaa); "true" forces it on, "false" off. When on, the pod needs auditUrl and serviceIdentity.signingKeySecret,
  # and audit must list this service's public key (audit chart serviceIdentity.publicKeys).
  phiReadAudit: ""

# CronJob running `hr reseal-pii <tenant-id>...` (#335). Idempotent: a tenant with nothing legacy logs rewritten=0.
# Tenants are listed because the app role cannot enumerate them. Off by default.
reseal:
  enabled: false
  schedule: "17 3 * * *"
  tenantIds: []

# CronJobs running `hr accrue`, `hr carryover-expiry` and `hr retention-purge` for the listed tenants (#267, #266).
# Tenants are listed because the app role cannot enumerate them. All are idempotent and off by default.
# retentionPurge checks compliance legal holds per candidate and needs serviceIdentity.signingKeySecret.
accrue:
  enabled: false
  schedule: "30 2 * * *"
  tenantIds: []
carryoverExpiry:
  enabled: false
  schedule: "45 2 * * *"
  tenantIds: []
retentionPurge:
  enabled: false
  schedule: "15 4 * * *"
  tenantIds: []

# Defaults to http://compliance-compliance.<namespace>.svc:8080.
complianceUrl: ""

# The audit service that receives PHI read records (AUDIT_URL). Defaults to http://audit-audit.<namespace>.svc:8080.
auditUrl: ""

# Requisitions without a requisitionNumber take the next number of the REQ sequence from numbering (#266).
numberingUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  # Lets the non-root user read the 0440 field-crypt key file.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: depot-hr
  command: []
  args: [migrate]
  ownerSecret: depot-hr-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: config.migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [depot-hr, depot-hr-accrue, depot-hr-carryover-expiry, depot-hr-reseal-pii, depot-hr-retention-purge]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: budgeting
    podNames: [budgeting]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
