image: { repository: ghcr.io/benjaminsrussell/processmfg, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: processmfg-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# Service calls. identityUrl switches the process-manufacturing feature gate on; shopfloorUrl makes releasing a
# batch order generate its control recipe (the item's recipe target says where it goes). Both sign their calls
# with serviceIdentity.signingKeySecret (key signing-key, a base64 Ed25519 seed) whose public key identity and
# shopfloor trust for the caller "processmfg".
identityUrl: ""
shopfloorUrl: ""
serviceIdentity: { signingKeySecret: "", keyId: "" }

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [processmfg]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
