image:
  repository: ghcr.io/benjaminsrussell/fx
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: fx-db
migrateOnStart: false
# Public keys of the services that call fx with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). payables
# reads rates this way (#305).
serviceIdentity:
  publicKeys: ""
replicaCount: 1
import:
  tenantId: ""
  provider: ecb
  rateType: ""
  interval: 1h
  providerTimeoutSeconds: 10
  oxrSecret: ""
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  ecbStaleDays: 4
  oxrStaleDays: 2

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [fx]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: consolidation
    podNames: [consolidation]
  - name: intercompany
    podNames: [intercompany, intercompany-reconcile]
  - name: ledger
    podNames: [ledger]
  - name: payables
    podNames: [payables]
  - name: receivables
    podNames: [depot-receivables, receivables]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
