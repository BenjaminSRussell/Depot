image:
  repository: ghcr.io/benjaminsrussell/depot/purchasing
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

# DATABASE_URL is read from this secret (key "url"); never inline credentials.
database:
  secretName: purchasing-db
  secretKey: url

# Public keys of the services that call purchasing with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). receiving
# reports settled invoicing-plan rows this way (#289). List edi's public key as edi=<base64 Ed25519 key>: edi creates
# requisitions from punchout returns (procurement.requisition.create) and, for inbound cXML, confirms purchase orders (#35).
serviceIdentity:
  publicKeys: ""
  # purchasing signs its calls to budgeting (budget.encumbrance.convert, budget.requisition.check) with this Secret's key "signing-key", mounted at
  # /var/run/depot/service-identity. Add purchasing's public key to budgeting's serviceIdentity.publicKeys first.
  signingKeySecret: ""
  keyId: ""

# Base URLs of the services purchasing calls. budgeting checks an approved requisition and reserves its lines as pre-encumbrances,
# gives them back when it is cancelled, and converts a line's pre-encumbrance when a PO line is created from it (FR-38.5). Unset,
# requisitions are approved unchecked, nothing is converted and purchasing logs a warning at start.
serviceUrls:
  budgeting: ""
  # product answers whether a requisition or PO line's product is blocked for purchasing (FR-8.10); unset, no block is enforced. Needs serviceIdentity.signingKeySecret.
  product: ""

env:
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

# The inbound consumer (slice 18): follows fulfillment's dropship.closed.v1 and
# dropship.cancelled.v1 (slice 19) and planning's message.applied.v1 and changes the purchase orders they name. It exits at start until
# service:purchasing-inbound is seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: purchasing-inbound
    username: purchasing-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# CronJob running `purchasing budget-calls-retry <tenant-id>...` (FR-38.5): repeats the calls to budgeting that failed (a requisition
# line's pre-encumbrance converted into its PO line's encumbrance, or given back when a requisition was cancelled), the same work as
# POST /v1/procurement/budget-calls:retry. Needs serviceUrls.budgeting and serviceIdentity.signingKeySecret. Tenants are listed
# because the app role cannot enumerate them. The job fails while a tenant still has calls budgeting did not accept.
budgetCallsRetry:
  enabled: false
  schedule: "*/15 * * * *"
  tenantIds: []

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: purchasing
  command: []
  args: [migrate]
  ownerSecret: purchasing-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: env.migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [purchasing, purchasing-budget-calls-retry]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: batch
    namespace: batch
    podNames: [batch]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: edi
    podNames: [edi]
  - name: receiving
    podNames: [receiving]
  - name: supplier-portal
    podNames: [supplier-portal]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
