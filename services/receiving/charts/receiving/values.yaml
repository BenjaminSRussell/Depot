image:
  repository: ghcr.io/benjaminsrussell/receiving
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: receiving-db
auditSeedSecret: receiving-audit-seed
migrateOnStart: false
serviceUrls:
  ledger: ""
  close: ""
  purchasing: ""
  inventory: ""
  party: ""
  product: ""   # with party, receipt.posted carries Intrastat data (#13); the product service must list receiving's public key
  org: ""
  tax: ""
  compliance: ""
# postingProfile values are required outside dev: the pod exits at startup with "POSTING_LEDGER_ID is required" when ledgerId is empty.
# serviceUrls.purchasing defaults to http://purchasing-purchasing.<namespace>.svc, the Service the purchasing chart renders for a release named "purchasing".
postingProfile:
  ledgerId: ""
  inventoryAccount: ""
  grirAccount: ""
  ppvAccount: ""
  vendorControlAccount: ""
  expenseAccount: ""
  inputTaxAccount: ""
# tax.rules is required when serviceUrls.tax is set: a JSON array of {"country","code","jurisdiction","ratePct"}, one entry per legal entity country.
# A receipt whose legal entity country has no rule is skipped as TAX_NOT_DETERMINED; it is never settled at zero tax.
tax:
  rules: ""
# legalEntityCountries maps legal entity ids to ISO country codes ("<uuid>=GB,<uuid>=DE"); one-time payee erasure keeps every payee of an entity that is not listed.
legalEntityCountries: ""
# ocrProvider selects the invoice OCR extractor: "" (OCR captures answer 503) or "local" (reads the text layer of a PDF; no network, no key).
ocrProvider: ""
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor:
  enabled: true
  interval: 30s
alerts:
  enabled: true
  labels: {}
  severity: page
  errorRatio: 0.01
  p99LatencySeconds: 4

# publicKeys: the services that call receiving with a signed service token, as name[:kid]=base64 Ed25519 key, comma separated (not
# secret). List edi's key as edi=<key>: an inbound cXML ship notice becomes an ASN (receiving.asn.maintain, #35).
serviceIdentity:
  publicKeys: ""
  signingKeySecret: ""
  keyId: ""

fieldCrypt:
  keysSecret: ""
  currentKeyId: ""

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: receiving-ers
    username: receiving-consumer
    secret: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  command: []
  args: [migrate]
  ownerSecret: receiving-db-owner
  ownerSecretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [receiving]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: edi
    podNames: [edi]
  - name: supplier-portal
    podNames: [supplier-portal]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
