image: { repository: ghcr.io/benjaminsrussell/production, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: production-db
migrateOnStart: false
replicaCount: 3
# PRD 4.21.10: HPA on CPU 70%, never below the 3 replicas.
autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
# PRD 4.21.13 parameters read by the service.
config:
  rafTolerancePct: "0"
  overConsumptionPct: "10"
  autoStartOnFeedback: "true"
  estimateOnCreate: "false"
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor: { enabled: false }

ledgerUrl: ""
# The migration clearing account the opening WIP is credited to; empty and an opening WIP import is refused (PRD-OPB-005).
openingClearingAccount: ""
inventoryUrl: ""
# productUrl: the product service that releasedProductId reads order quantity rules from (FR-21.1); needs serviceIdentity.
productUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# The planned order consumer (slice 25). It exits at start until service:production-planning is
# seeded in the service principal table.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: production-planning
    username: production-consumer
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# The shop-floor job card consumer (#481): registration.posted and .corrected into job cards at the
# worker cost rate, as service:production-shopfloor.
shopfloorConsumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: production-shopfloor
    username: production-shopfloor-consumer
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: production
  command: []
  args: [migrate]
  ownerSecret: production-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [production]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: sales
    podNames: [sales]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
