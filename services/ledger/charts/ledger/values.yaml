replicaCount: 3

image:
  repository: ghcr.io/benjaminsrussell/depot-ledger
  tag: ""
  # Set to a sha256 digest in Argo CD overlays (digest-pinned sync).
  digest: ""
  pullPolicy: IfNotPresent

# Name of the Secret holding DATABASE_URL (depot_app role, no BYPASSRLS).
databaseSecret: ledger-db-app

# Dev only: apply migrations on start. Stage and prod run them as an Argo PreSync Job.
migrateOnStart: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false

# The ledger refuses to start unless closeUrl is set or periodCheck is "disabled"
# (dev and test only; it logs a warning).
closeUrl: ""
fxUrl: ""
periodCheck: ""
idempotencyTtlDays: 400
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [ledger]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: analytics
    podNames: [analytics]
  - name: assets
    podNames: [assets]
  - name: batch
    namespace: batch
    podNames: [batch]
  - name: billing
    podNames: [billing]
  - name: budgeting
    podNames: [budgeting]
  - name: close
    podNames: [close]
  - name: consolidation
    podNames: [consolidation]
  - name: costacct
    podNames: [costacct, costacct-cost-gl-reconcile]
  - name: costing
    podNames: [costing]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: eam
    podNames: [eam]
  - name: expense
    podNames: [expense]
  - name: finreport
    podNames: [finreport]
  - name: intercompany
    podNames: [intercompany, intercompany-reconcile]
  - name: inventory
    podNames: [inventory]
  - name: payables
    podNames: [payables]
  - name: payroll
    podNames: [payroll]
  - name: productcost
    podNames: [productcost]
  - name: production
    podNames: [production]
  - name: projects
    podNames: [projects]
  - name: receivables
    podNames: [depot-receivables, receivables]
  - name: receiving
    podNames: [receiving]
  - name: revrec
    podNames: [revrec]
  - name: tax
    podNames: [tax, tax-consumer]
  - name: treasury
    podNames: [treasury]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
