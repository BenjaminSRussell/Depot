replicaCount: 3

image:
  repository: ghcr.io/benjaminsrussell/depot-ledger
  tag: ""
  # Set to a sha256 digest in Argo CD overlays (digest-pinned sync).
  digest: ""
  pullPolicy: IfNotPresent

# Name of the Secret holding DATABASE_URL (depot_app role, no BYPASSRLS).
databaseSecret: ledger-db-app

# Dev only, with migrateJob.enabled false: apply migrations on start. Otherwise the chart's migration Job (migrateJob) applies them as the owner role.
migrateOnStart: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceMonitor:
  enabled: false

# The ledger refuses to start unless closeUrl is set or periodCheck is "disabled"
# (dev and test only; it logs a warning).
closeUrl: ""
fxUrl: ""
periodCheck: ""
idempotencyTtlDays: 400
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: ledger
  command: []
  args: [migrate]
  ownerSecret: ledger-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [ledger]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: analytics
    podNames: [analytics]
  - name: assets
    podNames: [assets]
  - name: batch
    namespace: batch
    podNames: [batch]
  - name: billing
    podNames: [billing]
  - name: budgeting
    podNames: [budgeting]
  - name: close
    podNames: [close]
  - name: consolidation
    podNames: [consolidation]
  - name: costacct
    podNames: [costacct, costacct-cost-gl-reconcile]
  - name: costing
    podNames: [costing]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: eam
    podNames: [eam]
  - name: expense
    podNames: [expense]
  - name: finreport
    podNames: [finreport]
  - name: fulfillment
    podNames: [fulfillment]
  - name: intercompany
    podNames: [intercompany, intercompany-reconcile]
  - name: inventory
    podNames: [inventory]
  - name: payables
    podNames: [payables]
  - name: payroll
    podNames: [payroll]
  - name: productcost
    podNames: [productcost]
  - name: production
    podNames: [production]
  - name: projects
    podNames: [projects]
  - name: receivables
    podNames: [depot-receivables, receivables]
  - name: receiving
    podNames: [receiving]
  - name: revrec
    podNames: [revrec]
  - name: tax
    podNames: [tax, tax-consumer]
  - name: treasury
    podNames: [treasury]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
