image: { repository: ghcr.io/benjaminsrussell/mcp-gateway, digest: "", tag: "", pullPolicy: IfNotPresent }
# Base URL of the Depot API the gateway forwards user tokens to (edge routes /api/v1).
apiUrl: http://depot-api.depot.svc.cluster.local:8080
# ConfigMap holding the OpenAPI document as JSON, generated at deploy time from the services' specs.
openApi: { configMap: mcp-gateway-openapi, key: openapi.json }
replicaCount: 3
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 500m, memory: 256Mi }
# /metrics is served on the admin port 9090. Off by default like every service
# chart: enable it where the Prometheus Operator CRDs are installed.
serviceMonitor: { enabled: false }

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [mcp-gateway]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: agent-runtime
    podNames: [agent-runtime]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
