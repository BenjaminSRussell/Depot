image: { repository: ghcr.io/benjaminsrussell/tax, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: tax-db
migrateOnStart: false
ledgerUrl: ""
providerTimeoutMs: 2000
# External tax providers. A provider is on when its url is set; its credentials come from the named Secret (Vault-synced),
# never from values. Avalara keys: account-id, license-key. Vertex keys: client-id, client-secret, username, password.
providers:
  avalara: { url: "", companyCode: "", secret: tax-avalara }
  vertex: { url: "", tokenUrl: "", company: "", secret: tax-vertex }
# With tenantIds set (and ledgerUrl), every replica settles the previous calendar month of each legal entity that has a ledger
# configuration, once a month on `day` (1 to 28) at `at` (UTC): the reconciliation to the GL tax accounts is the one POST
# /v1/tax/settlements:run makes, so a month that differs is refused and logged. Replicas running together settle nothing twice.
settlement:
  tenantIds: []
  day: 5
  at: "04:00"
# With tenantIds set, every replica drains the recommit queue of the tenants' legal entities every interval (a document the internal
# engine calculated while a provider was down is recalculated on the provider once it is back).
recommit:
  tenantIds: []
  interval: 5m
# The Intrastat feed consumer (#13, args [consume]): stages the EU cross-border movements of fulfillment's packingslip.posted and
# receiving's receipt.posted. It exits at start unless service:tax-intrastat is seeded in the service principal table. Its KafkaUser,
# ACLs and dead-letter topic are deploy/kafka/tax-consumer.yaml; off by default, like the other consumers in dev, until it is turned
# on per environment (the outbox-fulfillment and outbox-receiving connectors create its source topics).
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: tax-intrastat
    username: tax-consumer
    dlqTopic: depot.tax.intrastat.dlq
    secret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: tax
  command: []
  args: [migrate]
  ownerSecret: tax-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [tax, tax-consumer]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: billing
    podNames: [billing]
  - name: edi
    podNames: [edi]
  - name: intercompany
    podNames: [intercompany, intercompany-reconcile]
  - name: payables
    podNames: [payables]
  - name: receivables
    podNames: [depot-receivables, receivables]
  - name: receiving
    podNames: [receiving]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
