image:
  repository: ghcr.io/benjaminsrussell/depot-compliance
  # Stage and prod pin the digest (cosign-signed) through Argo CD; the tag is for dev.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

serviceName: compliance

config:
  depotEnv: dev
  httpAddr: ":8080"
  adminAddr: ":9090"
  migrateOnStart: "false"
  # Tenant policies until per-tenant settings exist (PRD §9.48.13).
  sodBlockHigh: "true"
  sodMaxMitigationDays: "365"
  auditCaseArchiveDays: "365"
  breakglassMaxMinutes: "60"
  breakglassSelfActivate: "false"
  breakglassReviewDays: "3"
  screeningThreshold: "0.88"
  # BLOCK, WARN or OFF; one value for every legal entity until per-entity settings exist.
  tradeLicenseCheck: "BLOCK"

# DATABASE_URL is read from this secret (Vault via External Secrets), never inline.
databaseSecret:
  name: depot-compliance-db
  key: url

# Erasure pseudonyms are HMACs under a per-tenant key derived from these keys; without them erasure
# previews return 503 PRV-1211. Mount a secret holding id=base64(32 bytes) lines under the key "keys".
fieldCrypt:
  keysSecret: ""
  currentKeyId: ""

# Service tokens from receiving (the legal hold check); publicKeys is the DEPOT_SERVICE_PUBLIC_KEYS value.
serviceIdentity:
  publicKeys: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [compliance]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: hr
    podNames: [depot-hr, depot-hr-accrue, depot-hr-carryover-expiry, depot-hr-reseal-pii, depot-hr-retention-purge]
  - name: receiving
    podNames: [receiving]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
