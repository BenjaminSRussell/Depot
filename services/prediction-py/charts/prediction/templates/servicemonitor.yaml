{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /metrics
{{- end }}
