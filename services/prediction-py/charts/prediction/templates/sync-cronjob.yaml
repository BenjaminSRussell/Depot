{{- if .Values.sync.enabled }}
{{- range $job, $schedule := dict "weekly" .Values.sync.weeklySchedule "delta" .Values.sync.deltaSchedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-sync-{{ $job }}
  labels:
    app.kubernetes.io/name: prediction-sync
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: sync-{{ $job }}
spec:
  schedule: {{ $schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prediction-sync
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: sync-{{ $job }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: service-identity
              secret:
                secretName: {{ required "sync.signingKeySecret is needed to read receivables" $.Values.sync.signingKeySecret }}
                defaultMode: 0440
          containers:
            - name: sync
              image: {{ include "prediction.image" $ | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["python", "-m", "prediction.sync", {{ $job | quote }}]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: {{ $.Values.databaseSecret | quote }}, key: DATABASE_URL }
                - name: PREDICTION_MIN_ROWS
                  value: {{ $.Values.minRows | quote }}
                - name: PREDICTION_MAE_MAX_DAYS
                  value: {{ $.Values.maeMaxDays | quote }}
                - name: RECEIVABLES_URL
                  value: {{ required "sync.receivablesUrl is needed to read receivables" $.Values.sync.receivablesUrl | quote }}
                - name: PREDICTION_SYNC_SCOPES
                  value: {{ required "sync.scopes is needed: the tenants and legal entities to read" $.Values.sync.scopes | quote }}
                - name: PASSAGE_SERVICE_NAME
                  value: prediction
                - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
                  value: /var/run/passage/service-identity/signing-key
                {{- if $.Values.sync.keyId }}
                - name: PASSAGE_SERVICE_KEY_ID
                  value: {{ $.Values.sync.keyId | quote }}
                {{- end }}
              resources:
                {{- toYaml $.Values.sync.resources | nindent 16 }}
{{- end }}
{{- end }}
