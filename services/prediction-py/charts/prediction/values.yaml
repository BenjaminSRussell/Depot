image: { repository: ghcr.io/benjaminsrussell/prediction, digest: "", tag: "", pullPolicy: IfNotPresent }
# Models, predictions, per-tenant settings and the outbox live in Postgres, so every replica serves the same state.
replicaCount: 2
# Secret with the key DATABASE_URL (database depot_prediction, role depot_app).
databaseSecret: prediction-db
# Dev only, with migrateJob.enabled false: run the migrations at start. Otherwise the chart's migration Job (migrateJob) applies them as the owner role.
migrateOnStart: false
# Service-wide defaults of prediction.payment.min_rows (100 to 10000) and mae_max_days (1 to 30); a tenant's own
# settings (PUT /v1/predictions/payment/settings) take precedence.
minRows: 500
maeMaxDays: 6
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
serviceMonitor: { enabled: false }
# The feed from receivables (#47, BR-47.12): a weekly retrain on the paid invoices, then a rescore of the open ones, and a delta
# every few minutes that rescores the open invoices that changed (a settlement, a dunning step, a dispute) and stamps the paid date on
# the ones that were paid. Off by default: it needs the receivables address, the service signing key and the scope below.
sync:
  enabled: false
  receivablesUrl: ""
  # JSON list of {"tenantId": "<uuid>", "legalEntityIds": ["<uuid>", ...]}: the tenants and legal entities the jobs read.
  scopes: ""
  # Secret with the key `signing-key` (the base64 32-byte Ed25519 seed of the service `prediction`); receivables lists its public key as
  # `prediction=<key>` in serviceIdentity.publicKeys.
  signingKeySecret: ""
  keyId: ""
  weeklySchedule: "17 3 * * 0"
  deltaSchedule: "*/15 * * * *"
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
# Recompute on receivables events (#47, BR-47.12): consumes the receivables payment, credit settlement, dispute, dunning letter,
# deduction, down payment and opening-item events and rescores the invoices they touch right away, instead of at the next delta. Each
# event is recorded in consumer_inbox, so a redelivery is not handled twice. It reads receivables with the same address, service identity
# and key as `sync` (set those too), so the delta CronJob keeps running as the safety net. Off by default: it needs a broker, and
# receivables' outbox published to depot.receivables.* (no outbox connector for receivables exists in deploy/kafka/connect.yaml yet).
consumer:
  enabled: false
  # Kafka bootstrap servers, comma separated.
  brokers: ""
  # Empty means the receivables topics the consumer handles (src/prediction/consumer.py DEFAULT_TOPICS).
  topics: []
  replicaCount: 1
  # SCRAM-SHA-512 over TLS, as the cluster requires (deploy/kafka/kafka.yaml). The secret holds the KafkaUser's `password` and the
  # cluster CA as `ca.crt`; deploy/kafka/prediction-consumer.yaml creates the user with read ACLs on the receivables topics and the group.
  # Without a secret the consumer uses the plain listener (dev only).
  kafka:
    username: prediction-consumer
    group: prediction
    secret: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  command: [python, -m, prediction.migrate]
  args: []
  ownerSecret: prediction-db-owner
  ownerSecretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [prediction, prediction-consumer, prediction-sync]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [8080]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
