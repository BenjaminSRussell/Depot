asyncapi: 3.0.0
info:
  title: Depot payment prediction events
  version: 0.1.0
  description: |
    PRD 9.47 FR-47.15 events, CloudEvents 1.0 envelope; the schema below is the data member, snake_case as in the
    other services' events. `POST /api/v1/predictions/payment/score` writes one
    dev.depot.prediction.payment.scored.v1 row per invoice to this service's outbox in the scoring transaction
    (src/prediction/store.py). The `outbox-prediction-py` connector (deploy/kafka/connect.yaml) relays it to
    depot.prediction.payment (routed by event type: dev.depot.prediction.<entity>.<verb>.v<n> goes to depot.prediction.<entity>).
    The service also consumes receivables events (payment, credit settlement, dispute, dunning letter, deduction, down payment and
    opening-item events, see the receivables asyncapi) to rescore the invoices they touch, with consumer_inbox dedupe
    (src/prediction/consumer.py).
defaultContentType: application/cloudevents+json
channels:
  paymentScored:
    address: depot.prediction.payment
    description: Outbox relay topic for payment predictions, one event per scored invoice.
    messages:
      paymentScored:
        $ref: "#/components/messages/PaymentScored"
operations:
  publishPaymentScored:
    action: send
    channel:
      $ref: "#/channels/paymentScored"
    summary: Written per invoice in the scoring transaction (src/prediction/store.py).
    messages:
      - $ref: "#/channels/paymentScored/messages/paymentScored"
components:
  messages:
    PaymentScored:
      name: dev.depot.prediction.payment.scored.v1
      summary: An invoice's payment date was predicted
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/PaymentScoredData"
  schemas:
    EventTypes:
      type: string
      enum:
        - dev.depot.prediction.payment.scored.v1
    PaymentScoredData:
      type: object
      description: The prediction only; no customer, amount or invoice text.
      required: [invoice_id, model_version, predicted_payment_date, p_late_30d, scored_at]
      additionalProperties: false
      properties:
        invoice_id: { type: string, minLength: 1, maxLength: 64 }
        model_version: { type: string }
        predicted_payment_date: { type: string, format: date }
        p_late_30d: { type: string, pattern: "^[01]\\.[0-9]{4}$" }
        scored_at: { type: string, format: date-time }
