image: { repository: ghcr.io/benjaminsrussell/print, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: print-db
migrateOnStart: false
replicaCount: 2
# PRINT_RETRY (print_retry_count): retries on a printer after its first attempt, before
# the queue fails over to the next printer (0-10). 1 gives the two attempts of FR-32.13.
printRetry: 1
# PRINT_JOB_RETENTION_DAYS: job log retention before purge, in days (1-365).
jobRetentionDays: 30
# PRINT_PURGE_TENANT_IDS: tenants whose job log is purged daily at 01:00 UTC. Empty
# disables the schedule; POST /print/v1/jobs:purge still works on demand.
purgeTenantIds: []
# Scheduled statements (#46): the runner reads open items from receivables and customer names from party under a signed service
# grant (print -> receivables receivables.view, print -> party party.read; both charts must list print's public key). Without
# the signing key secret and both URLs the schedules are stored but nothing runs. The runner acts only for the tenants in
# statementTenantIds (PRINT_STATEMENT_TENANT_IDS), separate from the job-log purge list. A schedule of another tenant is stored and listed
# with runsEnabled false but never runs by itself.
statementTenantIds: []
serviceIdentity: { signingKeySecret: "", keyId: "" }
sources: { receivablesUrl: "", partyUrl: "" }
# E-mail destinations of the output plan (#46). Without smtp.addr the log adapter records each message and sends nothing.
# smtp.passwordSecret is a Secret with the key PRINT_SMTP_PASSWORD; the user name and sender address are not secret.
# requireTls (default true) refuses to send through a relay that offers no TLS; port 465 uses implicit TLS.
smtp: { addr: "", from: "", username: "", passwordSecret: "", requireTls: true }
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false, interval: 30s }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  command: []
  args: [migrate]
  ownerSecret: print-db-owner
  ownerSecretKey: DATABASE_URL
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [print]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: customer-portal
    podNames: [customer-portal]
  - name: ops
    podNames: [ops, ops-lag-reporter]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
