apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: print
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: print
  template:
    metadata:
      labels:
        app.kubernetes.io/name: print
    spec:
      securityContext:
        runAsNonRoot: true
        {{- if .Values.serviceIdentity.signingKeySecret }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: print
          image: {{ include "print.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "depot.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: PRINT_RETRY
              value: {{ .Values.printRetry | quote }}
            - name: PRINT_JOB_RETENTION_DAYS
              value: {{ .Values.jobRetentionDays | quote }}
            - name: PRINT_PURGE_TENANT_IDS
              value: {{ join "," .Values.purgeTenantIds | quote }}
            - name: PRINT_STATEMENT_TENANT_IDS
              value: {{ join "," .Values.statementTenantIds | quote }}
            {{- if .Values.serviceIdentity.signingKeySecret }}
            - name: DEPOT_SERVICE_NAME
              value: print
            - name: DEPOT_SERVICE_SIGNING_KEY_FILE
              value: /var/run/depot/service-identity/signing-key
            {{- if .Values.serviceIdentity.keyId }}
            - name: DEPOT_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
            {{- end }}
            - name: PRINT_RECEIVABLES_URL
              value: {{ required "sources.receivablesUrl is required with serviceIdentity.signingKeySecret" .Values.sources.receivablesUrl | quote }}
            - name: PRINT_PARTY_URL
              value: {{ required "sources.partyUrl is required with serviceIdentity.signingKeySecret" .Values.sources.partyUrl | quote }}
            {{- end }}
            {{- if .Values.smtp.addr }}
            - name: PRINT_SMTP_ADDR
              value: {{ .Values.smtp.addr | quote }}
            - name: PRINT_SMTP_FROM
              value: {{ required "smtp.from is required with smtp.addr" .Values.smtp.from | quote }}
            - name: PRINT_SMTP_REQUIRE_TLS
              value: {{ .Values.smtp.requireTls | quote }}
            - name: PRINT_SMTP_USERNAME
              value: {{ .Values.smtp.username | quote }}
            {{- if .Values.smtp.passwordSecret }}
            - name: PRINT_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.passwordSecret }}
                  key: PRINT_SMTP_PASSWORD
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/depot/service-identity, readOnly: true }
          {{- end }}
      {{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
      {{- end }}
