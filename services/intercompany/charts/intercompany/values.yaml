image: { repository: ghcr.io/benjaminsrussell/intercompany, digest: "", tag: "", pullPolicy: IfNotPresent }
# DATABASE_URL comes from this Kubernetes secret (Vault via External Secrets), never inline.
databaseSecret: intercompany-db
# Dev only; stage and prod apply migrations before the rollout.
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# The ledger the service reads balances from and posts journals to (LEDGER_URL). Empty turns those routes off.
ledgerUrl: ""
# The fx service whose rate tables convert the two sides of a pair in different currencies (FX_URL), at rate type fxRateType.
fxUrl: ""
fxRateType: closing
# The org service whose fiscal calendars find the first open period after a closed one (ORG_URL). Empty means calendar months.
orgUrl: ""
# The tax service that prices a cross-border charge (TAX_URL) when the tenant has cross-border tax on.
taxUrl: ""
# The party service that confirms a pairing's customer and vendor accounts exist (PARTY_URL, needs the signing key). Empty means the
# accounts are checked for form only; set it so a bad pairing is refused when saved (IC-0862, IC-0863) instead of dead-lettering its charges.
partyUrl: ""
# CronJob running `intercompany reconcile <tenant-id>...`: reads every pair of the stored accounting matrix from the ledgers for
# the last and the current period and stores the runs (needs ledgerUrl and the signing key; tenants that have not set a
# reconciliation currency are skipped). Tenants are listed because the app role cannot enumerate them.
reconcile:
  enabled: false
  schedule: "17 3 * * *"
  tenantIds: []
# The charge feed (#40, args [consume]): raises an intercompany charge for each expense line and project hour another legal entity bears,
# from expense's report.approved and projects' transaction.posted. Off by default until those two services' outbox connectors relay to
# Kafka (deploy/kafka/connect.yaml has none for them yet). Needs ledgerUrl and the signing key. accounts are what a Journal-mode charge posts to.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: intercompany-charges
    username: intercompany-consumer
    dlqTopic: depot.intercompany.charges.dlq
    secret: ""
  accounts:
    cost: ""
    recovery: ""
    margin: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
# Ed25519 seed (base64) in this secret signs the service-to-service tokens sent to the ledger.
serviceIdentity:
  signingKeySecret: ""
  keyId: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: intercompany
  command: []
  args: [migrate]
  ownerSecret: intercompany-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [intercompany, intercompany-reconcile]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
