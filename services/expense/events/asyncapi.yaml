asyncapi: 3.0.0
info:
  title: expense
  version: 0.5.0
  description: >-
    CloudEvents 1.0 envelope from platform/go/events (source /depot/expense/expense,
    subject the aggregate id); payloads below are the data member. Events are written to
    the outbox in the transaction of the change and relayed to Kafka keyed by aggregate
    (expense_report or cash_advance). Slice 4 of DPT-43 publishes
    dev.depot.expense.policy.violated.v1: one message per BLOCK result when a report
    submit is refused. The refusal commits the evaluation and the messages, and a retry
    with the same Idempotency-Key replays the refusal without publishing again. Slice 5
    publishes dev.depot.expense.cashadvance.paid.v1 when an APPROVED advance is recorded
    as paid by its AP prepayment, in the transaction that moves it to PAID (the PRD's
    cash-advance.paid.v1; the kernel naming rule allows no hyphen in the entity). DPT-43 AC3
    publishes dev.depot.expense.report.approved.v1 once an approved report's reimbursable
    amount is booked as a liability in the general ledger (POST /v1/expense/gl-postings);
    payables turns it into the employee's vendor open item. The payload
    type is platform/go/reimbursement.ReportApproved.
channels:
  depot.expense.policy:
    address: depot.expense.policy
    messages:
      violated:
        $ref: '#/components/messages/policyViolated'
  depot.expense.cashadvance:
    address: depot.expense.cashadvance
    messages:
      paid:
        $ref: '#/components/messages/cashAdvancePaid'
  depot.expense.report:
    address: depot.expense.report
    messages:
      approved:
        $ref: '#/components/messages/reportApproved'
operations:
  publishPolicyViolated:
    action: send
    channel:
      $ref: '#/channels/depot.expense.policy'
    summary: A report submit was refused and at least one line has a BLOCK outcome.
    messages:
      - $ref: '#/channels/depot.expense.policy/messages/violated'
  publishCashAdvancePaid:
    action: send
    channel:
      $ref: '#/channels/depot.expense.cashadvance'
    summary: An approved cash advance was paid as an AP prepayment to the employee vendor (FR-43.15).
    messages:
      - $ref: '#/channels/depot.expense.cashadvance/messages/paid'
  publishReportApproved:
    action: send
    channel:
      $ref: '#/channels/depot.expense.report'
    summary: An approved report's liability is in the general ledger (Dr expense, Cr AP control); its reimbursable amount is payable to the worker through AP (FR-43.14).
    messages:
      - $ref: '#/channels/depot.expense.report/messages/approved'
components:
  messages:
    policyViolated:
      name: dev.depot.expense.policy.violated.v1
      title: Policy violated at submit
      contentType: application/json
      payload:
        type: object
        required: [reportId, lineId, ruleId, outcome]
        additionalProperties: false
        properties:
          reportId: { type: string, format: uuid }
          lineId: { type: string, format: uuid }
          ruleId: { type: string, example: EXP-DUP-001 }
          outcome: { type: string, enum: [BLOCK] }
    cashAdvancePaid:
      name: dev.depot.expense.cashadvance.paid.v1
      title: Cash advance paid
      contentType: application/json
      payload:
        type: object
        required: [advanceId, workerId, amount, currency, prepaymentId]
        additionalProperties: false
        properties:
          advanceId: { type: string, format: uuid }
          workerId: { type: string, format: uuid }
          amount: { type: string, description: Paid amount in the advance currency (decimal string), example: '1000.00' }
          currency: { type: string, pattern: '^[A-Z]{3}$' }
          prepaymentId: { type: string, format: uuid, description: The wave-18 AP prepayment that paid the advance. }
    reportApproved:
      name: dev.depot.expense.report.approved.v1
      title: Expense report approved
      contentType: application/json
      payload:
        type: object
        required: [reportId, legalEntityId, workerId, currency, amount, approvedOn]
        additionalProperties: false
        properties:
          reportId: { type: string, format: uuid, description: Becomes the AP open item's source document id, so a redelivery creates no second item. }
          legalEntityId: { type: string, format: uuid }
          workerId: { type: string, format: uuid, description: The employee payee; the AP vendor id. }
          currency: { type: string, pattern: '^[A-Z]{3}$' }
          amount: { type: string, description: "The stored reimbursable amount of the report (decimal string), example 420.50. 0.00 when a report that went straight to PAID carries lines another entity bears (#40); payables ignores it" }
          approvedOn: { type: string, format: date }
          revision: { type: integer, minimum: 1, description: "The report's version when it was approved; intercompany versions the charges of its lines by it (#40)." }
          chargedLines:
            type: array
            description: "The report's lines another legal entity bears (#40), in line order; absent when every line is the paying entity's own cost. Intercompany raises one charge from the paying entity (legalEntityId) to the bearing entity per line, keyed by the line id. Payables ignores it."
            items:
              type: object
              required: [lineId, lineNo, category, amount, currency, transactionDate, chargeToLegalEntityId]
              additionalProperties: false
              properties:
                lineId: { type: string, format: uuid }
                lineNo: { type: integer, minimum: 1 }
                category: { type: string, description: The expense category, example: TRAVEL }
                amount: { type: string, description: The line amount in the report currency (decimal string), example: '300.00' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                transactionDate: { type: string, format: date }
                chargeToLegalEntityId: { type: string, format: uuid, description: The cost-bearing entity; never the report's own legalEntityId }
