image:
  repository: ghcr.io/benjaminsrussell/identity
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: identity-db
migrateDatabaseSecret: ""
migrateOnStart: false
operatorTenantId: ""
scim:
  issuerBase: ""
  audience: depot-api
  opaUrl: ""
# SCIM deprovisioning (active=false or DELETE) is queued in identity_keycloak_deprovisions either way; with
# keycloakDeprovision.enabled a worker disables the Keycloak user and logs out its sessions through each tenant
# realm's depot-identity-deprovision service account (realm-management manage-users only, see
# deploy/keycloak/README.md). Needs operatorTenantId (the worker lists tenants as the operator) and an https
# adminUrl (Keycloak's root URL). The client secrets live in the Secret `secretName`, one key per realm name,
# mounted read-only; with externalSecret.enabled the chart renders the ESO ExternalSecret that fills it from
# <pathPrefix>/<realm> (property value) for every realm in externalSecret.realms. No secret goes in values.
keycloakDeprovision:
  enabled: false
  adminUrl: ""
  clientId: depot-identity-deprovision
  interval: 30s
  secretName: identity-keycloak
  externalSecret:
    enabled: true
    storeName: depot
    environment: ""
    pathPrefix: depot/{env}/identity/keycloak
    refreshInterval: 1h
    realms: []
# Customer portal contact invitations (#30) use the same Keycloak admin client as the deprovisioning worker, so they are on when
# keycloakDeprovision.enabled is. The invitation email leads to the portal client's redirect once the contact has verified the
# address, chosen a password and registered an authenticator; without a redirectUri Keycloak shows its own confirmation page.
customerPortal:
  clientId: depot-portal-customer
  redirectUri: ""
bundle:
  enabled: false
  secret: identity-bundle
  keyId: identity-policy
  port: 8443
# The OPA pods admitted to the bundle port when bundle.enabled (the API and admin ports: ingressPolicy below).
networkPolicy:
  opaNamespaces: []
  opaPodLabels:
    depot.io/opa-sidecar: "true"
# A ServiceMonitor for the admin port (the shared HTTP series, #50).
serviceMonitor: { enabled: false }
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [identity]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: customer-portal
    podNames: [customer-portal]
  - name: ops
    podNames: [ops, ops-lag-reporter]
  - name: processmfg
    podNames: [processmfg]
  - name: shopfloor
    podNames: [shopfloor]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
