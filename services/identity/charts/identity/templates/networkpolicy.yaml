{{- if .Values.bundle.enabled }}
{{- if empty .Values.networkPolicy.opaPodLabels }}
{{- fail "networkPolicy.opaPodLabels must be set when bundle.enabled: the bundle port is only admitted to labelled OPA pods" }}
{{- end }}
# The policy bundle port is admitted only to labelled OPA pods. The API and admin ports are covered by the generated
# default-deny policy (networkpolicy-ingress.yaml): the gateway, the generated peers and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-bundle
  labels:
    app.kubernetes.io/name: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.opaPodLabels | nindent 14 }}
        {{- range .Values.networkPolicy.opaNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.opaPodLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.bundle.port }} }
{{- end }}
