image: { repository: ghcr.io/benjaminsrussell/ops, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: ops-db
migrateOnStart: false
# The region this release runs in and the pair it manages ("name=ROLE,..."; read once, when the ops database has no regions).
region: { name: "", registered: "" }
# PRD 9.50.5: a failover to a passive region lagging more than this needs acceptDataLoss and a second approver.
failoverMaxLagSeconds: 300
# A lag reading older than this is unknown (about three reporting intervals): a stopped reporter blocks a failover instead of
# leaving the last number in place. 0 turns the check off. With lagReporter.enabled a region that never reported is unknown too.
lagStaleSeconds: 90
# Game-day targets (PRD 9.50.5): the scorecard of a failover is measured against them.
rtoTargetMinutes: 60
rpoTargetSeconds: 300
# Base64 Ed25519 public key of Depot commercial operations; tenant licences are installed only when signed with its key (LIC-1804).
licensePublicKey: ""
# Part 3. The SLO report and the hourly SLO check read Prometheus (empty: GET /v1/ops/slo answers 503 OPS-1725).
prometheusUrl: ""
slo:
  availabilityTarget: "0.999"
  latencyP95Ms: 2000
  # Per-service p95 targets in milliseconds, by Prometheus scrape job: { ledger: 500 }
  latencyP95ByService: {}
  # Per-operation objectives (one route of one service), evaluated from the shared HTTP series and shown in GET /v1/ops/slo:
  # [{ name: post-journal-entry, service: ledger, route: /v1/ledger/journal-entries, availability: 0.9995, latencyP95Ms: 500 }]
  operations: []
# USD unit rates of the tenant cost statements (docs/ops/cost-model.md), as decimal strings; empty refuses to record (COST-1904):
# { cpu_core_hours: "0.04", memory_gb_hours: "0.005", storage_gb: "0.10", kafka_gb: "0.02", lakehouse_gb: "0.023", ai_tokens: "0.000002", overhead: "0.12" }
costRates: {}
# Tenant cost statements as PDF (print) and the decommission guard and licence user-count reporter (identity) are reached with the
# service signing key (serviceIdentity.signingKeySecret) as service:ops-reporter; each is off while its URL is empty.
identityUrl: ""
printUrl: ""
# The operator's name on the statement PDF.
sellerName: ""
# The monthly metering job: one PromQL query per dimension (cpu_core_hours, memory_gb_hours, storage_gb, kafka_gb, lakehouse_gb,
# ai_tokens) with {tenant} and {range} placeholders, the name of the query set (recorded on every statement) and the ECB month-average
# USD per EUR. Needs prometheusUrl and costRates; empty turns the job off.
metering:
  queries: {}
  modelVersion: ""
  usdPerEur: ""
# The masked-clone job runs tools/tenant-restore (it must be in the image or a sidecar, with DEPOT_CLONE_SOURCE_URL and
# DEPOT_CLONE_TARGET_URL in its environment) for the schedules created through POST /v1/ops/clone-schedules.
clone:
  enabled: false
  command: tenant-restore
  # How long one clone may run; a schedule with a run in flight is not claimed again, and a lost run is retried after this.
  lease: 6h
# How often the licence check and the SLO check run.
checkInterval: 1h
# The platform operator's tenant (identity's IDENTITY_OPERATOR_TENANT_ID). The ops routes serve this tenant only; the
# service refuses to start without it.
operatorTenantId: ""
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }

serviceIdentity:
  publicKeys: ""
  # Secret holding this service's Ed25519 seed under the key signing-key, for the calls to identity and print.
  signingKeySecret: ""
  keyId: ""

# The lag reporter (depot-ops lag-report): reads the real replication state of this region's Postgres and reports it to the
# ops API every interval. Run it where the standby is (mode standby, region = this region) or next to the primary (mode primary,
# region = the standby's name). A failed measurement reports unknownLagSeconds, so a broken reporter blocks a failover.
lagReporter:
  enabled: false
  mode: standby
  region: ""
  intervalSeconds: 30
  unknownLagSeconds: 86400
  # Gateway (or ops service) URL the reports go to, and the secret holding OPS_TOKEN and OPS_LAG_DATABASE_URL.
  apiUrl: ""
  secret: ops-lag-reporter
  applicationName: "%"
# Where every service of this release's cluster reads the region role from (global.regionFenceUrl in the service charts):
# the ops /healthz/region of this region through Gateway depot-region, for example https://region.<env>.depot.dev/healthz/region.
# Never the ops Service itself (http://ops.<namespace>.svc/...): every chart refuses to render that, because NetworkPolicy
# cannot limit the services to that one path and would have to admit them to the whole operator API (ADR-0006 rule 6, D1).

# Real tenant provisioning adapters for `depot-ops tenant provision|decommission` (run it with `kubectl exec deploy/ops -- depot-ops tenant ...`).
# A system with no configuration stays on the logging adapter, and a real run is refused until all three are set (--dry-run always works).
# Kafka needs nothing: under the shared-topic model there is no per-tenant ACL or topic (docs/ops/tenant-provisioning.md).
provisioning:
  keycloak:
    url: ""                 # https://keycloak.example (no /admin suffix)
    adminRealm: master
    realmPrefix: depot-
    realmTemplate: ""       # path to a mounted realm JSON (deploy/keycloak/realm-depot.json); empty uses the built-in minimal realm
    secret: ""              # Secret with OPS_KEYCLOAK_CLIENT_ID and OPS_KEYCLOAK_CLIENT_SECRET (a client-credentials admin client)
  databases:
    secret: ""              # Secret with OPS_PROVISION_DATABASES: JSON {"ledger": "postgres://depot_app...", ...} (the verification, as depot_app)
  # `depot-ops tenant purge` deletes a decommissioned tenant's rows after its export is verified. Its credentials are separate from the
  # verification ones: a role that may delete (not depot_app), one connection string per context database.
  purge:
    secret: ""              # Secret with OPS_PURGE_DATABASES; empty turns the purge command off
    keepTables: []          # table names never purged, in addition to the built-in identity_tenants
  lakehouse:
    catalogUrl: ""          # Iceberg REST catalog base URL
    catalogPrefix: ""
    namespacePrefix: tenant_
    secret: ""              # optional Secret with OPS_LAKEHOUSE_CATALOG_TOKEN

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: ops
  command: []
  args: [migrate]
  ownerSecret: ops-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [ops, ops-lag-reporter]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api, depot-region]
  peers:
  - name: ops
    podNames: [ops, ops-lag-reporter]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
