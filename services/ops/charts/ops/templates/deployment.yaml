apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ops
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops
          image: {{ include "ops.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "depot.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: DEPOT_SERVICE_NAME
              value: ops
{{- if .Values.serviceIdentity.publicKeys }}
            - name: DEPOT_SERVICE_PUBLIC_KEYS
              value: {{ .Values.serviceIdentity.publicKeys | quote }}
{{- end }}
            - name: MIGRATE_ON_START
              value: {{ .Values.migrateOnStart | quote }}
            - name: REGION_NAME
              value: {{ .Values.region.name | quote }}
            - name: OPS_REGIONS
              value: {{ .Values.region.registered | quote }}
            - name: FAILOVER_MAX_LAG_S
              value: {{ .Values.failoverMaxLagSeconds | quote }}
            - name: OPS_OPERATOR_TENANT_ID
              value: {{ .Values.operatorTenantId | quote }}
            - name: OPS_LAG_STALE_S
              value: {{ .Values.lagStaleSeconds | quote }}
            - name: OPS_REQUIRE_LAG_REPORTS
              value: {{ .Values.lagReporter.enabled | quote }}
            - name: RTO_TARGET_MIN
              value: {{ .Values.rtoTargetMinutes | quote }}
            - name: RPO_TARGET_S
              value: {{ .Values.rpoTargetSeconds | quote }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: DEPOT_SERVICE_SIGNING_KEY_FILE
              value: /var/run/depot/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: DEPOT_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- if .Values.identityUrl }}
            - name: IDENTITY_URL
              value: {{ .Values.identityUrl | quote }}
{{- end }}
{{- if .Values.printUrl }}
            - name: PRINT_URL
              value: {{ .Values.printUrl | quote }}
{{- end }}
{{- if .Values.sellerName }}
            - name: OPS_SELLER_NAME
              value: {{ .Values.sellerName | quote }}
{{- end }}
{{- if .Values.slo.operations }}
            - name: SLO_OPERATIONS
              value: {{ .Values.slo.operations | toJson | quote }}
{{- end }}
{{- if .Values.metering.queries }}
            - name: OPS_METER_QUERIES
              value: {{ .Values.metering.queries | toJson | quote }}
            - name: OPS_METER_MODEL_VERSION
              value: {{ required "metering.modelVersion is required with metering.queries" .Values.metering.modelVersion | quote }}
            - name: OPS_USD_PER_EUR
              value: {{ required "metering.usdPerEur is required with metering.queries" .Values.metering.usdPerEur | quote }}
{{- end }}
{{- if .Values.clone.enabled }}
            - name: OPS_CLONE_ENABLED
              value: "true"
            - name: OPS_CLONE_COMMAND
              value: {{ .Values.clone.command | quote }}
            - name: OPS_CLONE_LEASE
              value: {{ .Values.clone.lease | quote }}
{{- end }}
{{- if .Values.licensePublicKey }}
            - name: OPS_LICENSE_PUBLIC_KEY
              value: {{ .Values.licensePublicKey | quote }}
{{- end }}
{{- if .Values.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
{{- end }}
            - name: SLO_AVAILABILITY_TARGET
              value: {{ .Values.slo.availabilityTarget | quote }}
            - name: SLO_LATENCY_P95_MS
              value: {{ .Values.slo.latencyP95Ms | quote }}
{{- if .Values.slo.latencyP95ByService }}
            - name: SLO_LATENCY_P95_BY
              value: {{ .Values.slo.latencyP95ByService | toJson | quote }}
{{- end }}
{{- if .Values.costRates }}
            - name: OPS_COST_RATES
              value: {{ .Values.costRates | toJson | quote }}
{{- end }}
{{- with .Values.provisioning.keycloak }}
{{- if .url }}
            - name: OPS_KEYCLOAK_URL
              value: {{ .url | quote }}
            - name: OPS_KEYCLOAK_ADMIN_REALM
              value: {{ .adminRealm | quote }}
            - name: OPS_KEYCLOAK_REALM_PREFIX
              value: {{ .realmPrefix | quote }}
{{- if .realmTemplate }}
            - name: OPS_KEYCLOAK_REALM_TEMPLATE
              value: {{ .realmTemplate | quote }}
{{- end }}
            - name: OPS_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: {{ required "provisioning.keycloak.secret is required with a url" .secret }}, key: OPS_KEYCLOAK_CLIENT_ID }
            - name: OPS_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: OPS_KEYCLOAK_CLIENT_SECRET }
{{- end }}
{{- end }}
{{- with .Values.provisioning.databases }}
{{- if .secret }}
            - name: OPS_PROVISION_DATABASES
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: OPS_PROVISION_DATABASES }
{{- end }}
{{- end }}
{{- with .Values.provisioning.purge }}
{{- if .secret }}
            - name: OPS_PURGE_DATABASES
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: OPS_PURGE_DATABASES }
            - name: OPS_PURGE_KEEP_TABLES
              value: {{ join "," .keepTables | quote }}
{{- end }}
{{- end }}
{{- with .Values.provisioning.lakehouse }}
{{- if .catalogUrl }}
            - name: OPS_LAKEHOUSE_CATALOG_URL
              value: {{ .catalogUrl | quote }}
            - name: OPS_LAKEHOUSE_CATALOG_PREFIX
              value: {{ .catalogPrefix | quote }}
            - name: OPS_LAKEHOUSE_NAMESPACE_PREFIX
              value: {{ .namespacePrefix | quote }}
{{- if .secret }}
            - name: OPS_LAKEHOUSE_CATALOG_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: OPS_LAKEHOUSE_CATALOG_TOKEN }
{{- end }}
{{- end }}
{{- end }}
            - name: OPS_CHECK_INTERVAL
              value: {{ .Values.checkInterval | quote }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          {{- if .Values.serviceIdentity.signingKeySecret }}
          volumeMounts:
            - { name: service-identity, mountPath: /var/run/depot/service-identity, readOnly: true }
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.serviceIdentity.signingKeySecret }}
      volumes:
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
