image:
  repository: ghcr.io/benjaminsrussell/finreport
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: finreport-db
migrateOnStart: false
replicaCount: 3
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor: { enabled: false }
# Tunables are validated at startup (internal/config); defaults follow PRD §2.15.13.
reporting:
  maxLagSeconds: 30
  # Seconds the lag stays above maxLagSeconds before lag.exceeded (lag-check job).
  lagAlertSeconds: 60
  cellKeyLimit: 50000
  pageSize: 500
  retentionClosedYears: 7
  retentionAdhocDays: 90
  attachmentLimitMb: 20
  shareLinkExpiryDays: 14
  pdfConcurrencyPerPod: 4
  opaCacheSeconds: 60
  # Trace viewer link for drill-down lines (FR-15.7), an http(s) URL with a
  # {traceId} slot, e.g. https://grafana.example/explore?traceId={traceId}.
  # Empty shows trace ids without a link.
  traceUrl: ""
# Service identity the consumer and the API sign ledger requests with
# (DEPOT_SERVICE_NAME=finreport). When signingKeySecret is set, the API pods
# also mount it and get LEDGER_URL, which turns on balance verification
# (POST /balance-verifications); without it those routes answer 503.
# The ledger must hold finreport's public key and the platform must seed the
# finreport-ledger principal and the finreport to ledger grant (NOT-IMPLEMENTED.md).
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
serviceUrls:
  ledger: ""
opa:
  # The OPA that answers the dimension data-scope decision. Leave empty until a pod runs an OPA sidecar
  # (deploy/gateway/opa-sidecar.yaml is only a sample) and the bundle with data.dimension_scopes exists:
  # with a URL set and no OPA behind it every report route answers 503 REPORT-0055; with it empty,
  # dimension security is off and finreport says so in its startup log.
  url: ""
# Kafka consumer of dev.depot.ledger.journal.posted.v1 (FR-15.1): one pod per
# partition set; ordering across partitions is handled by the read model.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: reporting-balances
    username: finreport-consumer
    secret: ""
# Lag alert (FR-15.1): `finreport lag-check` every minute for each tenant
# listed; one lag.exceeded.v1 per episode. Runs as an in-process system actor,
# so it needs no authz seed and no signing key.
lagCheck:
  enabled: false
  schedule: "* * * * *"
  tenantIds: []
# Statement schedules (FR-15.8): `finreport fire-schedules` every five minutes
# for each tenant listed; runs the schedules that came due, stores the files in
# the report library and hands them to distribution. In-process system actor,
# so it needs no authz seed and no signing key.
statementSchedules:
  enabled: false
  schedule: "*/5 * * * *"
  tenantIds: []
# Library retention sweep (FR-15.8, PRD job `library-retention-sweep`):
# `finreport sweep-library` weekly (Sunday 04:00 UTC) for each tenant listed;
# deletes report library files past their retention date, and ad-hoc statement
# runs older than reporting.retentionAdhocDays, except for legal
# entities under legal hold. In-process system actor, so it needs no authz seed
# and no signing key.
librarySweep:
  enabled: false
  schedule: "0 4 * * 0"
  tenantIds: []

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: finreport
  command: []
  args: [migrate]
  ownerSecret: finreport-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: latest
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [finreport]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
