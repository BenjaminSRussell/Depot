image:
  repository: ghcr.io/benjaminsrussell/inventory
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: inventory-db
migrateOnStart: false
# Public keys of the services that call inventory with a signed service token
# (caller[:kid]=base64 Ed25519 public key, comma separated; not secret). receiving
# reads ownership-change journals this way (#305).
serviceIdentity:
  publicKeys: ""
  # Secret holding this service's own Ed25519 signing key (key "signing-key"), used to
  # sign its calls to the ledger (#477). Required when ledgerUrl is set.
  signingKeySecret: ""
  keyId: ""
# General ledger base URL. Optional: without it POST /v1/inventory/gl-postings answers
# 503 INV-GL-005 and journal entries stay in the subledger only.
ledgerUrl: ""
replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor:
  enabled: false
inventory:
  negativeDefault: forbid
  # service.allow-negative-truck (BR-45.7): let a technician's truck stock go negative when a completed work order consumes more than the truck holds.
  allowNegativeTruck: false
  # With tenantIds set, every replica runs the nightly truck replenishment (INV_TRUCK_REPLENISH_*): a draft transfer order for
  # each truck below its minimum, once a day at `at` (UTC "HH:MM") or every `interval` when `at` is empty. Safe on several replicas.
  truckReplenish:
    tenantIds: []
    at: "02:30"
    interval: 24h
  reservationTTLHours: 0
  journalMaxLines: 10000
  reconCron: "0 2 * * *"
  # Posting-profile accounts (ledger account ids). Required: the service exits at
  # startup when any is empty. Per-legal-entity posting profiles arrive with wave 11.
  inventoryAccount: ""
  adjustmentAccount: ""
  openingClearingAccount: ""
  # Consignment accrual (posting profile consignment_accrual, FR-16.17). Optional:
  # OWNERSHIP_CHANGE journals are refused (INV-JNL-005) while it is empty.
  consignmentAccrualAccount: ""
# Product service base URL, used by the postings consumer to convert plain
# (not catch-weight) document quantities into the product's inventory unit
# (#480, duty product.uom.convert). Optional: without it plain lines are parked
# (INV-PST-002). With it serviceIdentity.signingKeySecret is required, and the
# product service must trust inventory's public key.
productUrl: ""
# The postings consumer (#480, args [consume]): books receiving's receipt.posted
# and receipt.corrected, sales' DELIVERED orderprogress.recorded and
# fulfillment's packingslip.cancelled as inventory transactions. It exits at
# start unless service:inventory-postings is seeded in the service principal
# table. Its KafkaUser, ACLs and dead-letter topic are
# deploy/kafka/inventory-consumer.yaml; off by default, like the other consumers
# in dev, until it is turned on per environment.
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: inventory-postings
    username: inventory-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: inventory
  command: []
  args: [migrate]
  ownerSecret: inventory-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [inventory]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: fulfillment
    podNames: [fulfillment]
  - name: productcost
    podNames: [productcost]
  - name: production
    podNames: [production]
  - name: quality
    podNames: [quality]
  - name: receiving
    podNames: [receiving]
  - name: sales
    podNames: [sales]
  - name: warehouse
    podNames: [warehouse]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
