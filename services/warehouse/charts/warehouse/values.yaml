image: { repository: ghcr.io/benjaminsrussell/warehouse, digest: "", tag: "", pullPolicy: IfNotPresent }
# Secret holding DATABASE_URL. Without a database the service serves only the
# stateless directive simulation.
databaseSecret: warehouse-db
migrateOnStart: false
# Idle minutes before ASSIGNED work returns to OPEN (BR-31.3), 5-240.
lockTimeoutMin: 30
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }

# Inventory holds on pick (wave 33 AC2). Empty skips the check.
inventoryUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [warehouse]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: iot-edge
    podNames: [iot-edge]
  - name: mobile
    podNames: [mobile]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
