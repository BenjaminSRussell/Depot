image:
  repository: ghcr.io/benjaminsrussell/depot-workflow
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
temporal:
  address: temporal-frontend.temporal.svc:7233
  namespace: depot
  taskQueue: depot-approvals
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
# Each target Service listens on 8080. payables, engineering, quality and party name their Service after the
# release (these defaults assume the release is named like the chart); transport names it after the chart.
payablesUrl: http://payables.depot.svc:8080
engineeringUrl: http://engineering.depot.svc:8080
# Where the agent-run workflow's steps call the agents service (AGENTS_RUN_ENGINE=temporal there).
agentsUrl: http://agent-runtime.depot.svc:8080
qualityUrl: http://quality.depot.svc:8080
transportUrl: http://transport.depot.svc:8080
partyUrl: http://party.depot.svc:8080
# Where budgetPlanWorkflow records its decisions (BUDGETING_BASE_URL, src/budgetPlanActivities.ts).
budgetingUrl: http://budgeting.depot.svc:8080
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
# The tender trigger (#426): with brokers set, the worker consumes transport's depot.tms.load and depot.tms.tender,
# starts tenderWorkflow on load.released and signals it on tender.accepted and tender.declined. The secret holds the
# KafkaUser's password and the cluster CA (keys password, ca.crt); deploy/kafka/workflow-ts-consumer.yaml grants the user.
kafka:
  brokers: ""
  group: workflow-ts-tender
  dlqTopic: depot.workflow.tender.dlq
  username: workflow-ts-consumer
  secret: ""
# The agents service starts and wakes agent-run workflows under its own signed service token (these routes ignore the X-Depot-*
# headers, which this port trusts only from the edge). agentsPublicKeys is its Ed25519 public key as "agents=<base64>"; with it
# set, the agent-run routes answer, otherwise they answer 404. agents' pods reach port 8080 as a generated peer (ingressPolicy.peers).
agentsPublicKeys: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [workflow]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: agent-runtime
    podNames: [agent-runtime]
  metricsPorts: []
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
