apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: workflow
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow
        depot.dev/temporal-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's node user (Dockerfile `USER node`), numeric so the kubelet can check runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        {{- if or .Values.serviceIdentity.signingKeySecret .Values.kafka.secret }}
        # Mounted secrets are 0440: the node user reads them through this group.
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
{{- if or .Values.serviceIdentity.signingKeySecret .Values.kafka.secret }}
      volumes:
{{- if .Values.serviceIdentity.signingKeySecret }}
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
{{- if .Values.kafka.secret }}
        - name: kafka
          secret:
            secretName: {{ .Values.kafka.secret }}
            defaultMode: 0440
{{- end }}
{{- end }}
      containers:
        - name: workflow
          image: {{ include "workflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "depot.cloudEnv" $ | nindent 12 }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - { name: PAYABLES_BASE_URL, value: {{ .Values.payablesUrl | quote }} }
            - { name: ENGINEERING_BASE_URL, value: {{ .Values.engineeringUrl | quote }} }
            - { name: AGENTS_BASE_URL, value: {{ .Values.agentsUrl | quote }} }
            - { name: QUALITY_BASE_URL, value: {{ .Values.qualityUrl | quote }} }
            - { name: TRANSPORT_BASE_URL, value: {{ .Values.transportUrl | quote }} }
            - { name: PARTY_BASE_URL, value: {{ .Values.partyUrl | quote }} }
            - { name: BUDGETING_BASE_URL, value: {{ .Values.budgetingUrl | quote }} }
            - { name: DEPOT_SERVICE_NAME, value: workflow-ts }
{{- if .Values.agentsPublicKeys }}
            - { name: DEPOT_SERVICE_PUBLIC_KEYS, value: {{ .Values.agentsPublicKeys | quote }} }
{{- end }}
{{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: DEPOT_SERVICE_SIGNING_KEY_FILE, value: /var/run/depot/service-identity/signing-key }
{{- if .Values.serviceIdentity.keyId }}
            - { name: DEPOT_SERVICE_KEY_ID, value: {{ .Values.serviceIdentity.keyId | quote }} }
{{- end }}
{{- end }}
{{- if .Values.kafka.brokers }}
            - { name: KAFKA_BROKERS, value: {{ .Values.kafka.brokers | quote }} }
            - { name: KAFKA_GROUP, value: {{ .Values.kafka.group | quote }} }
            - { name: WORKFLOW_DLQ_TOPIC, value: {{ .Values.kafka.dlqTopic | quote }} }
{{- if .Values.kafka.secret }}
            - { name: KAFKA_USERNAME, value: {{ .Values.kafka.username | quote }} }
            - { name: KAFKA_PASSWORD_FILE, value: /var/run/depot/kafka/password }
            - { name: KAFKA_TLS_CA_FILE, value: /var/run/depot/kafka/ca.crt }
{{- end }}
{{- end }}
{{- if or .Values.serviceIdentity.signingKeySecret .Values.kafka.secret }}
          volumeMounts:
{{- if .Values.serviceIdentity.signingKeySecret }}
            - { name: service-identity, mountPath: /var/run/depot/service-identity, readOnly: true }
{{- end }}
{{- if .Values.kafka.secret }}
            - { name: kafka, mountPath: /var/run/depot/kafka, readOnly: true }
{{- end }}
{{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
