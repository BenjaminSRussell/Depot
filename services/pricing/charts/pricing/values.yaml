image:
  repository: ghcr.io/benjaminsrussell/depot-pricing
  tag: "0.1.0"
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  port: 8080
  adminPort: 9090

# Dev only, with migrateJob.enabled false: apply migrations/ at start-up (dbx.Migrate). Otherwise the chart's migration Job (migrateJob) applies them as the owner role.
migrateOnStart: false

# DATABASE_URL is read from this secret (Vault via External Secrets), never from values.
databaseSecret:
  name: pricing-db-app
  key: uri

config:
  pricingCacheTtl: 60s
  pricingMaxLines: "500"
  pricingExplainMaxBytes: "65536"
  otelEndpoint: ""

# Cache invalidation across replicas (FR-26.14): every replica follows campaign.killed,
# campaign.restored, parameters.changed and tenantparameter.changed on the topics
# depot.pricing.campaign and depot.pricing.parameters, under a Kafka group of its own.
# Off by default: without it a replica's caches follow other replicas' changes within the
# snapshot lifetime. Needs the service principal pricing-cache with the flag duty
# pricing.cache.invalidate (see NOT-IMPLEMENTED.md). Kafka user and ACLs: deploy/kafka/pricing-consumer.yaml (Read on
# the two topics and on the group prefix pricing-cache-, Write on depot.pricing.cache.dlq).
cacheConsumer:
  enabled: false
  # The SCRAM-SHA-512 TLS listener, for example depot-kafka-bootstrap.kafka.svc:9093.
  brokers: ""
  username: pricing-consumer
  # Secret with the KafkaUser's password and the cluster CA (keys password and ca.crt), mounted as files.
  secret: ""

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  # Group of the mounted Kafka credentials (mode 0440) when the cache consumer is on.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Callers present a signed service token verified against these keys, name=base64-public-key comma separated. List sales' key as
# sales=<base64 Ed25519 key>: sales prices customer portal order lines with POST /v1/pricing/resolve (pricing.price.resolve, #30).
serviceIdentity:
  publicKeys: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: pricing
  command: []
  args: [migrate]
  ownerSecret: pricing-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [pricing]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: sales
    podNames: [sales]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
