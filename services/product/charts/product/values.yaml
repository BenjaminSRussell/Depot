image: { repository: ghcr.io/benjaminsrussell/product, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: product-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 1, memory: 1Gi }
serviceMonitor: { enabled: false }
configuratorURL: ""
orgBaseURL: "http://org:8080"
serviceIdentity:
  # Secret with key signing-key: product's Ed25519 seed, used to sign the org
  # lookups it makes for service callers (the migration loader).
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [product]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: batch
    namespace: batch
    podNames: [batch]
  - name: fulfillment
    podNames: [fulfillment]
  - name: inventory
    podNames: [inventory]
  - name: migration
    podNames: [migration]
  - name: production
    podNames: [production]
  - name: receiving
    podNames: [receiving]
  - name: sales
    podNames: [sales]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
