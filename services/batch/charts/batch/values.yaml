image: { repository: ghcr.io/benjaminsrussell/batch, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: batch-db
migrateOnStart: false
replicaCount: 2
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
notify:
  enabled: false
  secretName: batch-notify
  mountPath: /var/run/secrets/notify
  fsGroup: 65532
  reloader: false
  distributeInterval: 5s
  smtp: { enabled: false, from: "", tls: starttls }
  webhook: { enabled: false, url: "" }
  externalSecret:
    enabled: true
    storeName: depot
    environment: ""
    pathPrefix: depot/{env}/batch/notify
    refreshInterval: 1h
serviceMonitor: { enabled: false }
productUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
inbox:
  purchasingUrl: ""
  partyUrl: ""
  ledgerUrl: ""
  payablesUrl: ""
  sourceTimeout: 3s
  concurrency: 4
dispatcher:
  interval: 5s
  concurrency: 4
  maxRunAttempts: 5
  retryAfter: 1m

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [batch]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
