asyncapi: 3.0.0
info:
  title: Passage Projects events
  version: 0.3.0
  description: |
    CloudEvents 1.0 published through the outbox in the same transaction as the
    state change (Debezium outbox router relays to Kafka). Consumers: analytics,
    budget control (wave 38), resource planning. Slice 1 publishes project master
    events; slice 2 adds the CPM scheduler run (wbs.scheduled); slice 3 adds
    change order application (changeorder.applied), which also emits
    project.updated with changedFields [contractValue].
defaultContentType: application/cloudevents+json
channels:
  projectCreated:
    address: passage.projects.project
    messages:
      projectCreated:
        $ref: '#/components/messages/ProjectCreated'
  projectUpdated:
    address: passage.projects.project
    messages:
      projectUpdated:
        $ref: '#/components/messages/ProjectUpdated'
  wbsScheduled:
    address: passage.projects.wbs
    messages:
      wbsScheduled:
        $ref: '#/components/messages/WbsScheduled'
  changeOrderApplied:
    address: passage.projects.changeorder
    messages:
      changeOrderApplied:
        $ref: '#/components/messages/ChangeOrderApplied'
  transactionPosted:
    address: passage.projects.transaction
    messages:
      transactionPosted:
        $ref: '#/components/messages/TransactionPosted'
operations:
  publishTransactionPosted:
    action: send
    channel:
      $ref: '#/channels/transactionPosted'
  publishChangeOrderApplied:
    action: send
    channel:
      $ref: '#/channels/changeOrderApplied'
  publishProjectCreated:
    action: send
    channel:
      $ref: '#/channels/projectCreated'
  publishProjectUpdated:
    action: send
    channel:
      $ref: '#/channels/projectUpdated'
  publishWbsScheduled:
    action: send
    channel:
      $ref: '#/channels/wbsScheduled'
components:
  messages:
    ProjectCreated:
      name: dev.passage.projects.project.created.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ProjectCreatedEvent'
    ProjectUpdated:
      name: dev.passage.projects.project.updated.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ProjectUpdatedEvent'
    WbsScheduled:
      name: dev.passage.projects.wbs.scheduled.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/WbsScheduledEvent'
    ChangeOrderApplied:
      name: dev.passage.projects.changeorder.applied.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/ChangeOrderAppliedEvent'
    TransactionPosted:
      name: dev.passage.projects.transaction.posted.v1
      contentType: application/cloudevents+json
      payload:
        $ref: '#/components/schemas/TransactionPostedEvent'
  schemas:
    TransactionPostedEvent:
      description: |
        An HOUR transaction was recorded on a project (#40). Transactions are immutable, so version is always 1; transactionId and
        version are the intercompany charge's sourceId and version. When workerLegalEntityId (the employing, lending entity) is
        present and differs from projectLegalEntityId (the borrowing entity), intercompany charges the hours across. Quantity is
        hours, costPrice the hourly cost, both decimal strings in currency (the project's currency).
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [transactionId, version, projectId, projectLegalEntityId, workerId, categoryId, sourceDocType, transactionDate, quantity, costPrice, currency]
              properties:
                transactionId: { type: string, format: uuid }
                version: { type: integer, minimum: 1, enum: [1] }
                projectId: { type: string }
                projectLegalEntityId: { type: string, format: uuid }
                workerId: { type: string, format: uuid }
                workerLegalEntityId: { type: string, format: uuid, description: The legal entity that employs the worker; present only when the source named it }
                categoryId: { type: string }
                sourceDocType: { type: string, enum: [TIMESHEET, EXPENSE, PO_RECEIPT, INV_JOURNAL, MANUAL] }
                transactionDate: { type: string, format: date }
                quantity: { type: string, example: '8.000' }
                costPrice: { type: string, example: '60.000000' }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
    ChangeOrderAppliedEvent:
      description: |
        An APPROVED change order was applied (BR-41.13). The PRD names the type
        change-order.applied; the platform type rule allows [a-z0-9] only, so
        the entity segment is changeorder. Amounts are decimal strings in currency.
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [changeOrderId, changeOrderNumber, projectId, type, currency, contractValueDelta, budgetDelta, contractValue, newBaselineVersionId]
              properties:
                changeOrderId:
                  type: string
                  format: uuid
                changeOrderNumber:
                  type: string
                  example: CO-0001
                projectId:
                  type: string
                type:
                  type: string
                  enum: [SCOPE_CHANGE, CLAIM_CUSTOMER, CLAIM_VENDOR, INTERNAL]
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                contractValueDelta:
                  type: string
                  description: Sum of the revenue impact lines.
                budgetDelta:
                  type: string
                  description: Sum of the cost impact lines; wave-38 budget control adds it to the project budget.
                contractValue:
                  type: string
                  description: The project's contract value after the change.
                newBaselineVersionId:
                  type: string
                  format: uuid
                  description: The BASELINE plan version the apply created; the previous baseline is superseded.
                vendorPartyId:
                  type: string
                  format: uuid
                  description: Set on a CLAIM_VENDOR; wave 18 drafts the vendor debit note from it.
    WbsScheduledEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: Written by each scheduler run over a non-empty plan version (PRD §8.41.5).
              required: [projectId, planVersionId, criticalPath, finishDate]
              properties:
                projectId:
                  type: string
                planVersionId:
                  type: string
                  format: uuid
                criticalPath:
                  type: array
                  description: Critical WBS task ids in dependency order.
                  items:
                    type: string
                    format: uuid
                finishDate:
                  type: string
                  format: date
                  description: Project finish (latest early finish of the plan's tasks).
    CloudEventEnvelope:
      type: object
      description: The platform envelope (platform/go/events.Event), structured mode.
      required: [specversion, id, source, type, subject, time, datacontenttype, data, tenantid]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          description: Event id (UUID v7), unique per event; consumers de-duplicate on it.
        source:
          type: string
          const: projects
        type:
          type: string
        subject:
          type: string
          description: The aggregate id; the project id for project events, the plan version id for wbs events.
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        tenantid:
          type: string
          format: uuid
        actor:
          type: string
          description: User id of the caller that made the change.
        correlationid:
          type: string
        causationid:
          type: string
    ProjectCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, legalEntityId, projectType, stage, currency, version]
              properties:
                id:
                  type: string
                legalEntityId:
                  type: string
                  format: uuid
                parentProjectId:
                  type: string
                  description: Set for a sub-project.
                projectType:
                  type: string
                  enum: [TIME_MATERIAL, FIXED_PRICE, INTERNAL, COST, INVESTMENT, TIME]
                stage:
                  type: string
                  enum: [CREATED]
                currency:
                  type: string
                version:
                  type: integer
    ProjectUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, changedFields, stage, version]
              properties:
                id:
                  type: string
                changedFields:
                  type: array
                  items:
                    type: string
                stage:
                  type: string
                  enum: [CREATED, IN_PROCESS, ON_HOLD, FINISHED]
                version:
                  type: integer
