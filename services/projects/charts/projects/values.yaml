image:
  repository: ghcr.io/benjaminsrussell/depot-projects
  # Digest-pinned by Argo CD in deploy/; the tag is a fallback for local k3d.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090

# DATABASE_URL is read from this existing secret (key: DATABASE_URL), never inlined.
database:
  secretName: projects-db
  secretKey: DATABASE_URL

env:
  DEPOT_ENV: dev
  SERVICE_NAME: projects
  HTTP_ADDR: ":8080"
  MIGRATE_ON_START: "false"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz

serviceMonitor:
  enabled: false
  interval: 30s

ledgerUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [projects]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: budgeting
    podNames: [budgeting]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
