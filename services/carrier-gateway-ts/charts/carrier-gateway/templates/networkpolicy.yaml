{{- if .Values.networkPolicy.enabled }}
# Egress: DNS only. The sandbox carrier calls nothing; a real adapter adds its carrier's API endpoints here when it is
# built. Ingress is the generated default-deny policy (networkpolicy-ingress.yaml): only the calling services (fulfillment,
# transport); there is no edge route, people reach carriers through those services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress
  labels:
    app.kubernetes.io/name: carrier-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: carrier-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
