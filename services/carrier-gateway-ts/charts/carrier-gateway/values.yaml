image: { repository: ghcr.io/benjaminsrussell/depot-carrier-gateway, digest: "", tag: "", pullPolicy: IfNotPresent }
# One replica: labels and the service-token replay cache are kept in memory (NOT-IMPLEMENTED.md). A second replica
# would accept a replayed token the first one saw and would not know the other's labels by idempotency key.
replicaCount: 1
# CARRIER_ADAPTERS: comma separated; only "sandbox" (deterministic, no credentials, no egress) is built.
adapters: sandbox
# DEPOT_SERVICE_PUBLIC_KEYS: callers' Ed25519 public keys, "name[:kid]=base64" comma separated
# (fulfillment and transport). Empty: every /v1 request is refused with 401.
servicePublicKeys: ""
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }
networkPolicy:
  enabled: true
  dnsNamespace: kube-system

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [carrier-gateway]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: []
  peers:
  - name: fulfillment
    podNames: [fulfillment]
  metricsPorts: []
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
