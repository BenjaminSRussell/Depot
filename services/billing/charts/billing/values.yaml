image:
  repository: ghcr.io/benjaminsrussell/billing
  # Prefer digest pinning from Argo CD; when set it takes precedence over tag.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
# DATABASE_URL is read from this secret, never from values.
databaseSecret: billing-db
migrateOnStart: false
replicaCount: 2
service:
  port: 8080
  adminPort: 9090
maxLines: 2000
# Interim tax rates per tax code ("DE19=19,DE7=7,EXEMPT=0") until the wave-13 tax
# client is wired. Empty means every quote fails closed with BIL-0001.
taxRates: ""
# Callers (edi reads invoices) present a signed service token verified against these
# keys, formatted name=base64-public-key and comma separated. List edi's public key as edi=<base64 Ed25519 key>: the edi
# service signs its invoice reads (billing.invoice.read, #35) with it.
serviceIdentity:
  publicKeys: ""
  signingKeySecret: ""
  keyId: ""
# Unset, the journal postings answer 503 BIL-0200. When set, glProfiles (rendered as
# BILLING_GL_PROFILES) lists per legal entity: legalEntityId, ledgerId, receivableAccount,
# taxAccount, chargeAccount, deferredRevenueAccounts and contractAssetAccount (1250 Contract
# Asset when omitted; open it in the ledger chart next to 2400 Contract Liability).
# closeUrl (BILLING_CLOSE_URL): the close service, asked whether a self-billed document's receivables period is open (grant billing -> close,
# period.check; the close chart must list billing's public key). Without it no self-billed invoice is posted.
closeUrl: ""
ledgerUrl: ""
glProfiles: []
# With tenantIds set (and ledgerUrl), a worker books the journal of posted invoices and credit notes of every
# legal entity in glProfiles whose profile has that tenantId, each interval; unset, bookings wait for POST /v1/billing/gl-postings.
autoBook:
  tenantIds: []
  interval: 1m
# Revrec reads the allocation of a contract (REVREC_URL). Required when ledgerUrl is set (the
# chart and the service refuse to start without it): an order invoice is never booked at its
# billed amounts, it backs off with BIL-0207 until revrec answers with the order's contract.
revrecUrl: ""
# With salesUrl set (needs serviceIdentity.signingKeySecret; sales must list billing's public key) every replica runs a
# reporter that sends posted invoices to sales' :record-progress (SALES_URL, BILLING_SALES_REPORT_INTERVAL). Unset, reports wait.
salesUrl: ""
salesReportInterval: "30s"
# With taxUrl set (needs serviceIdentity.signingKeySecret; tax must list billing's public key) every replica runs a reporter
# that records booked invoices and credit notes with the tax service (TAX_URL, BILLING_TAX_REPORT_INTERVAL). Unset, reports wait.
taxUrl: ""
taxReportInterval: "30s"
# With tenantIds set, every replica runs the subscription billing job (BILLING_SUBSCRIPTION_JOB_*): it creates the invoice
# proposal of every period due for the tenants' legal entities; posting stays with the billing workspace. It ticks every
# interval, or once a day at `at` (UTC, "03:00") when that is set; set one of the two. A period is invoiced once, so several
# replicas running together are safe.
subscriptionJob:
  tenantIds: []
  interval: 1h
  at: ""
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }
serviceMonitor:
  enabled: false
  interval: 30s
podSecurityContext:
  # Group of the 0440 Kafka credentials and other mounted Secrets, for the nonroot user (D34).
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# The intercompany charge consumer (#40, args [consume]): raises the lender's invoice proposal of intercompany's
# chargeinvoice.requested (Invoice settlement mode) on icCharge.revenueAccount, with icCharge.taxCode when the charge names no tax
# code. It exits at start unless service:billing-iccharge is seeded. Off by default, like the other consumers, until it is turned on
# per environment (intercompany's outbox connector creates the topic). Its KafkaUser, ACLs and dead-letter topic are
# deploy/kafka/billing-consumer.yaml.
consumer:
  enabled: false
  replicaCount: 1
  icCharge:
    revenueAccount: ""
    taxCode: ""
    paymentTermDays: 30
  kafka:
    brokers: ""
    group: billing-iccharge
    username: billing-consumer
    dlqTopic: depot.billing.iccharge.dlq
    secret: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: billing
  command: []
  args: [migrate]
  ownerSecret: billing-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [billing]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: customer-portal
    podNames: [customer-portal]
  - name: edi
    podNames: [edi]
  - name: receivables
    podNames: [depot-receivables, receivables]
  - name: revrec
    podNames: [revrec]
  - name: sales
    podNames: [sales]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
