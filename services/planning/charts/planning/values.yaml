image: { repository: ghcr.io/benjaminsrussell/planning, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: planning-db
migrateOnStart: false
# PLANNING_MAX_VERSIONS: plan versions a run keeps (2 to 100).
maxVersions: 20
# PLANNING_HORIZON_DAYS: demand beyond this many days is ignored by a run (30 to 1095).
horizonDays: 365
# PLANNING_MAX_CONCURRENT_RUNS: asynchronous plan runs one replica executes at once (1 to 16);
# a 50k-item run holds several GB (6.2 GiB peak for the whole test process through the async route in
# #479), so the memory limit below is 8Gi; raise it with this value.
maxConcurrentRuns: 1
# PLANNING_RUN_TIMEOUT_MINUTES: an asynchronous plan run is failed after this long (1 to 720).
runTimeoutMinutes: 60
# PLANNING_FEATURE_FLAGS: comma-separated planning.dynamic, planning.statistical-forecast,
# planning.mps-scope; an unknown name stops the service at startup.
featureFlags: ""
# FORECAST_URL: base URL of the forecast service (services/forecast-py); required while
# planning.statistical-forecast is enabled.
forecastUrl: ""
# SALES_URL and INVENTORY_URL (set together; need serviceIdentity.signingKeySecret, and sales and inventory must list
# planning's public key): a run that sends no items reads open sales order lines and on-hand from them. Unset, such a run is 503.
salesUrl: ""
inventoryUrl: ""
serviceIdentity:
  signingKeySecret: ""
  keyId: ""
replicaCount: 2
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 8Gi }
serviceMonitor: { enabled: false }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: planning
  command: []
  args: [migrate]
  ownerSecret: planning-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [planning]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: budgeting
    podNames: [budgeting]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
