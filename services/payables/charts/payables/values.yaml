image:
  repository: ghcr.io/benjaminsrussell/payables
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
databaseSecret: payables-db
ledgerUrl: ""
controlAccount: "2000"
fxUrl: ""
partyUrl: ""
taxUrl: ""
# How often the withholding reporter sends the tax payment runs withheld to the tax service (#13; with taxUrl).
withholdingReportInterval: 30s
fxRateType: "spot"
replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
serviceMonitor:
  enabled: false

serviceIdentity:
  signingKeySecret: ""
  keyId: ""
  publicKeys: ""

postingProfilesSecret: ""

fieldCrypt:
  keysSecret: ""
  currentKeyId: ""
# The intercompany charge consumer (#40, args [consume]): takes the borrower's vendor invoice of intercompany's
# chargeinvoice.requested (Invoice settlement mode) into the vendor-invoice intake. It exits at start unless
# service:payables-iccharge is seeded. Off by default, like the other consumers, until it is turned on per environment
# (intercompany's outbox connector creates the topic). Its KafkaUser, ACLs and dead-letter topic are deploy/kafka/payables-consumer.yaml.
# The edi chart's payablesUrl needs edi's public key in serviceIdentity.publicKeys (edi=...) for the cXML invoice intake (#35).
consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: payables-iccharge
    username: payables-consumer
    dlqTopic: depot.payables.iccharge.dlq
    secret: ""
  # Posting without review for the pairings that opted in (autoPostInvoice on the intercompany pairing). Off: every charge waits in the
  # intake for an AP clerk, and a charge whose pairing opted in is taken in and left RECEIVED with the reason. On, it needs ledgerUrl,
  # serviceIdentity.signingKeySecret and postingProfilesSecret: each borrower legal entity's profile names its ledgerId, controlAccount
  # (the credit), icChargeExpenseAccount (the cost) and icChargeInputTaxAccount (when charges carry tax).
  autoPost:
    enabled: false
    paymentTermDays: 30
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [payables]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: batch
    namespace: batch
    podNames: [batch]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: edi
    podNames: [edi]
  - name: supplier-portal
    podNames: [supplier-portal]
  - name: treasury
    podNames: [treasury]
  - name: workflow
    podNames: [workflow]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
