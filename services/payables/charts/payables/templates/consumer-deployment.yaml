{{- if .Values.consumer.enabled }}
# The intercompany charge consumer (#40, args [consume]): takes the borrower's vendor invoice of every chargeinvoice.requested
# intercompany publishes in Invoice settlement mode into the vendor-invoice intake. It starts only while service:payables-iccharge
# is seeded in the service principal table. Kafka user and ACLs: deploy/kafka/payables-consumer.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-consumer
  labels:
    app.kubernetes.io/name: payables
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: payables
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payables
        app.kubernetes.io/component: consumer
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka
          secret:
            secretName: {{ required "consumer.kafka.secret is required" .Values.consumer.kafka.secret }}
            defaultMode: 0440
{{- if and .Values.consumer.autoPost.enabled .Values.serviceIdentity.signingKeySecret }}
        - name: service-identity
          secret:
            secretName: {{ .Values.serviceIdentity.signingKeySecret }}
            defaultMode: 0440
{{- end }}
      containers:
        - name: payables-consumer
          image: {{ include "payables.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [consume]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: admin
              containerPort: 9090
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret }}
                  key: DATABASE_URL
            - name: ADMIN_ADDR
              value: ":9090"
            - name: KAFKA_BROKERS
              value: {{ required "consumer.kafka.brokers is required" .Values.consumer.kafka.brokers | quote }}
            - name: KAFKA_GROUP
              value: {{ .Values.consumer.kafka.group | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.consumer.kafka.username | quote }}
            - name: KAFKA_PASSWORD_FILE
              value: /var/run/passage/kafka/password
            - name: KAFKA_TLS_CA_FILE
              value: /var/run/passage/kafka/ca.crt
{{- if .Values.consumer.autoPost.enabled }}
            # A pairing that opted in (autoPostInvoice) has its vendor invoice posted here: the ledger entry, the AP item, the intake row.
            - { name: LEDGER_URL, value: {{ required "ledgerUrl is required for consumer.autoPost" .Values.ledgerUrl | quote }} }
            - { name: PAYABLES_IC_LEDGER_ID, value: {{ required "consumer.autoPost.ledgerId is required" .Values.consumer.autoPost.ledgerId | quote }} }
            - { name: PAYABLES_IC_EXPENSE_ACCOUNT, value: {{ required "consumer.autoPost.expenseAccount is required" .Values.consumer.autoPost.expenseAccount | quote }} }
            - { name: PAYABLES_IC_CONTROL_ACCOUNT, value: {{ default .Values.controlAccount .Values.consumer.autoPost.controlAccount | quote }} }
            - { name: PAYABLES_IC_INPUT_TAX_ACCOUNT, value: {{ .Values.consumer.autoPost.inputTaxAccount | quote }} }
            - { name: PAYABLES_IC_PAYMENT_TERM_DAYS, value: {{ .Values.consumer.autoPost.paymentTermDays | quote }} }
            - name: PASSAGE_SERVICE_NAME
              value: payables
{{- if .Values.serviceIdentity.signingKeySecret }}
            - name: PASSAGE_SERVICE_SIGNING_KEY_FILE
              value: /var/run/passage/service-identity/signing-key
{{- if .Values.serviceIdentity.keyId }}
            - name: PASSAGE_SERVICE_KEY_ID
              value: {{ .Values.serviceIdentity.keyId | quote }}
{{- end }}
{{- end }}
{{- end }}
          volumeMounts:
            - { name: kafka, mountPath: /var/run/passage/kafka, readOnly: true }
{{- if and .Values.consumer.autoPost.enabled .Values.serviceIdentity.signingKeySecret }}
            - { name: service-identity, mountPath: /var/run/passage/service-identity, readOnly: true }
{{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
{{- end }}
