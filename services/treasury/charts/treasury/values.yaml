image: { repository: ghcr.io/benjaminsrussell/treasury, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: treasury-db
migrateOnStart: false
replicaCount: 2
statement:
  maxFileMb: 50
# Scratch space for multipart uploads (two concurrent maximum-size files per pod).
uploadSpoolSize: 128Mi
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }
serviceMonitor: { enabled: false }
# The cash forecast reads open items from payables (AP) and receivables (AR) with a signed service token
# (payables.forecast.read, receivables.forecast.read). The Secret holds the base64 Ed25519 seed under "signing-key";
# add treasury's public key to payables' and receivables' serviceIdentity.publicKeys first. Unset URLs leave the
# forecast on stored entries only.
serviceIdentity: { signingKeySecret: "", keyId: "" }
serviceUrls: { payables: "", receivables: "" }
# Bank connectivity keys stay in Vault transit and are never exported. Leave addr
# empty to switch it off (refused outside dev while bankChannels is set; the
# chart still emits TREASURY_BANK_CHANNELS so that refusal fires). Use k8sRole
# (Vault Kubernetes auth) or tokenSecret (a Secret holding VAULT_TOKEN).
# The Vault role must set bound_service_account_names to this release's
# ServiceAccount (named after the release) and bound_service_account_namespaces
# to its namespace, so no other pod can log in. sftpKeyVersion pins the transit
# key the bank is onboarded with; a rotation does not switch the login key.
vault:
  addr: ""
  k8sRole: ""
  k8sMount: kubernetes
  tokenSecret: ""
  signingKeyNames: []
  sftpKeyName: ""
  sftpKeyVersion: 0
  bankChannels: []
# Postings to the general ledger: a bank transaction made from a statement line, and cash desk journal lines and count
# differences. The ledger accepts them only with a service-signed token, so ledgerUrl needs serviceIdentity.signingKeySecret (add
# treasury's public key to the ledger's serviceIdentity.publicKeys first). glProfiles is the TREASURY_GL_PROFILES JSON array,
# one profile per legal entity: [{"legalEntityId": "...", "ledgerId": "...", "bankAccounts": {"<bank account id>": "<ledger account>"},
# "feeAccount": "...", "interestAccount": "...", "suspenseAccount": "...", "cashAccounts": {"<desk cash account id>": "<ledger account>"},
# "cashDifferenceAccount": "..."}]. cashAccounts turns posting on for the legal entity's cash desks. Without ledgerUrl nothing is posted.
ledgerUrl: ""
glProfiles: ""

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: treasury
  command: []
  args: [migrate]
  ownerSecret: treasury-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [treasury]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
