image:
  repository: ghcr.io/benjaminsrussell/depot-scheduling
  # Pin by digest in deploy/ (Argo CD digest-pinned sync); tag is a fallback for dev.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

# Apply migrations/*.sql at start-up (dev clusters); production runs them as a job.
migrateOnStart: false

service:
  port: 8080
  adminPort: 9090

database:
  # Secret holding DATABASE_URL (provisioned by External Secrets from Vault).
  secretName: scheduling-db
  secretKey: DATABASE_URL

# Environment passed through unchanged; names match cmd/scheduling/main.go.
config:
  SCHED_BOTTLENECK_PCT: "90"
  SCHED_BOTTLENECK_WEEKS: "3"
  SCHED_HORIZON_DAYS: "365"
  # scheduler-opt (services/scheduler-py chart) for cp-sat campaign
  # sequencing; empty keeps nearest-neighbour with SCHED-0006 UNAVAILABLE.
  SCHED_OPT_URL: "http://scheduler-opt:8080"

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: scheduling-downtime
    # The production order intake's own group (slice 18); it starts only once
    # service:scheduling-order-import is seeded in the service principal table.
    orderGroup: scheduling-order-import
    username: scheduling-consumer
    secret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

serviceMonitor:
  enabled: false
  interval: 30s

podSecurityContext:
  # Group of the 0440 Kafka credentials and other mounted Secrets, for the nonroot user (D34).
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: scheduling
  command: []
  args: [migrate]
  ownerSecret: scheduling-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [scheduling]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
