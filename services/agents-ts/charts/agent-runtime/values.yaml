image: { repository: ghcr.io/benjaminsrussell/depot-agents, digest: "", tag: "", pullPolicy: IfNotPresent }
# Secret with the key DATABASE_URL (database depot_agents, role depot_app).
databaseSecret: agents-db
# Dev only, with migrateJob.enabled false: run the migrations at start. Otherwise the chart's migration Job (migrateJob) applies them as the owner role.
migrateOnStart: false
# Every pod polls the shared kill switch (kill_switch_change) every killSwitchPollMs and fails closed after
# 10 s without a successful poll (AC-47.6), so a toggle taken on one pod halts runs on all of them.
replicaCount: 2
killSwitchPollMs: 1000
# The MCP gateway every tool call goes through, with the caller's own token.
mcpUrl: http://mcp-gateway.depot.svc.cluster.local:8080
# Deployment profile: standard (CUI and unclassified records never reach a model) or cui (only attested in-boundary routes).
boundary: standard
# Gateway base URL of services/compliance, where record data classes are resolved under this service's own signed service token
# (grant agents -> compliance, serviceIdentity below; the compliance chart needs agents's public key in serviceIdentity.publicKeys).
# Empty, or no signing key: every record is UNKNOWN and withheld.
complianceUrl: ""
auditUrl: ""
model:
  # anthropic, openai (OpenAI-compatible and Azure OpenAI) or bedrock.
  provider: anthropic
  # Model id for agents and for the copilot. Claude defaults: claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5.
  default: claude-sonnet-5-5
  copilot: ""
  # Azure region the model endpoint is hosted in (AGENTS_PROVIDER_REGION). Required under a cloud profile that pins
  # regions (gcc, gcc-high, dod, eu-data-boundary): the endpoint is refused without it, and every run records it (#605).
  region: ""
  # JSON object of agent id to model id, for example '{"ap_coding":"claude-opus-5-5","anomaly":"claude-haiku-5-5"}'.
  overrides: ""
# Secret holding the provider credentials as env keys: ANTHROPIC_API_KEY, or OPENAI_API_KEY, or
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN). Never put a key in values.
providerSecret: agents-provider
# Optional endpoint settings for the openai and bedrock providers.
openai: { baseUrl: "", auth: bearer, apiVersion: "" }
bedrock: { region: "" }
# Entity fields tagged phi in the metadata (the generated <Entity>PHIFields() lists). Text that carries a value under
# one of them is never sent to a model: the run fails AGT-0215 (#606).
phiFields: []
runTokenCap: 20000
copilot: { tokenCap: 8000, maxTurns: 8 }
# agent.approval_expiry_h (BR-47.3): 1 to 240; empty means 72.
approvalExpiryHours: ""
# How a run executes. inprocess (the default, for dev): one promise in the pod that took the request, lost with the pod.
# temporal (production): each run is a workflow in workflow-ts (agentRunWorkflow) that calls this service's run steps,
# so a run waiting for an approval resumes after a restart. The two services authenticate each other with signed service
# tokens (platform/go/tenant format): workflow-ts calls the run-step routes here, verified against servicePublicKeys (workflow-ts's
# Ed25519 public key as "workflow-ts=<base64>", comma separated for more callers), and this service starts and wakes the workflow
# with a token signed by the key in serviceIdentity.signingKeySecret; its public key goes in workflow-ts's agentsPublicKeys as
# "agents=<base64>". workflowUrl is the workflow-ts Service (named `workflows`). workflow-ts's pods are admitted to the API port as
# a generated peer (ingressPolicy.peers below).
runEngine: inprocess
workflowUrl: http://workflows.depot.svc:8080
servicePublicKeys: ""
serviceIdentity:
  # Secret with the key `signing-key` (the base64 32-byte Ed25519 seed of the service `agents`).
  signingKeySecret: ""
  keyId: ""
# Above this amount an approver who started the run may not approve it (wave-48 SoD limit).
selfApprovalLimit: { amount: "0", currency: USD }
# An agent runs only when the newest eval_run of its exact definition passed (AGT-0204 otherwise). The eval pipeline
# records its report with `node dist/cli/record-eval.js report.json`, using this release's image and model settings and
# the owner (migration) role's DATABASE_URL: the pods' depot_app role may only read eval_run (FR-47.10).
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
serviceMonitor: { enabled: false }
# Caller authentication: the runtime verifies every caller's bearer token itself (RS256, issuer, audience, expiry) and
# never trusts the X-Depot-* edge headers on their own. issuer is the realm that signs the tokens; the keys come from
# jwksUrl (the realm's certs endpoint) or from a ConfigMap holding the key set (the gateway's localJWKS). The process
# refuses to start without an issuer and keys.
auth:
  issuer: ""
  audience: depot-api
  jwksUrl: ""
  jwksConfigMap: { name: "", key: jwks }

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: agent-runtime
  command: []
  args: [dist/main.js, migrate]
  ownerSecret: agent-runtime-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [agent-runtime]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: workflow
    podNames: [workflow]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
