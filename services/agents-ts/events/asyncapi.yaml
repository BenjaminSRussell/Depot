asyncapi: 3.0.0
info:
  title: Depot agent runtime events
  version: 0.3.0
  description: |
    PRD 9.47.5 events, CloudEvents 1.0 envelope; the schemas below are the
    data member, with snake_case field names as in the PRD and the other
    services' events. `src/domain/events.ts` builds and validates the payloads
    of four events (run.completed, approval.requested, budget.threshold,
    killswitch.changed); the schemas below mirror those payloads. Three are
    written to the outbox inside the business transaction, as CloudEvents
    envelopes (src/store/outbox.ts), and relayed by the `outbox-agents-ts`
    connector (deploy/kafka/connect.yaml), which routes
    dev.depot.agent.<entity>.<verb>.v<n> to depot.agent.<entity>:
    approval.requested (src/store/approvals.ts), budget.threshold
    (`PgAgentStore.settle`) and killswitch.changed (`POST
    /api/v1/agents/kill-switch`, src/store/killswitch.ts). run.completed is
    built but not written yet (see NOT-IMPLEMENTED.md); its channel
    depot.agent.run and the connector's ACL already exist, so the wiring needs
    no deploy change. `version.promoted` is still planned. Agent workers do not consume killswitch.changed
    (they poll kill_switch_change); `KillSwitchFeed`
    (src/runtime/killswitch-feed.ts) parses exactly the KillSwitchChangedData
    schema below for a consumer outside this service.
defaultContentType: application/cloudevents+json
channels:
  runCompleted:
    address: depot.agent.run
    description: Outbox relay topic for finished runs. Nothing writes run.completed to the outbox yet (NOT-IMPLEMENTED.md).
    messages:
      runCompleted:
        $ref: "#/components/messages/RunCompleted"
  approvalRequested:
    address: depot.agent.approval
    description: Outbox relay topic for approval requests raised at an approval gate (FR-47.8).
    messages:
      approvalRequested:
        $ref: "#/components/messages/ApprovalRequested"
  budgetThreshold:
    address: depot.agent.budget
    description: Outbox relay topic for cost-guard alerts (AC-47.4).
    messages:
      budgetThreshold:
        $ref: "#/components/messages/BudgetThreshold"
  killSwitchChanged:
    address: depot.agent.killswitch
    description: Outbox relay topic for kill-switch toggles.
    messages:
      killSwitchChanged:
        $ref: "#/components/messages/KillSwitchChanged"
operations:
  publishRunCompleted:
    action: send
    channel:
      $ref: "#/channels/runCompleted"
    summary: Emitted at run end once the run engine writes it to the outbox (not wired yet).
    messages:
      - $ref: "#/channels/runCompleted/messages/runCompleted"
  publishApprovalRequested:
    action: send
    channel:
      $ref: "#/channels/approvalRequested"
    summary: Written with the approval request in one transaction (src/store/approvals.ts).
    messages:
      - $ref: "#/channels/approvalRequested/messages/approvalRequested"
  publishBudgetThreshold:
    action: send
    channel:
      $ref: "#/channels/budgetThreshold"
    summary: Written by PgAgentStore.settle when the month's budget moves up into SOFT or HARD.
    messages:
      - $ref: "#/channels/budgetThreshold/messages/budgetThreshold"
  publishKillSwitchChanged:
    action: send
    channel:
      $ref: "#/channels/killSwitchChanged"
    summary: Written with the toggle and its version in one transaction (src/store/killswitch.ts).
    messages:
      - $ref: "#/channels/killSwitchChanged/messages/killSwitchChanged"
components:
  messages:
    RunCompleted:
      name: dev.depot.agent.run.completed.v1
      summary: A run finished
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/RunCompletedData"
    ApprovalRequested:
      name: dev.depot.agent.approval.requested.v1
      summary: A run reached an approval gate
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/ApprovalRequestedData"
    BudgetThreshold:
      name: dev.depot.agent.budget.threshold.v1
      summary: The month's token budget moved up into SOFT or HARD
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/BudgetThresholdData"
    KillSwitchChanged:
      name: dev.depot.agent.killswitch.changed.v1
      summary: The kill switch was toggled
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/KillSwitchChangedData"
  schemas:
    PlannedEventTypes:
      type: string
      description: Event types planned for the wiring slice; additive-only evolution.
      enum:
        - dev.depot.agent.run.completed.v1
        - dev.depot.agent.approval.requested.v1
        - dev.depot.agent.budget.threshold.v1
        - dev.depot.agent.killswitch.changed.v1
        - dev.depot.agent.version.promoted.v1
    RunCompletedData:
      type: object
      description: Emitted at run end. Tool names and decisions only; no inputs, outputs or display text (PII stays out of events).
      required: [run_id, agent_id, version, status, code, tool_calls, tokens_in, tokens_out, estimated, cost_usd]
      additionalProperties: false
      properties:
        run_id: { type: string }
        agent_id: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [COMMITTED, REJECTED, FAILED, KILLED] }
        code: { type: [string, "null"] }
        tool_calls:
          type: array
          items:
            type: object
            required: [seq, tool, decision]
            additionalProperties: false
            properties:
              seq: { type: integer, minimum: 1 }
              tool: { type: string }
              decision: { type: string, enum: [AUTO, APPROVED, REJECTED, DENIED] }
        tokens_in: { type: integer, minimum: 0 }
        tokens_out: { type: integer, minimum: 0 }
        estimated: { type: boolean }
        cost_usd: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,6})?$" }
    ApprovalRequestedData:
      type: object
      description: |
        Emitted when a run reaches an approval gate (FR-47.8); consumed by the
        workflow inbox. `proposal` is the pseudonymized proposal: raw PII is
        refused at build time (AGT-0210). The inbox shows real values from the
        run, never from this event.
      required: [run_id, action_id, tool_name, proposal, confidence]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        action_id: { type: string, minLength: 1 }
        tool_name: { type: string, minLength: 1 }
        proposal: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        risk_score: { type: number, minimum: 0, maximum: 1 }
    BudgetThresholdData:
      type: object
      description: Cost-guard alert (AC-47.4). Emitted only when the budget moves up into SOFT (80%) or HARD (100%).
      required: [tenant_id, month, pct, state]
      additionalProperties: false
      properties:
        tenant_id: { type: string, format: uuid }
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        pct: { type: integer, minimum: 0 }
        state: { type: string, enum: [SOFT, HARD] }
    KillSwitchChangedData:
      type: object
      description: One kill-switch toggle. Versions are strictly increasing; consumers apply them in order and ignore duplicates.
      required: [scope, tenant_id, active, by_user, version, changed_at]
      additionalProperties: false
      properties:
        scope: { type: string, enum: [GLOBAL, TENANT] }
        tenant_id: { type: [string, "null"], format: uuid }
        active: { type: boolean }
        by_user: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        changed_at: { type: string, format: date-time }
