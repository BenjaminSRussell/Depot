openapi: 3.1.0
info:
  title: Depot agent runtime
  version: 0.1.0
  description: |
    PRD 9.47.5 endpoints for agent runs, approvals, kill switch, budgets and
    eval triggers. This build serves the kill switch (read and toggle), the
    approval decision, run start and run read, the copilot chat and, for runs
    executed as workflows, the service-to-service run steps (src/api/router.ts), and the budgets list and per-agent cap.
    The definitions, availability, eval and promotion endpoints are not
    served yet; NOT-IMPLEMENTED.md lists them. Every route needs the
    caller's bearer token (Authorization: Bearer), which the runtime verifies
    itself (RS256, issuer, audience, expiry) and takes the tenant, user and
    duties from; the x-depot-tenant, x-depot-user and x-depot-duties
    headers the edge sets must match it, and are never trusted alone (401
    AGT-0401). Errors are RFC 9457 problems with a stable `code`: AGT-04xx and
    AGT-0500 for HTTP-level errors, AGT-02xx from the PRD 9.47.18 catalog for
    business refusals (README, Error codes).
servers:
  - url: https://api.depot.dev
paths:
  /api/v1/agents/kill-switch:
    get:
      operationId: getKillSwitchStatus
      summary: The caller's tenant kill switch and the global kill switch (9.47.6 agent administration)
      description: |
        As this worker sees them. `halted` is true when runs for the caller's
        tenant are stopped for any reason, including a worker that has not
        read the shared kill switch (kill_switch_change) for 10 s (`stale`,
        fail-closed).
        Readable with agents.admin or platform.global.admin.
      x-depot-duty: agents.admin
      responses:
        "200":
          description: Kill switch status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KillSwitchStatus"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      operationId: toggleKillSwitch
      summary: Halt or resume agent runs for a tenant or globally (AC-47.6)
      description: |
        TENANT scope needs agents.admin and the caller's own tenant (AGT-0403
        otherwise). GLOBAL scope needs platform.global.admin (break-glass). Idempotent
        by scope: asking for the state the switch is already in returns its
        current toggle and publishes nothing; the stored state decides, so the
        same toggle sent to two workers is stored once. Otherwise the toggle
        and its dev.depot.agent.killswitch.changed.v1 outbox row are stored
        in one transaction, applied to this worker, and reach every other
        worker at its next poll (within a second by default). Versions are
        strictly increasing so workers ignore duplicates.
      x-depot-duty: agents.admin
      x-depot-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KillSwitchCommand"}
      responses:
        "200":
          description: The switch's current toggle.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KillSwitchResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/ai-data-policy:
    get:
      operationId: getAiDataPolicy
      summary: The tenant's AI data policy, a matrix of module by data class
      description: |
        Modules are the domains of the read tools the MCP gateway exposes (the
        `x-depot-tool` operations of the services): ap and ar. Each module has
        a boolean per data class P0 to P3 and CUI. A tenant that never set a
        policy gets version 1 with P0 and P1 allowed and P2, P3 and CUI denied
        for every module. The ETag is the version, to be sent as If-Match.
        An unreadable policy is 503 AGT-0216.
      x-depot-duty: aipolicy.read
      responses:
        "200":
          description: The tenant policy.
          headers:
            ETag: {schema: {type: string}, description: 'The policy version, quoted.'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiDataPolicy"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    put:
      operationId: putAiDataPolicy
      summary: Change cells of the tenant's AI data policy
      description: |
        Needs aipolicy.write and tenant.administer. The body names only the
        cells to change; a patch that changes nothing returns the current
        policy and stores and publishes nothing. A change stores the next
        version with the before and after matrix, the actor and the reason,
        and writes dev.depot.agent.aipolicy.changed.v1 in the same
        transaction. If-Match must carry the version read (428 AGT-0428
        absent, 412 AGT-0412 stale, the architecture's conflict_version). Allowing P3 or CUI is refused with 422
        AGT-0217.
      x-depot-duty: aipolicy.write
      x-depot-approval: none
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiDataPolicyPatch"}
      responses:
        "200":
          description: The policy after the change.
          headers:
            ETag: {schema: {type: string}, description: 'The policy version, quoted.'}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiDataPolicy"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "412": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}/actions/{actionId}/decision:
    post:
      operationId: decideAgentAction
      summary: Approve or reject a proposal that waits at the approval gate (FR-47.8)
      description: |
        The caller must hold the action's approval duty (AGT-0203). An approver
        who started the run may not approve above the self-approval limit
        (AGT-0209). An expired request is recorded and answered with decision
        REJECTED, reason EXPIRED and code AGT-0208 (BR-47.3): the source
        document stays unposted. Idempotent by action id: the same decision
        again returns the recorded one; a different decision on a decided
        action is 409 AGT-0409. Another tenant's action is never found (404).
      x-depot-duty: AgentApprove
      x-depot-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: actionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionCommand"}
      responses:
        "200":
          description: The recorded decision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalDecisionResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/{agentId}/runs:
    post:
      operationId: startAgentRun
      summary: Start an agent run for one document or question (FR-47.4)
      description: |
        Refused before any state exists when the agent is unknown (404 AGT-0404),
        the caller lacks agents.invoke or one of the agent's own duties (403
        AGT-0203), the kill switch is on (422 AGT-0201), the agent version has no
        passing evaluation (422 AGT-0204) or the month's token budget is
        exhausted (422 AGT-0202). Otherwise the run executes in the background
        as the caller, with the caller's bearer token forwarded to the MCP
        gateway, and the answer is 202 with the run id. A run in suggest mode
        waits at the approval gate; poll GET /api/v1/agents/runs/{runId}.
      x-depot-duty: agents.invoke
      x-depot-approval: none
      parameters:
        - {name: agentId, in: path, required: true, schema: {type: string, enum: [ap_coding, cash_app, mrp_triage, collections, anomaly]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1, maxLength: 8000}
              additionalProperties: false
      responses:
        "202":
          description: The run was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StartedRun"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}:
    get:
      operationId: getAgentRun
      summary: A run of the caller's tenant with the approvals still waiting
      description: |
        status is RUNNING until the run ends, including while it waits for an
        approver. pendingApprovals lists the action ids the decision endpoint
        takes. Another tenant's run is never found (404).
      x-depot-duty: agents.run.read
      x-depot-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunView"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}/actions:
    get:
      operationId: listAgentRunActions
      summary: The audit rows of a run (AC-47.3)
      description: Inputs and outputs are pseudonymized; the approver and the committed reference are recorded per action.
      x-depot-duty: agents.run.read
      x-depot-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The actions in sequence order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AgentAction"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/runs/{runId}/steps/{step}:
    post:
      operationId: runAgentStep
      summary: One step of a run executed as a workflow (service to service)
      description: |
        Called by workflow-ts's agentRunWorkflow with a signed service token in X-Depot-Service-Token
        (tenant-level, granted agents.run.workflow); a user's bearer token is refused. Each step is idempotent: a
        retry after a lost response answers from the stored state. `begin` reserves the budget hold and opens the run,
        `plan` makes the model call and either opens the approval request or ends the run, `resolve` reads the stored
        decision (with expire true an undecided request is rejected as expired, AGT-0208), `commit` calls the tool as
        the approver, and `abort` ends a run the workflow gave up on. The kill switch is checked inside begin, plan
        and commit. Only served when AGENTS_RUN_ENGINE=temporal; otherwise 404.
      x-depot-duty: agents.run.workflow
      x-depot-approval: none
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: step, in: path, required: true, schema: {type: string, enum: [begin, plan, resolve, commit, abort]}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expire: {type: boolean, description: "resolve only: the approval window has passed"}
                reason: {type: string, maxLength: 500, description: "abort only"}
      responses:
        "200":
          description: What the workflow does next.
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next: {type: string, enum: [plan, await_approval, commit, done]}
                  actionId: {type: string, format: uuid}
                  expiresAtMs: {type: integer}
                  status: {type: string}
                  code: {type: string}
                  reason: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/knowledge/search:
    post:
      operationId: knowledgeSearch
      summary: Hybrid search over the tenant's knowledge chunks (FR-47.14)
      description: |
        Postgres full-text search and embedding similarity, fused by reciprocal rank. Each chunk carries its fused score
        and, when the embedding side found it, its cosine similarity; the copilot's citation gate (AGT-0212) accepts a
        chunk only at 0.75 or more. Without an embedding port the search is keyword only and no chunk carries a
        similarity. The copilot calls this as its read tool `depot.knowledge.search`.
      x-depot-duty: mcp.copilot.use
      x-depot-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 1000}
                limit: {type: integer, minimum: 1, maximum: 20, default: 10}
              additionalProperties: false
      responses:
        "200":
          description: Chunks, best first.
          content:
            application/json:
              schema:
                type: object
                required: [chunks]
                properties:
                  chunks:
                    type: array
                    items:
                      type: object
                      required: [chunkId, sourceType, sourceRef, section, fusedScore]
                      properties:
                        chunkId: {type: string, format: uuid}
                        sourceType: {type: string, enum: [ARTICLE, DOC, POLICY]}
                        sourceRef: {type: string}
                        section: {type: string}
                        fusedScore: {type: number}
                        similarity: {type: number}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/knowledge/chunks:
    post:
      operationId: knowledgeIndexChunks
      summary: Index or replace knowledge chunks (FR-47.14)
      description: |
        Stores 1 to 100 chunks of articles, documents or policies, replacing a chunk of the same source and section, and
        embeds them when an embedding port is configured.
      x-depot-duty: knowledge.write
      x-depot-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunks]
              properties:
                chunks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [sourceType, sourceRef, section, body]
                    properties:
                      sourceType: {type: string, enum: [ARTICLE, DOC, POLICY]}
                      sourceRef: {type: string, minLength: 1, maxLength: 200}
                      section: {type: string, minLength: 1, maxLength: 200}
                      body: {type: string, minLength: 1, maxLength: 20000}
                    additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: How many chunks were indexed and embedded.
          content:
            application/json:
              schema:
                type: object
                required: [indexed, embedded]
                properties:
                  indexed: {type: integer}
                  embedded: {type: integer}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/copilot/chat:
    post:
      operationId: copilotChat
      summary: One copilot turn (FR-47.3, BR-47.11)
      description: |
        The model may call read tools the caller is allowed to use; each call is
        made with the caller's token and audited as a run of agent "copilot". A
        tool outside the caller's duties is answered AGT-0203 and never called.
        With Accept: text/event-stream the answer arrives as `token` frames
        ({text}) and one terminal `done` frame (the JSON body); otherwise as
        JSON. Failures before the first byte are ordinary problems. Answers are
        cached per tenant, user, duty set and mode for 5 minutes.
      x-depot-duty: mcp.copilot.use
      x-depot-approval: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, message]
              properties:
                mode: {type: string, enum: [ask, explain, draft, summarize]}
                message: {type: string, minLength: 1, maxLength: 4000}
                recordRef: {type: string, minLength: 1, maxLength: 200}
              additionalProperties: false
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatResponse"}
            text/event-stream:
              schema: {type: string, description: "token frames then one done frame"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/budgets:
    get:
      operationId: listAgentBudgets
      summary: The tenant's and each agent's token cap, use and status this month (FR-47.11)
      description: |
        The tenant entry reads the same token_budget counters the run start
        check and the budget hold read, so a HARD status here is the state in
        which a new run is refused with AGT-0202. status is OK, SOFT at the
        soft percent (default 80) or HARD at 100% of the cap in either
        direction. An agent entry's cap is its newest PUT, else the tenant's
        limits. costUsed is derived from tokens at the architecture's rates.
      x-depot-duty: agentbudget.read
      x-depot-approval: none
      responses:
        "200":
          description: One entry for the tenant and one per registered agent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/agents/budgets/{agentId}:
    put:
      operationId: setAgentBudgetCap
      summary: Set an agent's token cap (absolute, replay-safe)
      description: |
        Stores the cap and one agent_budget_change audit row with the
        previous cap and the caller. Both limits are required non-negative
        integers; anything else is 422 AGT-0422 naming the field. An unknown
        agent is 404 AGT-0404. The cap is reported and audited; the run start
        check enforces the tenant budget only.
      x-depot-duty: agentbudget.write
      x-depot-approval: none
      parameters:
        - {name: agentId, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BudgetCapCommand"}
      responses:
        "200":
          description: The agent's entry with the new cap.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BudgetEntry"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
components:
  responses:
    Problem:
      description: RFC 9457 problem details (application/problem+json).
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string, format: uri, description: "https://depot.dev/problems/<code>"}
              title: {type: string}
              status: {type: integer}
              code: {type: string, pattern: "^AGT-[0-9]{4}$"}
              detail: {type: string}
              instance: {type: string}
  schemas:
    AiDataPolicyCells:
      type: object
      properties:
        P0: {type: boolean}
        P1: {type: boolean}
        P2: {type: boolean}
        P3: {type: boolean}
        CUI: {type: boolean}
      additionalProperties: false
    AiDataPolicy:
      type: object
      required: [version, modules]
      properties:
        version: {type: integer, minimum: 1}
        modules:
          type: object
          required: [ap, ar]
          properties:
            ap: {$ref: "#/components/schemas/AiDataPolicyCells"}
            ar: {$ref: "#/components/schemas/AiDataPolicyCells"}
          additionalProperties: false
    AiDataPolicyPatch:
      type: object
      required: [modules]
      properties:
        modules:
          type: object
          minProperties: 1
          properties:
            ap: {$ref: "#/components/schemas/AiDataPolicyCells"}
            ar: {$ref: "#/components/schemas/AiDataPolicyCells"}
          additionalProperties: false
        reason: {type: string, maxLength: 500}
      additionalProperties: false
    StartedRun:
      type: object
      required: [runId, agentId, agentVersion, status]
      properties:
        runId: {type: string, format: uuid}
        agentId: {type: string}
        agentVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [RUNNING]}
    PendingApproval:
      type: object
      required: [actionId, runId, seq, tool, requestedAt, approvalDuty]
      properties:
        actionId: {type: string, format: uuid}
        runId: {type: string}
        seq: {type: integer, minimum: 1}
        tool: {type: string}
        requestedAt: {type: string, format: date-time}
        approvalDuty: {type: string}
    RunView:
      type: object
      required: [run, pendingApprovals]
      properties:
        run:
          type: object
          required: [runId, agentId, agentVersion, invokerUserId, status, tokensIn, tokensOut, estimated, createdAt]
          properties:
            runId: {type: string}
            agentId: {type: string}
            agentVersion: {type: integer}
            invokerUserId: {type: string}
            status: {type: string, enum: [RUNNING, COMMITTED, REJECTED, FAILED, KILLED, FAILED_AFTER_COMMIT]}
            code: {type: string}
            reason: {type: string}
            tokensIn: {type: integer, minimum: 0}
            tokensOut: {type: integer, minimum: 0}
            estimated: {type: boolean}
            postCommitError: {type: string}
            createdAt: {type: string, format: date-time}
        pendingApprovals:
          type: array
          items: {$ref: "#/components/schemas/PendingApproval"}
    TokenPair:
      type: object
      required: [tokensIn, tokensOut]
      properties:
        tokensIn: {type: integer, minimum: 0}
        tokensOut: {type: integer, minimum: 0}
    BudgetEntry:
      type: object
      required: [scope, agentId, cap, tokensUsed, costUsed, percentConsumed, status]
      properties:
        scope: {type: string, enum: [TENANT, AGENT]}
        agentId: {type: [string, "null"]}
        cap: {$ref: "#/components/schemas/TokenPair"}
        tokensUsed: {$ref: "#/components/schemas/TokenPair"}
        costUsed: {type: string, pattern: "^[0-9]+\\.[0-9]{6}$"}
        percentConsumed: {type: number, minimum: 0}
        status: {type: string, enum: [OK, SOFT, HARD]}
    BudgetList:
      type: object
      required: [month, tenant, agents]
      properties:
        month: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
        tenant: {$ref: "#/components/schemas/BudgetEntry"}
        agents:
          type: array
          items: {$ref: "#/components/schemas/BudgetEntry"}
    BudgetCapCommand:
      type: object
      required: [limitIn, limitOut]
      properties:
        limitIn: {type: integer, minimum: 0}
        limitOut: {type: integer, minimum: 0}
      additionalProperties: false
    ChatResponse:
      type: object
      required: [answer, citations, toolCalls, refusal, generated]
      properties:
        answer: {type: string}
        citations:
          type: array
          items:
            type: object
            required: [sourceType, sourceRef, label]
            properties:
              sourceType: {type: string, enum: [RECORD, METRIC, ARTICLE, DOC, POLICY]}
              sourceRef: {type: string}
              label: {type: string}
        toolCalls:
          type: array
          items:
            type: object
            required: [tool, status]
            properties:
              tool: {type: string}
              status: {type: string, enum: [OK, DENIED, ERROR]}
              code: {type: string}
        refusal:
          type: [object, "null"]
          properties:
            code: {type: string}
            message: {type: string}
        generated: {type: boolean, enum: [true]}
    KillSwitchCommand:
      type: object
      required: [scope, active]
      properties:
        scope: {type: string, enum: [GLOBAL, TENANT]}
        tenantId: {type: [string, "null"], format: uuid, description: Required for TENANT, forbidden for GLOBAL.}
        active: {type: boolean}
      additionalProperties: false
    KillSwitchResult:
      type: object
      required: [scope, tenantId, active, version, changedAt, byUser]
      properties:
        scope: {type: string, enum: [GLOBAL, TENANT]}
        tenantId: {type: [string, "null"], format: uuid}
        active: {type: boolean}
        version: {type: integer, minimum: 1}
        changedAt: {type: string, format: date-time}
        byUser: {type: string, format: uuid}
    KillSwitchState:
      type: object
      required: [active, version, changedAt]
      properties:
        active: {type: boolean, description: False when the switch was never toggled.}
        version: {type: [integer, "null"], minimum: 1}
        changedAt: {type: [string, "null"], format: date-time}
    KillSwitchStatus:
      type: object
      required: [tenantId, halted, stale, tenant, global]
      properties:
        tenantId: {type: string, format: uuid}
        halted: {type: boolean}
        stale: {type: boolean}
        tenant:
          allOf:
            - {$ref: "#/components/schemas/KillSwitchState"}
            - type: object
              required: [byUser]
              properties:
                byUser: {type: [string, "null"], format: uuid}
        global:
          description: The operator who toggled it belongs to another tenant, so no user id is returned.
          allOf:
            - {$ref: "#/components/schemas/KillSwitchState"}
    ApprovalDecisionCommand:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVED, REJECTED]}
      additionalProperties: false
    ApprovalDecisionResult:
      type: object
      required: [runId, actionId, decision, approverUserId, decidedAt]
      properties:
        runId: {type: string, format: uuid}
        actionId: {type: string, format: uuid}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string, enum: [EXPIRED]}
        code: {type: string, enum: [AGT-0208]}
        approverUserId: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
    RunStatus:
      type: string
      description: BR-47.1 run state machine. COMMITTED, REJECTED, FAILED and KILLED are terminal.
      enum: [PLANNING, ACTING, AWAITING_APPROVAL, COMMITTED, REJECTED, FAILED, KILLED]
    ActionDecision:
      type: string
      enum: [APPROVED, REJECTED, AUTO, DENIED]
    AgentMode:
      type: string
      enum: [OFF, SUGGEST, AUTO]
    AgentErrorCode:
      type: string
      description: Stable codes from PRD 9.47.18 raised by this slice.
      enum: [AGT-0201, AGT-0202, AGT-0203, AGT-0204, AGT-0208, AGT-0209, AGT-0210, AGT-0214]
    RunResult:
      type: object
      description: Returned by runAgent. Mirrors RunResult in src/runtime/engine.ts.
      required: [runId, status, tokensIn, tokensOut, estimated, actions]
      properties:
        runId: {type: string}
        status: {$ref: "#/components/schemas/RunStatus"}
        code: {$ref: "#/components/schemas/AgentErrorCode"}
        reason: {type: string}
        displayText: {type: string, description: Model text with pseudonyms resolved; shown in the UI only.}
        tokensIn: {type: integer, minimum: 0}
        tokensOut: {type: integer, minimum: 0}
        estimated: {type: boolean, description: BR-47.4 — true when the provider reported no usage.}
        budgetState: {type: string, enum: [OK, SOFT, HARD]}
        actions:
          type: array
          items: {$ref: "#/components/schemas/AgentAction"}
    AgentAction:
      type: object
      description: One audited tool call or proposal (agent_action).
      required: [seq, toolName, inputJson, decision, committedEntityRef, approverUserId]
      properties:
        seq: {type: integer, minimum: 1}
        toolName: {type: string}
        inputJson: {type: string, description: Redacted input. Never contains raw PII.}
        decision: {$ref: "#/components/schemas/ActionDecision"}
        approverUserId: {type: [string, "null"], format: uuid}
        committedEntityRef: {type: [string, "null"]}
