apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-receivables
  labels:
    app.kubernetes.io/name: passage-receivables
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: passage-receivables
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passage-receivables
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if or .Values.sftpPoll.sources .Values.payments.provider }}
      # The image runs as the distroless nonroot user (65532); the SFTP key and payment Secrets are root-owned, so the pod's fsGroup
      # and a group-readable mode are what let the service read them.
      securityContext:
        fsGroup: 65532
      {{- end }}
      containers:
        - name: receivables
          image: "{{ (include "passage.imageRepository" $) }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
            {{- if .Values.payments.provider }}
            - name: webhook
              containerPort: {{ .Values.payments.webhookPort }}
            {{- end }}
          env:
            {{- include "passage.cloudEnv" $ | nindent 12 }}
            - name: PASSAGE_ENV
              value: production
            - name: SERVICE_NAME
              value: receivables
            - name: HTTP_ADDR
              value: ":{{ .Values.service.port }}"
            - name: ADMIN_ADDR
              value: ":{{ .Values.service.adminPort }}"
            - name: MIGRATE_ON_START
              value: {{ .Values.migrations.migrateOnStart | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- if .Values.rmaSweep.tenantIds }}
            - name: RECEIVABLES_RMA_SWEEP_TENANT_IDS
              value: {{ join "," .Values.rmaSweep.tenantIds | quote }}
            - name: RECEIVABLES_RMA_SWEEP_INTERVAL
              value: {{ .Values.rmaSweep.interval | quote }}
            - name: RECEIVABLES_RMA_RESERVATION_TTL
              value: {{ .Values.rmaSweep.reservationTtl | quote }}
            {{- end }}
            {{- if .Values.fxUrl }}
            - name: FX_URL
              value: {{ .Values.fxUrl | quote }}
            {{- end }}
            {{- if .Values.autoApply.tenantIds }}
            - name: RECEIVABLES_AUTO_APPLY_TENANT_IDS
              value: {{ join "," .Values.autoApply.tenantIds | quote }}
            {{- if .Values.autoApply.at }}
            - name: RECEIVABLES_AUTO_APPLY_AT
              value: {{ .Values.autoApply.at | quote }}
            {{- else }}
            - name: RECEIVABLES_AUTO_APPLY_INTERVAL
              value: {{ .Values.autoApply.interval | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.sftpPoll.sources }}
            - name: RECEIVABLES_SFTP_SOURCES
              value: {{ .Values.sftpPoll.sources | toJson | quote }}
            - name: RECEIVABLES_SFTP_KEY_FILE
              value: /var/run/passage/sftp/{{ .Values.sftpPoll.keySecretKey }}
            {{- if .Values.sftpPoll.at }}
            - name: RECEIVABLES_SFTP_POLL_AT
              value: {{ .Values.sftpPoll.at | quote }}
            {{- else }}
            - name: RECEIVABLES_SFTP_POLL_INTERVAL
              value: {{ .Values.sftpPoll.interval | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.payments.provider }}
            - name: RECEIVABLES_PAYMENT_PROVIDER
              value: {{ .Values.payments.provider | quote }}
            - name: RECEIVABLES_WEBHOOK_ADDR
              value: ":{{ .Values.payments.webhookPort }}"
            - name: STRIPE_SECRET_KEY_FILE
              value: /var/run/passage/payments/{{ .Values.payments.secretKeyKey }}
            - name: STRIPE_WEBHOOK_SECRET_FILE
              value: /var/run/passage/payments/{{ .Values.payments.webhookSecretKey }}
            - name: STRIPE_PUBLISHABLE_KEY
              value: {{ .Values.payments.publishableKey | quote }}
            - name: RECEIVABLES_GATEWAY_BANK_REF
              value: {{ .Values.payments.bankAccountRef | quote }}
            {{- if .Values.payments.accounts }}
            - name: RECEIVABLES_STRIPE_ACCOUNTS
              value: {{ .Values.payments.accounts | toJson | quote }}
            {{- end }}
            {{- end }}
          {{- if or .Values.sftpPoll.sources .Values.payments.provider }}
          volumeMounts:
            {{- if .Values.sftpPoll.sources }}
            - { name: sftp-key, mountPath: /var/run/passage/sftp, readOnly: true }
            {{- end }}
            {{- if .Values.payments.provider }}
            - { name: payments, mountPath: /var/run/passage/payments, readOnly: true }
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.sftpPoll.sources .Values.payments.provider }}
      volumes:
        {{- if .Values.sftpPoll.sources }}
        - name: sftp-key
          secret:
            secretName: {{ required "sftpPoll.keySecret names the Secret holding the client private key" .Values.sftpPoll.keySecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.payments.provider }}
        - name: payments
          secret:
            secretName: {{ required "payments.existingSecret names the Secret holding the Stripe secret key and webhook signing secret" .Values.payments.existingSecret }}
            defaultMode: 0440
            items:
              - { key: {{ .Values.payments.secretKeyKey }}, path: {{ .Values.payments.secretKeyKey }} }
              - { key: {{ .Values.payments.webhookSecretKey }}, path: {{ .Values.payments.webhookSecretKey }} }
        {{- end }}
      {{- end }}
