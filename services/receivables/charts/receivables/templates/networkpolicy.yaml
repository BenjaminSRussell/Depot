{{- if and .Values.payments.provider .Values.networkPolicy.enabled }}
{{- if or (empty .Values.networkPolicy.webhookGateway.namespaces) (empty .Values.networkPolicy.webhookGateway.podLabels) }}
{{- fail "networkPolicy.webhookGateway.namespaces and podLabels must be set when payments.provider is set: the webhook port is only admitted to the payment webhook edge's proxies" }}
{{- end }}
# The payment webhook listener takes no Depot token (#30), so its port is reachable only from the payment webhook edge's Envoy
# proxies (Gateway depot-payments-webhook), never from other pods or the depot-api gateway. The API and admin ports are
# covered by the generated default-deny policy (networkpolicy-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-receivables
  labels:
    app.kubernetes.io/name: depot-receivables
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: depot-receivables
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ .Values.payments.webhookPort }} }
      from:
        {{- range .Values.networkPolicy.webhookGateway.namespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.webhookGateway.podLabels | nindent 14 }}
        {{- end }}
{{- end }}
