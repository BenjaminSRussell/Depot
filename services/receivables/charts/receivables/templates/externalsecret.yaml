{{- if and .Values.payments.provider .Values.payments.externalSecret.enabled }}
# The Stripe secret key and webhook signing secret (#30), from the secret store path payments.externalSecret.key, whose
# properties are named like payments.secretKeyKey and payments.webhookSecretKey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "payments.existingSecret is required with payments.externalSecret.enabled" .Values.payments.existingSecret }}
  labels:
    app.kubernetes.io/name: passage-receivables
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.payments.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.payments.externalSecret.storeName }}
  target:
    name: {{ .Values.payments.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ include "passage.secretKey" (dict "root" $ "key" (required "payments.externalSecret.key is required with payments.externalSecret.enabled" .Values.payments.externalSecret.key)) }}
{{- end }}
