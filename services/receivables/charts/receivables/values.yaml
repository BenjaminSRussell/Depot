image:
  repository: ghcr.io/benjaminsrussell/depot-receivables
  tag: "0.1.0"
  # Pin by digest in Argo CD overlays; tag is a dev default only.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080
  # /metrics is served on the admin port, not the API port.
  adminPort: 9090

database:
  # Secret holding DATABASE_URL (depot_app role, no BYPASSRLS).
  secretName: receivables-db
  secretKey: DATABASE_URL

migrations:
  # Dev only; stage and prod run migrations as an Argo PreSync Job.
  migrateOnStart: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# With tenantIds set, every replica runs the RMA credit sweep (RECEIVABLES_RMA_SWEEP_*): it posts PENDING RMA credits the request path
# left behind and commits their billing reservations. reservationTtl (>= 1h, "0" = never) cancels a PENDING credit the ledger
# refused (or never tried) once it is that old, releasing the invoice room billing holds for the abandoned RMA (#557).
rmaSweep:
  tenantIds: []
  interval: 5m
  reservationTtl: 720h

# Where cross-currency settlements read their exchange rates (FX_URL, the fx service; needs the service signing key and the receivables
# public key in the fx service's serviceIdentity.publicKeys). Without it a settlement across currencies answers 503 AR-FX-UNAVAILABLE.
fxUrl: ""

# With tenantIds set, every replica runs the scheduled auto-apply (RECEIVABLES_AUTO_APPLY_*): the matcher's AUTO_APPLY decision on
# the tenants' unapplied payments, so payments with no advice, and items opened later, settle without a clerk. It runs every
# interval, or once a day at `at` (UTC, "02:30") when that is set; set one of the two. A payment is never applied twice.
autoApply:
  tenantIds: []
  interval: 15m
  at: ""

# With sources set, every replica polls the bank inboxes (RECEIVABLES_SFTP_*): each camt.053 file in a source's inbox is imported like
# an upload and moved to its done directory (to failed when it cannot be read). A source is {tenantId, legalEntityId, addr, user,
# hostKeyFingerprint ("SHA256:..." of the bank's host key), inbox, done, failed, autoApply}. The client private key is the
# `keySecretKey` entry of the Secret `keySecret`, mounted read-only. Polls every interval, or daily at `at` (UTC "HH:MM").
sftpPoll:
  sources: []
  keySecret: ""
  keySecretKey: id_ed25519
  interval: 15m
  at: ""

# Card and ACH payments from the customer portal (#30). provider "stripe" turns them on (empty: off; the portal then tells the
# customer to pay by bank transfer). The Stripe secret key and the webhook signing secret come from the Secret `existingSecret`
# (keys secretKeyKey and webhookSecretKey, read through STRIPE_SECRET_KEY_FILE / STRIPE_WEBHOOK_SECRET_FILE from a read-only mount,
# never as plain env values and never logged); the webhook secret may list several signing secrets, comma separated (the platform
# endpoint, the Connect endpoint, or two while one is rolled). With externalSecret.enabled the chart creates that Secret from the
# secret store path externalSecret.key. The publishable key is not a secret. accounts maps a legal entity id to its Stripe Connect
# account (acct_...); empty takes every entity's payments on the platform account. bankAccountRef is the ar_bank_account
# account_ref of the Stripe clearing account the receipts debit (finance maps it, #512). Stripe calls the webhook listener
# (webhookPort, RECEIVABLES_WEBHOOK_ADDR) without a Depot token: route https://<host>/webhooks/v1/stripe to the Service
# <release>-receivables-webhook only, never through depot-api: the edge for that is deploy/gateway/payments-webhook (Gateway
# depot-payments-webhook), and the NetworkPolicy below admits only its Envoy proxies to the webhook port (#213). Register these
# events on the Stripe endpoint: payment_intent.succeeded, .processing, .payment_failed, .canceled, charge.refunded,
# charge.dispute.created, .updated, .closed, .funds_withdrawn and .funds_reinstated.
payments:
  provider: ""
  publishableKey: ""            # pk_test_... / pk_live_...; required when provider is set
  existingSecret: ""            # e.g. receivables-stripe; required when provider is set
  secretKeyKey: STRIPE_SECRET_KEY
  webhookSecretKey: STRIPE_WEBHOOK_SECRET
  externalSecret: { enabled: false, storeName: depot, key: "", refreshInterval: 1h }
  accounts: {}
  bankAccountRef: STRIPE
  webhookPort: 8081

# With payments.provider set, the token-less webhook port is admitted only from the payment webhook edge's Envoy proxies
# (Gateway depot-payments-webhook, deploy/gateway/payments-webhook). The API and admin ports are covered by ingressPolicy below.
networkPolicy:
  enabled: true
  webhookGateway:
    namespaces: [envoy-gateway-system]
    podLabels:
      gateway.envoyproxy.io/owning-gateway-name: depot-payments-webhook
      gateway.envoyproxy.io/owning-gateway-namespace: hello-ledger

serviceMonitor:
  enabled: false
  interval: 30s

# PrometheusRule (#30): ReceivablesGLJournalsParked fires while the journal sweep counts parked journals (the gauge
# receivables_gl_journals_parked, set by the sweep that RECEIVABLES_RMA_SWEEP_TENANT_IDS turns on).
alerts:
  enabled: false
  severity: warning
  parkedFor: 30m
  labels: {}

# The billing consumer (#30, args [consume]): opens the open items of billing's posted
# invoices (one per installment) and credit notes. It exits at start unless
# service:receivables-billing is seeded in the service principal table. Its KafkaUser,
# ACLs and dead-letter topic are deploy/kafka/receivables-consumer.yaml; off by default,
# like the other consumers in dev, until it is turned on per environment (billing's
# outbox connector, which creates depot.billing.invoice, is not deployed yet).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

consumer:
  enabled: false
  replicaCount: 1
  kafka:
    brokers: ""
    group: receivables-billing
    username: receivables-consumer
    dlqTopic: depot.receivables.invoices.dlq
    secret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [depot-receivables, receivables]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: customer-portal
    podNames: [customer-portal]
  - name: depot-migration-factory
    podNames: [depot-migration-factory]
  - name: migration
    podNames: [migration]
  - name: prediction
    podNames: [prediction, prediction-consumer, prediction-sync]
  - name: print
    podNames: [print]
  - name: sales
    podNames: [sales]
  - name: treasury
    podNames: [treasury]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
