openapi: 3.1.0
info:
  title: Depot Receivables API
  version: 1.0.0
  description: |
    Wave 30 receivables context: open items, aging, manual, BAI2 lockbox and camt.053 cash
    application, the collections worklist with risk scores, dunning runs, interest
    notes, promises, disputes, cases, balance confirmations, down payments and the
    deductions workbench. Errors are RFC 9457 problem details with a stable `code`
    (see README). Every operation names its duty in `x-depot-duty`.
servers:
  - url: https://api.{env}.depot.dev
    variables:
      env:
        default: dev
security:
  - bearerAuth: []
paths:
  /v1/receivables/open-items:
    get:
      operationId: listOpenItems
      summary: Open items (FBL5N style)
      x-depot-duty: receivables.view
      parameters:
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: importSource, in: query, description: Only items loaded by this opening-item import source, schema: { type: string } }
        - { name: q, in: query, description: "Only items whose document number contains it, ignoring case.", schema: { type: string, maxLength: 100 } }
        - { name: due_from, in: query, description: Only items due on or after this date, schema: { type: string, format: date } }
        - { name: due_to, in: query, description: Only items due on or before this date, schema: { type: string, format: date } }
        - { name: cursor, in: query, description: The nextCursor of the previous page; the list is ordered by due date, then id, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: One page of open items; nextCursor is present when more follow
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OpenItem" }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/receivables/open-items/{ref}:
    get:
      operationId: getOpenItem
      summary: One open item
      description: |
        Reads one open item in the caller's legal entities, with its version as the ETag. The migration loader reads
        the items it loaded through this route to reconcile a run (service duty `receivables.import.read`, which
        opens nothing else). An unknown id, or one outside the caller's legal entities, is 404 AR-OPEN-ITEM-NOT-FOUND.
      x-depot-duty: receivables.view
      x-depot-duty-alternatives: [receivables.import.read]
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The open item
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenItem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/open-items:
    get:
      operationId: customerPortalOpenItems
      summary: The signed-in customer's own open items (customer portal)
      description: |
        For the customer portal only (#30). The customer is the signed `cus` claim of the customer-portal service token; a
        `customer` query parameter is ignored. The answer is the customer's view: no dunning state, import keys or internal ids.
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: The customer's open items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PortalOpenItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/open-items/{id}:
    get:
      operationId: customerPortalOpenItem
      summary: One of the signed-in customer's open items (customer portal)
      description: An item of another customer is 404 AR-OPEN-ITEM-NOT-FOUND, the same answer as an unknown id.
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The open item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalOpenItem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/payments:
    get:
      operationId: customerPortalPayments
      summary: The signed-in customer's own payments (customer portal)
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: The customer's payments; payments not yet identified with a customer are not listed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PortalPayment" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/statement:
    get:
      operationId: customerPortalStatement
      summary: The signed-in customer's account statement (customer portal)
      description: The customer and the legal entity are the token's; a `customer` or `legalEntityId` parameter is ignored.
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: The statement by currency
          content:
            application/json:
              schema:
                type: object
                required: [asOf, sections]
                properties:
                  asOf: { type: string, format: date }
                  sections: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/prediction-invoices:
    get:
      operationId: listPredictionInvoices
      summary: Customer invoices for payment prediction
      description: |
        The feed of the payment-prediction service (#47), read with a service token holding the one duty `receivables.prediction.read`:
        INVOICE items in the caller's legal entities, `state=reversed` for the invoices reversed after they were scored (so the forecast drops them), `state=paid` for the settled ones (with `paidDate`, the day of their last settlement,
        which the service trains on) or `state=open` for the ones still open (OPEN or PARTIALLY_SETTLED, which it scores). `disputes` counts
        the disputes ever raised on the invoice and `dunningLevel` is its current dunning level. Ordered by `updatedAt`, then id; every change to an
        invoice (a settlement, a dunning step, a dispute) moves `updatedAt`, so a caller that keeps the last `updatedAt` it read passes it as
        `updated_since` and sees every later change. Keyset paging by `cursor`. 503 AR-1590 when the feed is not configured.
      x-depot-duty: receivables.prediction.read
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [open, paid, reversed] } }
        - { name: updated_since, in: query, description: "Only invoices changed at or after this time.", schema: { type: string, format: date-time } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: One page of invoices; nextCursor is present when more follow.
          content:
            application/json:
              schema:
                type: object
                required: [items, asOf]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PredictionInvoice" }
                  nextCursor: { type: string }
                  asOf: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/aging:
    get:
      operationId: agingSnapshot
      summary: Aging snapshot by currency and bucket
      x-depot-duty: receivables.view
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Aging totals
          content:
            application/json:
              schema:
                type: object
                required: [asOf, totals]
                properties:
                  asOf: { type: string, format: date }
                  totals:
                    type: array
                    items: { $ref: "#/components/schemas/AgingTotal" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments:
    get:
      operationId: listPayments
      summary: Payments, newest received first
      x-depot-duty: receivables.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RECEIVED, SUGGESTED, APPLIED, ON_ACCOUNT, REVERSED, ADVISED, CONFIRMED] } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Only payments whose payer name, source reference or amount contains it, ignoring case.", schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPayment
      summary: Record a manual payment (CHECK, ACH, WIRE, CARD, CASH)
      x-depot-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Payment received
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/payment-intents:
    get:
      operationId: customerPortalListPaymentIntents
      summary: The signed-in customer's card and bank account payments from the portal, newest first (customer portal)
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: The customer's portal payments with their status; never a client secret
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PortalIntent" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: customerPortalCreatePaymentIntent
      summary: Start a card or bank account (ACH) payment of the customer's own open items (customer portal)
      description: >
        The customer and the legal entity are the token's. Every item must be the customer's own open
        debit in one currency; the amount on each is above zero, in the currency's minor unit and at
        most what is still open on it less what an ACH payment still processing claims (AR-0019, no
        overpayment; less is a partial payment). ACH is in USD only. Receivables records the attempt,
        asks the payment provider (Stripe) for a PaymentIntent with an Idempotency-Key derived from the
        attempt id, and answers only its client secret and publishable key for the provider's hosted
        Payment Element: card and bank details never reach Depot. The status changes only on the
        provider's signature-verified webhook. The same Idempotency-Key and body answers the same
        payment (and client secret).
      x-depot-duty: receivables.customer-portal.pay
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalIntentRequest" }
      responses:
        "200":
          description: A replay of the same payment; the client secret is set while the payment still needs the customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIntent" }
        "201":
          description: The payment, with the client secret and publishable key of the provider's hosted element
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIntent" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/payment-intents/{id}:
    get:
      operationId: customerPortalGetPaymentIntent
      summary: One of the customer's portal payments with its status (customer portal)
      x-depot-duty: receivables.customer-portal.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The payment; another customer's reads as not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIntent" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/customer-portal/payment-intents/{id}:cancel:
    post:
      operationId: customerPortalCancelPaymentIntent
      summary: Cancel a portal payment the customer abandoned before paying (customer portal)
      description: >
        The customer went back to change the amounts. Receivables cancels the Stripe PaymentIntent
        (Idempotency-Key per attempt) and marks the attempt FAILED with code canceled, so it stops
        reserving what it would have paid. Only the customer's own attempt still waiting for the
        customer can be cancelled; one under way or paid is 409 AR-GATEWAY-STATE, another
        customer's reads as not found. A cancelled one answers as it is.
      x-depot-duty: receivables.customer-portal.pay
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The attempt, cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalIntent" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gateway-payments:
    get:
      operationId: listGatewayPayments
      summary: Card and ACH payments customers made in the portal, newest first
      x-depot-duty: receivables.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [REQUIRES_PAYMENT, PROCESSING, SUCCEEDED, FAILED, REFUNDED, DISPUTED] } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: payment, in: query, description: The receivables payment a succeeded one became, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        "200":
          description: The gateway payments with their items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GatewayPayment" }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gateway-payments/{id}:
    get:
      operationId: getGatewayPayment
      summary: One gateway payment with its items and the provider webhook events handled for it
      x-depot-duty: receivables.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The gateway payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayPayment" }
        "404": { $ref: "#/components/responses/Problem" }
  /webhooks/v1/stripe:
    servers:
      - url: https://payments-webhook.{env}.depot.dev
        description: The payment webhook listener (RECEIVABLES_WEBHOOK_ADDR), reached by Stripe without a Depot token
        variables:
          env: { default: dev }
    post:
      operationId: stripeWebhook
      summary: Receive a Stripe webhook event for a portal payment
      description: >
        Called by Stripe, not by Depot users: there is no JWT and X-Depot-* headers are ignored. The
        Stripe-Signature header (HMAC-SHA256 over the timestamp and the raw body with the endpoint's
        signing secret) is verified before anything is parsed and its timestamp must be within 5 minutes.
        The PaymentIntent selects the attempt (tenant and legal entity come from it); the event id makes a
        redelivery or a replay a no-op; events of one attempt are handled one at a time (a second one
        gets 409 and is redelivered) and an older processing or failure than the last event applied is
        ignored. Handled - payment_intent.succeeded (records a PORTAL payment and applies it to the chosen
        items), payment_intent.processing (ACH on its way), payment_intent.payment_failed,
        payment_intent.canceled, charge.refunded (a full refund reverses the payment through unapply and
        receipt reversal), charge.dispute.funds_withdrawn and charge.dispute.created with a status that is
        not warning_* (a chargeback or an ACH return; reversed like a refund), charge.dispute.created,
        updated or closed with a warning_* status (an inquiry; flagged for review, nothing reversed) and
        charge.dispute.funds_reinstated (flagged for review). A partial refund or dispute is flagged for
        review. Other events, PaymentIntents Depot did not create and charges without a PaymentIntent
        are acknowledged and ignored.
      security: []
      x-depot-duty: none (Stripe authenticated by the Stripe-Signature HMAC)
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Stripe event object }
      responses:
        "200":
          description: Handled, a duplicate, or ignored; the body names the outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: The signature does not verify, is older than 5 minutes, or the event is unreadable
        "404":
          description: Card payments are not set up on this deployment
        "409":
          description: Another event of the same payment is being handled; Stripe redelivers
        "500":
          description: A transient failure; Stripe redelivers and every step is idempotent
        "503":
          description: The attempt lookup is unavailable; Stripe redelivers
  /v1/receivables/payments/{id}:
    get:
      operationId: getPayment
      summary: Read a payment
      x-depot-duty: receivables.view
      x-depot-tool: depot.ar.payment.get
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Payment
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:match:
    post:
      operationId: matchPayment
      summary: Score candidate settlements for a payment (BR-30.1); changes no state
      x-depot-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Decision and ranked candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResult" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:apply:
    post:
      operationId: applyPayment
      summary: Apply a payment to open items; requires If-Match
      description: |
        Settlements plus `onAccount` must equal the unapplied amount (AR-0001).
        Items must be in the payment's legal entity and currency and belong to
        the payment's customer; an unidentified payment takes the customer of
        its items. A cash discount needs the value date on or before the
        discount date and may not exceed the item's discount; write-offs above
        tolerance are 422 AR-0006; a locked item is 409 AR-0002. A repeated
        Idempotency-Key with the same body replays the first response.
      x-depot-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/OptionalIdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyRequest" }
      responses:
        "200":
          description: Payment applied
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:reverse:
    post:
      operationId: reversePayment
      summary: Reverse the cash receipt of a payment that was never applied; requires If-Match
      description: |
        The payment becomes REVERSED and the ledger is owed the mirror image of the receipt's own journal, so the credit goes back
        to the bank account the receipt was booked to even if the bank account mapping changed since. A payment with an
        application is refused with 409 AR-PAYMENT-STATE.
      x-depot-duty: receivables.payment.reverse
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: Payment reversed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:unapply:
    post:
      operationId: unapplyPayment
      summary: Reverse every application of a payment; requires If-Match
      description: |
        #30. Each live settlement of the payment gets a reversal settlement with its amounts negated, each item gets back what the
        settlement took off it (in the item's currency for a cross-currency settlement) and the cash is unapplied again (status
        RECEIVED). The ledger is owed the mirror of the applications (Dr 1200 / Cr 1205, 4100 and 6100, payment currency) and of
        their realized exchange differences (functional currency). Statements and balance confirmations dated before the
        reversal still show the items settled. A payment with no application to reverse is 409 AR-PAYMENT-STATE. Publishes
        dev.depot.receivables.payment.unapplied.v1. The cash receipt stays; `:reverse` undoes it afterwards.
      x-depot-duty: receivables.payment.reverse
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
                settlementId:
                  type: string
                  format: uuid
                  description: |
                    Reverse only this settlement of the payment (an id from `GET /payments/{id}/settlements`); its item is reopened
                    by what it took off, its journals are mirrored alone, and the payment's other applications stand (status
                    ON_ACCOUNT, RECEIVED once none stands). A settlement of another payment is 404 AR-SETTLEMENT-NOT-FOUND, one
                    already reversed 409 AR-PAYMENT-STATE.
      responses:
        "200":
          description: Applications reversed
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [payment, reversed]
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
                  reversed:
                    type: array
                    items:
                      type: object
                      properties:
                        settlementId: { type: string, format: uuid }
                        openItemId: { type: string, format: uuid }
                        amount: { $ref: "#/components/schemas/Money" }
                        itemAmount: { $ref: "#/components/schemas/Money" }
                        openAfter: { $ref: "#/components/schemas/Money" }
                        itemStatus: { type: string, enum: [OPEN, PARTIALLY_SETTLED] }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}:reverse-application:
    post:
      operationId: reversePaymentApplication
      summary: Reverse one application of a payment by a compensating reversal; requires If-Match and Idempotency-Key
      description: |
        DEPOT-300. `applicationId` is the id `:apply` returned. Nothing is deleted: the application is marked REVERSED with actor, time
        and reason, its settlements get negated reversal rows, its items are open again by what it took off them, the payment's
        unapplied amount is restored and its status recomputed (RECEIVED, ON_ACCOUNT or APPLIED, never REVERSED), and the ledger gets
        the mirror of the application journal (Dr 1200 / Cr 1205, 4100 and 6100) through ledger.Post under the key
        `post:receivables:paymentapplication:<applicationId>:reversal:<generation>` (each attempt is recorded and committed before its first ledger post; a retry reuses the open attempt's keys, and the generation moves on only once the failed attempt is COMPENSATED), in the posting date of the original application. Publishes
        dev.depot.receivables.payment.applicationreversed.v1 in the same transaction. A locked item is 409 AR-0002, an unknown payment
        or application 404 AR-PAYMENT-NOT-FOUND, an application already reversed or a payment not in an applied state 409
        AR-PAYMENT-STATE, a bank-reconciled payment (or one whose state cannot be read) 409 AR-0021, a closed posting period 409
        AR-0023 (never re-dated), an item dunned, cleared, settled by another payment or whose payment has a later application since the
        application was made 409 AR-0024 (`errors` maps each openItemId to DUNNED, CLEARED, FURTHER_SETTLED or LATER_APPLICATION). A ledger
        refusal or outage, or an application journal not posted to the ledger yet, is 503 AR-0022 with nothing stored; repeat with the same
        Idempotency-Key. A repeat while the sweeper is compensating an earlier attempt is 503 AR-0022 as well, until that attempt is resolved. With `dryRun: true` the same guards run through one shared function, nothing changes, If-Match and Idempotency-Key
        are not needed, and the answer is 200 `{ eligible, code?, reason?, items? }` carrying the code the real call would return (a closed
        period and a ledger outage are not detected by dryRun, which answers eligible for them; the real call refuses with 409 AR-0023
        or 503 AR-0022. A locked item is 409 AR-0002 on the real call and 200 `{ eligible: false, code: AR-0002 }` on dryRun).
        The same key and body replays the first response, the same key with another body is 422 idempotency_key_reuse.
      x-depot-duty: receivables.payment.post
      x-passage-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [applicationId, reason]
              properties:
                applicationId: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500, description: Stored on the application for audit. }
                dryRun: { type: boolean, default: false, description: Run the guards only; changes nothing and needs no If-Match or Idempotency-Key. }
      responses:
        "200":
          description: Application reversed, or (dryRun) the eligibility answer
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [applicationId, reversalJournalEntryId, payment, reopened]
                    properties:
                      applicationId: { type: string, format: uuid }
                      reversalJournalEntryId: { type: string }
                      payment: { $ref: "#/components/schemas/Payment" }
                      reopened:
                        type: array
                        items:
                          type: object
                          properties:
                            settlementId: { type: string, format: uuid }
                            openItemId: { type: string, format: uuid }
                            amount: { $ref: "#/components/schemas/Money" }
                            itemAmount: { $ref: "#/components/schemas/Money" }
                            openAfter: { $ref: "#/components/schemas/Money" }
                            itemStatus: { type: string, enum: [OPEN, PARTIALLY_SETTLED] }
                  - type: object
                    required: [eligible]
                    properties:
                      eligible: { type: boolean }
                      code: { type: string }
                      reason: { type: string }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            openItemId: { type: string, format: uuid }
                            cause: { type: string, enum: [DUNNED, CLEARED, FURTHER_SETTLED, LATER_APPLICATION] }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/open-items:batch:
    post:
      operationId: importOpeningItems
      summary: Load a cutover snapshot of open items from a legacy system (migration loader)
      description: |
        Called by the ERP migration loader at cutover (integration handoff H5). One batch carries up to 1000
        open items of one legal entity from one legacy system (`importSource`). Each row is keyed by
        (`importSource`, `legacyKey`), so the call is re-runnable: a new key creates the item, a known key
        whose item is untouched in Depot updates it to the snapshot (open amount, dates, document number;
        an identical row stores nothing and is reported UNCHANGED), and a known key whose item was settled,
        partly settled, cleared or deducted in Depot (ever, even if later reversed) is refused with
        AR-OPENING-SETTLED, because the snapshot no longer describes it; one with an active dispute or a
        promise to pay that still holds is refused with AR-OPENING-IN-COLLECTION. A known key cannot move to
        another legal entity, customer, currency, kind or side (AR-OPENING-IDENTITY, also when the key was
        loaded into a legal entity outside the caller's scope). The legacy open amount may be below the
        original amount (a partial payment made in the legacy system).

        Amounts are magnitudes; `side` gives the sign. INVOICE is a DEBIT; CREDIT_NOTE and PAYMENT (an
        unapplied payment) are CREDIT; ADJUSTMENT may be either. Credit-side items are stored with negative
        amounts, so balances, aging, statements, the worklist and the balance snapshot net them against
        debits; they are not matched, dunned, or settled against debits yet.

        Results are per row, in request order. With `atomic=false` (default) a refused row never blocks the
        others and the call answers 200 (201 when every row was created); with `atomic=true` one refused row
        refuses the batch: 422, nothing stored, every row reported. One `openitem.imported.v1` is written
        to the outbox in the same transaction when anything was created or updated. The caller must hold the
        service duty `receivables.import.write` and the legal entity must be inside its scope.
      x-depot-duty: receivables.import.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpeningImportRequest" }
      responses:
        "200":
          description: Batch processed; refused rows are listed with their code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
        "201":
          description: Every row was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: Atomic batch refused; nothing was stored and every row is reported (`committed` false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpeningImportResult" }
  /v1/receivables/open-item-imports:
    get:
      operationId: listOpeningImports
      summary: What each import source loaded, per legal entity and currency
      description: Totals of the imported items still in Depot, for the reconciliation against the legacy ledger at cutover.
      x-depot-duty: receivables.view
