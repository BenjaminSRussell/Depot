              schema: { $ref: "#/components/schemas/DownPayment" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/down-payments/{id}:
    get:
      operationId: getDownPayment
      summary: Read one down payment or deposit with its clearings
      x-depot-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/DownPaymentId" }
      responses:
        "200":
          description: Down payment
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownPayment" }
