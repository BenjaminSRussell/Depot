      summary: >-
        Select customers by their balance as of the key date (|balance| at least the threshold; zero balances
        only with includeZeroBalances; optionally a sample of n seeded by the Idempotency-Key) and record one
        NO_REPLY confirmation per customer and currency (BR-30.13)
