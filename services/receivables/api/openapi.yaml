      summary: >-
        Record a customer's reply. Replies are immutable: repeating the recorded reply returns it, any other
        reply is 409 AR-CONFIRMATION-REPLIED. DISAGREED opens a DISPUTE case carrying the customer's balance.
      x-depot-duty: receivables.balance-confirmation.run
