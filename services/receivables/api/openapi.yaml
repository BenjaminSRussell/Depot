        shortPayReason: { type: [string, "null"], minLength: 1, maxLength: 120, description: explains a short payment (R7) }
        bankAccount: { type: [string, "null"], maxLength: 64, description: "The bank account the money came to (its IBAN or other id); the legal entity's mapping of it picks the ledger account of the cash." }
        remittance:
          type: array
          items: { $ref: "#/components/schemas/RemittanceLine" }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: [string, "null"], format: uuid }
        paymentMode: { type: string }
        source: { type: string }
        sourceRef: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        unappliedAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        receivedDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        payerName: { type: [string, "null"] }
        payerAccountHash: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the payer's normalized account (R4); absent when none was given" }
        shortPayReason: { type: string, description: absent when none was given (R7) }
        bankAccountRef: { type: string, description: "The bank account the money came to, normalized; absent when unknown" }
        remittance:
          type: array
          items: { $ref: "#/components/schemas/RemittanceLine" }
        status: { type: string, enum: [RECEIVED, SUGGESTED, APPLIED, ON_ACCOUNT, REVERSED, ADVISED, CONFIRMED] }
        version: { type: integer }
    PortalOpenItem:
