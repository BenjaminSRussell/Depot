  /v1/receivables/rma-credits:
    post:
      operationId: postRMACredit
      summary: Post an RMA credit note (AC-30.5)
      description: |
        Sales calls this, with a service token, after a return order is dispositioned. The customer
        and currency come from the original invoice's open item and the ledger from the legal
        entity's configured ledger (`RECEIVABLES_RMA_LEDGERS`); none is taken from the body. The
        return value (gross) is refused (422 AR-RMA-INVOICE) above the invoice amount less the gross
        of earlier RMA credits on it; the open amount does not bound it, so a paid or settled invoice
        is still returnable and its credit leaves the customer a credit balance. The credit is
        recorded PENDING, then Dr 4000 gross / Cr 4200 restocking / Cr 1200 net is posted under the
        journal key `rma-credit:{legalEntityId}:{document}`, and the CREDIT_NOTE open item (negative
        net, `CN-{rmaNumber}`) is created in the transaction that marks the credit POSTED. A ledger
        outage backs off (503 AR-RMA-GL) and the sweeper or a repeat posts it later; a ledger refusal
        parks the credit (409 AR-RMA-PARKED) until an operator retries it. A repeat of the same RMA
        returns the stored values; a repeat with other amounts is 422 idempotency_key_reuse.

        When billing is configured (`BILLING_URL`) the credit first reserves `invoiceLines` in billing
        (duty `billing.credit-reservation.write`, `Idempotency-Key` `rma-credit:{legalEntityId}:{rmaId}`),
        before anything is stored. Billing refusing the room is 422 AR-RMA-INVOICE and nothing is
        stored; billing unavailable is 503 AR-RMA-GL and nothing is stored or posted, so the repeat is safe.
        Once the credit is POSTED the reservation is committed; if that call fails the credit stays
        POSTED (the response is still 201) and a repeat or the sweep commits it later. A credit
        that is parked or refused after reserving releases the reservation; `:retry` reserves again with the same
        key and is refused 422 AR-RMA-INVOICE when the room is gone.
        Any other billing rejection (400, 422 such as idempotency_key_reuse) is 422 AR-RMA-INVOICE with
        a plain message; the reservation must cover the return value. A POSTED credit whose reservation
        billing cannot restore is flagged needsAttention for an operator.
      x-depot-duty: ar.rmacredit.post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RMACreditRequest" }
      responses:
        "201":
          description: Credit note posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditNote" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listRMACredits
      summary: List RMA credits, newest first (PENDING and parked ones for the operator)
      x-depot-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, POSTED] } }
        - { name: parked, in: query, description: true lists only credits the ledger refused, schema: { type: boolean } }
        - { name: needsAttention, in: query, description: true lists only POSTED credits whose billing reservation was lost, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: RMA credits
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RMACreditView" } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits:sweep:
    post:
      operationId: sweepRMACredits
      summary: Post the caller's due PENDING RMA credits
      description: |
        The scheduler's entry point; the in-process sweeper (`RECEIVABLES_RMA_SWEEP_TENANT_IDS`,
        every `RECEIVABLES_RMA_SWEEP_INTERVAL`, default 5m) runs the same pass per tenant and legal
        entity. Posts, oldest first and at most 200 (or `limit`), the unparked PENDING credits whose
        backoff ran out and that are older than 2 minutes. A failure is recorded on the credit
        (backoff, or park on a ledger refusal) and the pass goes on.
      x-depot-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                required: [posted, failed, parked]
                properties:
                  posted: { type: integer }
                  failed: { type: integer }
                  parked: { type: integer }
                  committed: { type: integer, description: Posted credits whose billing reservation the sweep committed }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/remittance-advices:
    post:
      operationId: importRemittanceAdvice
      summary: Attach a payer's remittance advice (CSV, JSON or EDI 820) to the payments it describes (FR-30.4)
      description: |
        Each advice line names a payment by its reference (`paymentRef`, matched to the payment's source reference; a
        bank statement payment's reference is `<statement>:<entry>`, so the entry reference alone finds it) and the
        invoices it pays. CSV has a header naming `paymentRef`, `reference` and `amount`, one row per invoice. JSON is
        `{"lines":[{"paymentRef","references":[{"reference","amount"}]}]}`. EDI820 reads an X12 820: each TRN segment
        starts a payment (TRN02) and each RMR segment names an invoice (RMR02) and the amount paid (RMR04). The advice
        replaces the payment's remittance, so a repeat changes nothing; a payment already applied, an unknown or shared
        reference, and references that total more than the payment are reported per line and skipped. With `autoApply`
        the payments that got an advice are then matched and applied like an import's. 400 AR-ADVICE-MALFORMED names the
        row, element or segment. With `createMissing`, a line that names no payment records one in status ADVISED (the
        advice came before the bank credit): it books no cash, cannot be matched or applied and is on no statement until
        a bank payment (statement entry, lockbox check or manual payment) with the same reference, currency and amount
        arrives; that payment takes the advice's references and the advised one becomes CONFIRMED.
      x-depot-duty: receivables.payment.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId, format, content]
              properties:
                legalEntityId: { type: string, format: uuid }
                format: { type: string, enum: [CSV, JSON, EDI820] }
                content: { type: string, minLength: 1, maxLength: 3145728 }
                autoApply: { type: boolean }
                createMissing: { type: boolean, description: "Record an ADVISED payment for each line that names no payment. Needs currency." }
                currency: { type: string, pattern: "^[A-Z]{3}$", description: "Currency of the advised payments; required with createMissing." }
                valueDate: { type: string, format: date, description: "Value date of the advised payments; defaults to today." }
                paymentMode: { type: string, enum: [CHECK, ACH, WIRE, CARD, CASH], description: "Defaults to WIRE." }
      responses:
        "200":
          description: Advice processed
          content:
            application/json:
              schema:
                type: object
                required: [lines, attached, created, skipped]
                properties:
                  attached: { type: integer }
                  created: { type: integer, description: "Payments recorded as ADVISED (createMissing)." }
                  skipped: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [paymentRef, outcome]
                      properties:
                        paymentRef: { type: string }
                        outcome: { type: string, enum: [ATTACHED, UNMATCHED, AMBIGUOUS, ALREADY_APPLIED, INVALID, ADVISED] }
                        paymentId: { type: string, format: uuid }
                        detail: { type: string }
                  autoApply: { $ref: "#/components/schemas/AutoApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/payments/{id}/settlements:
    get:
      operationId: listPaymentSettlements
      summary: The applications of a payment
      description: |
        #30. Every settlement the payment made, oldest first, with its id, the item, the amounts, the realized exchange difference
        of a cross-currency one and whether it was reversed since. `reversed: false` ones can be unapplied one by one.
      x-depot-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: The settlements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, openItemId, documentNumber, amount, cashDiscount, writeOff, settledAt, reversed]
                      properties:
                        id: { type: string, format: uuid }
                        openItemId: { type: string, format: uuid }
                        documentNumber: { type: string }
                        amount: { $ref: "#/components/schemas/Money" }
                        cashDiscount: { $ref: "#/components/schemas/Money" }
                        writeOff: { $ref: "#/components/schemas/Money" }
                        itemCurrency: { type: string }
                        itemAmount: { $ref: "#/components/schemas/Money" }
                        realizedFx: { $ref: "#/components/schemas/Money" }
                        settledAt: { type: string, format: date-time }
                        reversed: { type: boolean }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/credit-settlements/{id}:reverse:
    post:
      operationId: reverseCreditSettlement
      summary: Reverse a credit settlement (every row of the batch)
      description: |
        #30. Undoes what `POST /credit-settlements` did for one `batchId`: each debit is open again by what the settlement took off it
        (in its own currency for a cross-currency settlement), the credit holds what it had (status OPEN again when it was
        used up by this settlement alone), and each row gets a reversal row with its amounts negated, so statements and
        balance confirmations dated before the reversal still show the items settled. A cross-currency settlement's realized
        exchange difference is reversed with it as its own functional-currency journal (a gain: Dr the gain account / Cr 1200,
        a loss: Dr 1200 / Cr the loss account); a same-currency one posted nothing and reverses nothing in the ledger. A settlement
        already reversed is 409 AR-CREDIT-SETTLEMENT-REVERSED, an unknown batch 404 AR-CREDIT-SETTLEMENT-NOT-FOUND. Publishes
        dev.depot.receivables.creditsettlement.reversed.v1.
      x-depot-duty: receivables.payment.reverse
      parameters:
        - name: id
          in: path
          required: true
          description: The batchId of the credit settlement.
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Reversed
          content:
            application/json:
              schema:
                type: object
                required: [batchId, reversalBatchId, creditItemId, creditOpenAfter, creditStatus, total, realizedFx, reopened]
                properties:
                  batchId: { type: string, format: uuid }
                  reversalBatchId: { type: string, format: uuid }
                  creditItemId: { type: string, format: uuid }
                  creditOpenAfter: { $ref: "#/components/schemas/Money" }
                  creditStatus: { type: string, enum: [OPEN, PARTIALLY_SETTLED, SETTLED] }
                  total: { $ref: "#/components/schemas/Money" }
                  realizedFx: { $ref: "#/components/schemas/Money", description: "The realized difference reversed, functional currency, positive a gain." }
                  reopened:
                    type: array
                    items:
                      type: object
                      required: [openItemId, documentNumber, amount, openAfter, itemStatus]
                      properties:
                        openItemId: { type: string, format: uuid }
                        documentNumber: { type: string }
                        amount: { $ref: "#/components/schemas/Money" }
                        openAfter: { $ref: "#/components/schemas/Money" }
                        itemStatus: { type: string }
                        itemCurrency: { type: string }
                        itemAmount: { $ref: "#/components/schemas/Money" }
                        realizedFx: { $ref: "#/components/schemas/Money" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/receivables/credit-settlements:
    get:
      operationId: listCreditSettlements
      summary: Credit settlements with their debits
      description: |
        #30. The settlements `POST /credit-settlements` made, newest first, filtered by `customerId`, `creditItemId` or `openItemId`
        (the credit or a debit), each with whether it was reversed, so a clerk can find the `batchId` to reverse.
      x-depot-duty: receivables.view
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: creditItemId, in: query, schema: { type: string, format: uuid } }
        - { name: openItemId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The settlements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [batchId, legalEntityId, customerId, currency, creditItemId, creditDocument, total, settledAt, reversed, debits]
                      properties:
                        batchId: { type: string, format: uuid }
                        legalEntityId: { type: string, format: uuid }
                        customerId: { type: string, format: uuid }
                        currency: { type: string }
                        creditItemId: { type: string, format: uuid }
                        creditDocument: { type: string }
                        total: { $ref: "#/components/schemas/Money" }
                        settledAt: { type: string, format: date-time }
                        reversed: { type: boolean }
                        debits:
                          type: array
                          items:
                            type: object
                            properties:
                              openItemId: { type: string, format: uuid }
                              documentNumber: { type: string }
                              amount: { $ref: "#/components/schemas/Money" }
                              itemCurrency: { type: string }
                              itemAmount: { $ref: "#/components/schemas/Money" }
                              realizedFx: { $ref: "#/components/schemas/Money" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: settleCredit
      summary: Settle a credit item against debit items (30-3)
      description: |
        Offsets one credit item (a credit note, an adjustment or an unapplied payment item, negative amount) against open
        debit items of the same customer, legal entity and currency, in one transaction. Name the `debits` and the amount
        of each, or set `againstOriginal` to settle a credit note against the open items of the invoice it credits, the
        oldest due date and installment first, up to what the credit holds. Each debit is reduced by its amount and the
        credit by the total, which may not exceed the credit's open amount (422 AR-SETTLE-INVALID); an item reaching zero
        is SETTLED. Nothing is posted to the ledger: both sides are in 1200. Items are locked while the settlement runs
        (409 AR-0002 if another user holds one). A repeat with the same `Idempotency-Key` and body replays the answer.
        Applying a payment to a credit item stays refused (AR-CREDIT-ITEM); this is the operation for credits.

        Across currencies (the entity's fx-settings enable it): a debit in another currency than the credit takes `amount` off
        the credit (its currency) and `itemAmount` off the debit (its currency). Without `itemAmount` it is priced at what
        `amount` is worth in the debit's currency on the settlement date; a given one must be within the entity's FX tolerance
        of that worth (422 AR-FX-TOLERANCE). The credit at its document-date rate against the debit at its document-date rate
        gives the realized difference, booked as its own functional-currency journal (gain Dr 1200 / Cr the gain account, loss
        Dr the loss account / Cr 1200).
      x-depot-duty: receivables.payment.settle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalEntityId, creditItemId]
              additionalProperties: false
              properties:
                legalEntityId: { type: string, format: uuid }
                creditItemId: { type: string, format: uuid }
                againstOriginal: { type: boolean }
                debits:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [openItemId, amount]
                    additionalProperties: false
                    properties:
                      openItemId: { type: string, format: uuid }
                      amount: { $ref: "#/components/schemas/Money" }
                      itemAmount: { $ref: "#/components/schemas/Money", description: "For a debit in another currency: what comes off it in its currency; priced when left out." }
      responses:
        "200":
          description: Settled (or replayed)
          content:
            application/json:
              schema:
                type: object
                required: [batchId, creditItemId, creditOpenAfter, creditStatus, total, settlements]
                properties:
                  batchId: { type: string, format: uuid }
                  creditItemId: { type: string, format: uuid }
                  creditOpenAfter: { $ref: "#/components/schemas/Money" }
                  creditStatus: { type: string, enum: [PARTIALLY_SETTLED, SETTLED] }
                  total: { $ref: "#/components/schemas/Money" }
                  settlements:
                    type: array
                    items:
                      type: object
                      required: [openItemId, documentNumber, amount, openAfter, itemStatus]
                      properties:
                        openItemId: { type: string, format: uuid }
                        documentNumber: { type: string }
                        amount: { $ref: "#/components/schemas/Money" }
                        openAfter: { $ref: "#/components/schemas/Money" }
                        itemStatus: { type: string, enum: [PARTIALLY_SETTLED, SETTLED] }
                        itemCurrency: { type: string, description: Set for a cross-currency settlement. }
                        itemAmount: { $ref: "#/components/schemas/Money" }
                        realizedFx: { $ref: "#/components/schemas/Money", description: "Realized exchange difference in the functional currency, positive for a gain." }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/receivables/fx-settings:
    get:
      operationId: getFXSetting
      summary: The realized-FX profile of a legal entity (the default when none is stored)
      x-depot-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FXSetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putFXSetting
      summary: Set whether a legal entity settles across currencies, its functional currency and the realized gain and loss accounts
      description: |
        A settlement of an item in another currency than the payment needs `crossCurrencyEnabled`. Its realized exchange difference
        is booked as its own single-currency journal in the functional currency, at the spot rates of the fx service on the payment's
        value date and on the item's document date, to the gain account (default 7100) or the loss account (default 7200).
      x-depot-duty: receivables.fxsetting.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FXSetting" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FXSetting" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/bank-accounts:
    get:
      operationId: listBankAccounts
      summary: List the legal entity's bank account mappings (30-2)
      description: |
        Each mapping names the ledger account the cash of one bank account is booked to, by currency and the
        statement's own account id (a camt.053 Stmt/Acct/Id, upper case without spaces). A mapping with an empty
        `accountRef` is the entity's default account for the currency. Receipts and down payments with no mapping
        book 1000.
      x-depot-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putBankAccount
      summary: Create or replace a bank account mapping
      x-depot-duty: receivables.bankaccount.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccount" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBankAccount
      summary: Remove a bank account mapping; its cash books to 1000 again
      x-depot-duty: receivables.bankaccount.manage
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: accountRef, in: query, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals:
    get:
      operationId: listGLJournals
      summary: List the journals receivables owes or has posted to the ledger
      description: |
        Cash receipts (Dr 1000 / Cr 1205), payment applications (Dr 1205, Dr 4100 discount, Dr 6100 write-off /
        Cr 1200), dunning fees (Cr 4300), interest (Cr 4310), down payment and deposit moves and deduction
        write-offs. A journal is stored in the transaction of the change that causes it and posted by a worker.
      x-depot-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, POSTED] } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: parked, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Journals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GLJournalView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals:backfill:
    post:
      operationId: backfillGLJournals
      summary: Queue the journals owed for payments recorded before the ledger journals existed, and for opening-item imports
      description: |
        For each payment of the legal entity with no cash receipt journal (ADVISED and CONFIRMED payments book no cash), queues
        Dr bank / Cr 1205, and, for such a payment applied before the journals existed, one journal for its applications
        (Dr 1205, Dr 4100, Dr 6100 / Cr 1200). A payment that already has an application journal is left to them. At
        most 1000 payments a call; `more` says to call again. With `openingAccount` and `openingDate` (both or neither) it
        also queues one journal per opening-item import source and currency for the open amount the import set: Dr 1200
        against the opening account (the other way for a net credit). Use that only when the ledger's own opening balance does
        not already carry the receivable. Every journal has its own key, so a repeat queues nothing twice; the sweeper
        posts them. Dunning fees, interest, down payments and deductions are not backfilled.
      x-depot-duty: receivables.payment.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalEntityId]
              properties:
                legalEntityId: { type: string, format: uuid }
                openingAccount: { type: string, maxLength: 20 }
                openingDate: { type: string, format: date }
      responses:
        "200":
          description: What was queued
          content:
            application/json:
              schema:
                type: object
                required: [receipts, applications, openingItems, openingAlreadyQueued, more]
                properties:
                  receipts: { type: integer }
                  applications: { type: integer }
                  openingItems: { type: integer }
                  openingAlreadyQueued: { type: integer }
                  dunningFees: { type: integer }
                  interest: { type: integer }
                  downPayments: { type: integer }
                  deductions: { type: integer }
                  more: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals:sweep:
    post:
      operationId: sweepGLJournals
      summary: Post the caller's due journals to the ledger
      description: |
        The scheduler's entry point; the in-process sweeper (`RECEIVABLES_RMA_SWEEP_TENANT_IDS`) runs the
        same pass per tenant and legal entity. Posts, oldest first and at most 200 (or `limit`), the unparked
        journals whose backoff ran out, under the key `gl-journal:{legalEntityId}:{journalId}`. A failure is
        recorded on the journal (backoff, or park on a ledger refusal) and the pass goes on. The ledger is the
        one pinned per legal entity in `RECEIVABLES_GL_LEDGERS`, else `RECEIVABLES_RMA_LEDGERS`.
      x-depot-duty: receivables.payment.post
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                required: [posted, failed, parked]
                properties:
                  posted: { type: integer }
                  failed: { type: integer }
                  parked: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-journals/{id}:retry:
    post:
      operationId: retryGLJournal
      summary: Unpark, optionally re-date, and post a journal now
      description: |
        For a journal that is not POSTED: clears the park and the backoff, optionally re-dates it (a ledger
        refusal such as a closed period) and posts it now. A POSTED journal is 409 AR-JOURNAL-STATE.
      x-depot-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date }
      responses:
        "200":
          description: Journal after the attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GLJournalView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/gl-reconciliation:
    get:
      operationId: getGLReconciliation
      summary: Compare the open items and unapplied payments with GL 1200 and 1205
      description: |
        Reads the ledger's balances of 1200 and 1205 up to `asOf` and compares them with the open amounts of
        the legal entity's open items and the unapplied amounts of its payments in one currency.
        `reconciled` needs both differences at zero and no journal pending or parked. Items loaded by the
        opening-item import have no journal here, so they show in the difference until the ledger's opening
        balance is loaded.
      x-depot-duty: receivables.view
      parameters:
        - { name: legalEntityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GLReconciliation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:retry:
    post:
      operationId: retryRMACredit
      summary: Unpark, optionally re-date, and post an RMA credit now
      description: |
        For a credit that is not POSTED: clears the park and the backoff and posts the journal now.
        `postingDate` re-dates a parked credit (one the ledger refused, for example for a closed
        period); re-dating a credit that is only waiting for the ledger is 409 AR-RMA-STATE. The
        ledger key stays the same, so an entry the ledger already holds under it answers an
        idempotency conflict and parks the credit again rather than posting twice. A POSTED credit
        is 409 AR-RMA-STATE.
      x-depot-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                postingDate: { type: string, format: date }
      responses:
        "200":
          description: Credit posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:cancel:
    post:
      operationId: cancelRMACredit
      summary: Cancel a PENDING RMA credit and release its invoice room
      description: |
        Drops a credit that was never posted, releases the room billing holds for it (reservations do
        not expire on their own) and frees its RMA to be credited again, for example with corrected
        amounts. Only a parked credit (the ledger refused it) or one never tried can be cancelled; a
        credit whose last ledger answer was lost may be booked, so it is 409 AR-RMA-STATE and is
        retried instead. A POSTED credit is 409 AR-RMA-STATE: reverse it with a billing credit note.
        The answer shows the credit with status CANCELLED.
      x-depot-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Credit cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits:backfill-reservation:
    post:
      operationId: backfillRMAReservationForRMA
      summary: Backfill the reservation of the credit of one RMA (the service call sales drives)
      description: |
        The same as backfilling by credit id, but the credit is found by `legalEntityId` and `rmaId`, so
        sales can work through the RMAs it credited before billing reservations existed. A credit that
        already holds a reservation is 409 AR-RMA-STATE, which the caller treats as done. The caller
        needs a token for the legal entity and the service duty ar.rmacredit.backfill.
      x-depot-duty: ar.rmacredit.backfill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rmaId, legalEntityId, invoiceId, invoiceLines]
              properties:
                rmaId: { type: string, format: uuid }
                legalEntityId: { type: string, format: uuid }
                invoiceId: { type: string, format: uuid }
                invoiceLines:
                  type: array
                  items:
                    type: object
                    required: [lineNo, qty]
                    properties:
                      lineNo: { type: integer, minimum: 1 }
                      qty: { type: string }
      responses:
        "200":
          description: Reservation taken and committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/receivables/rma-credits/{id}:backfill-reservation:
    post:
      operationId: backfillRMAReservation
      summary: Give an RMA credit posted before billing reservations a reservation
      description: |
        For a POSTED credit that holds no reservation: reserves the named invoice lines in billing
        under the credit's key and commits the reservation at once, so billing counts the credit
        against the invoice's limit. The lines are the invoice lines the credit returned (sales works
        them out for a credit it stored earlier). 409 AR-RMA-STATE when the credit is not POSTED or
        already holds a reservation; 422 when billing has no room or holds less than the credit.
      x-depot-duty: receivables.payment.post
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoiceId, invoiceLines]
              properties:
                invoiceId: { type: string, format: uuid }
                invoiceLines:
                  type: array
                  items:
                    type: object
                    required: [lineNo, qty]
                    properties:
                      lineNo: { type: integer, minimum: 1 }
                      qty: { type: string }
      responses:
        "200":
          description: Reservation taken and committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RMACreditView" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource version from the last read (ETag). Missing header returns 428.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: id
      in: path
      required: true
      description: Dunning run id.
      schema: { type: string, format: uuid }
    DisputeId:
      name: id
      in: path
      required: true
      description: Dispute id.
      schema: { type: string, format: uuid }
    CaseId:
      name: id
      in: path
      required: true
      description: Collection case id.
      schema: { type: string, format: uuid }
    ConfirmationRunId:
      name: id
      in: path
      required: true
      description: Balance confirmation run id.
      schema: { type: string, format: uuid }
    DownPaymentId:
      name: id
      in: path
      required: true
      description: Down payment or security deposit id.
      schema: { type: string, format: uuid }
    DeductionId:
      name: id
      in: path
      required: true
      description: Deduction id.
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Resource version, quoted.
      schema: { type: string }
  responses:
    Deduction:
      description: The deduction after the command
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Deduction" }
    DownPayment:
      description: The down payment after the command, with its clearings
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DownPayment" }
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, category, owner, reason]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        owner: { type: string, minLength: 1, maxLength: 120 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
        reason: { type: string, minLength: 1, maxLength: 500 }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: Required unless openItemId is given; the case then takes the item's currency. }
        openItemId: { type: [string, "null"], format: uuid, description: An open item of the same customer and legal entity. }
        attachedAmount: { $ref: "#/components/schemas/Money" }
    CollectionCase:
      type: object
      required: [id, legalEntityId, customerId, category, owner, priority, status, reason, currency, slaHours, slaDue, slaBreached, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        category: { type: string, enum: [COLLECTION, DISPUTE, DEDUCTION] }
        owner: { type: string }
        priority: { type: string, enum: [LOW, NORMAL, HIGH] }
        status: { type: string, enum: [OPEN, CLOSED] }
        reason: { type: string, description: "BALANCE_DIFFERENCE for a case a balance confirmation disagreement opened." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        openItemId: { type: string, format: uuid }
        documentNumber: { type: string }
        attachedAmount: { $ref: "#/components/schemas/Money" }
        slaHours: { type: integer }
        slaDue: { type: string, format: date-time }
        slaBreached: { type: boolean, description: "Computed at read time: OPEN and past slaDue (AR-0018)." }
        closeNote: { type: string }
        closedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    CreateConfirmationRunRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, asOfDate]
      properties:
        legalEntityId: { type: string, format: uuid }
        asOfDate: { type: string, format: date }
        threshold: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Defaults to 10000.00 (confirmation_threshold)." }
        sampleSize: { type: [integer, "null"], minimum: 1, maximum: 500 }
        includeZeroBalances: { type: boolean, default: false }
        reminderDays: { type: integer, minimum: 1, maximum: 60, default: 14 }
    ConfirmationRun:
      type: object
      required: [id, legalEntityId, asOfDate, threshold, includeZeroBalances, reminderDays, createdAt, counts]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        asOfDate: { type: string, format: date }
        threshold: { $ref: "#/components/schemas/Money" }
        sampleSize: { type: integer }
        includeZeroBalances: { type: boolean }
        reminderDays: { type: integer }
        createdAt: { type: string, format: date-time }
        counts:
          type: object
          required: [selected, agreed, disagreed, noReply]
          properties:
            selected: { type: integer }
            agreed: { type: integer }
            disagreed: { type: integer }
            noReply: { type: integer }
        confirmations:
          type: array
          description: Present on a single read and on create; left out of the list.
          items: { $ref: "#/components/schemas/Confirmation" }
    Confirmation:
      type: object
      required: [id, runId, legalEntityId, customerId, currency, ourBalance, status]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        ourBalance: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [NO_REPLY, AGREED, DISAGREED] }
        customerBalance: { $ref: "#/components/schemas/Money" }
        difference: { allOf: [{ $ref: "#/components/schemas/Money" }], description: customerBalance minus ourBalance. }
        comment: { type: string }
        repliedAt: { type: string, format: date-time }
        caseId: { type: string, format: uuid, description: The DISPUTE case a disagreement opened. }
    ConfirmationReplyRequest:
      type: object
      additionalProperties: false
      required: [confirmationId, reply]
      properties:
        confirmationId: { type: string, format: uuid }
        reply: { type: string, enum: [AGREED, DISAGREED] }
        customerBalance: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Required for DISAGREED; for AGREED it may only repeat our balance." }
        comment: { type: [string, "null"], maxLength: 500 }
    CreateDownPaymentRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, customerId, kind, currency, amount]
      properties:
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        salesOrderId: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { $ref: "#/components/schemas/Money" }
    DownPayment:
      type: object
      required: [id, legalEntityId, customerId, kind, currency, amount, clearedAmount, remaining, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        salesOrderId: { type: string, format: uuid }
        kind: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { $ref: "#/components/schemas/Money" }
        clearedAmount: { $ref: "#/components/schemas/Money" }
        remaining: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Left to clear or release; the amount asked for on a request; zero once cleared, released or cancelled." }
        status: { type: string, enum: [REQUESTED, RECEIVED, CLEARED, RELEASED, CANCELLED] }
        receivedDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
        clearings:
          type: array
          description: Present on a single read and after a command.
          items:
            type: object
            required: [id, openItemId, documentNumber, amount, clearedAt]
            properties:
              id: { type: string, format: uuid }
              openItemId: { type: string, format: uuid }
              documentNumber: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
              clearedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      description: Decimal string, never a float.
    RemittanceLine:
      type: object
      required: [reference, amount]
      properties:
        reference: { type: string, maxLength: 200 }
        amount: { $ref: "#/components/schemas/Money" }
    StatementLine:
      type: object
      required: [sourceType, documentNumber, documentDate, dueDate, amount, openAmount, runningBalance]
      properties:
        sourceType: { type: string, description: "the open item's source (INVOICE, FEE, INTEREST, DEDUCTION re-bill ...), DEDUCTION for a deduction being worked, PAYMENT for unapplied cash" }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date, description: null for deductions and payments }
        amount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        runningBalance: { $ref: "#/components/schemas/Money" }
    StatementSection:
      type: object
      required: [currency, lines, closingBalance, aging]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        closingBalance: { $ref: "#/components/schemas/Money" }
        aging:
          type: array
          description: Open debit items by aging bucket; deductions and payments are not aged here.
          items: { $ref: "#/components/schemas/AgingTotal" }
    Statement:
