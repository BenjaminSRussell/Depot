      operationId: confirmationDifferences
      summary: The difference list for audit; every DISAGREED reply with both balances and its DISPUTE case
      x-depot-duty: receivables.view
      parameters:
        - { $ref: "#/components/parameters/ConfirmationRunId" }
      responses:
        "200":
          description: Differences
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Confirmation" } }
        "403": { $ref: "#/components/responses/Problem" }
