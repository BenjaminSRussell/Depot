        customerId: { type: string, format: uuid }
        sourceType: { type: string }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        cashDiscountDate: { type: [string, "null"], format: date }
        cashDiscountAmount: { $ref: "#/components/schemas/Money" }
        dunningLevel: { type: integer }
        dunningBlock: { type: boolean }
        status: { type: string }
        version: { type: integer }
        side: { type: string, enum: [DEBIT, CREDIT], description: "CREDIT items (credit notes, unapplied payments) carry negative amounts" }
        importSource: { type: string, description: the legacy system that loaded the item }
        legacyKey: { type: string, description: the item's key in the legacy system }
    PredictionInvoice:
      type: object
      required: [id, legalEntityId, customerId, currency, amount, documentDate, dueDate, dunningLevel, disputes, updatedAt]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        currency: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        dunningLevel: { type: integer }
        disputes: { type: integer }
        paidDate: { type: string, format: date, description: "Only for state=paid: the day of the invoice's last settlement." }
        updatedAt: { type: string, format: date-time }
    OpeningImportRequest:
      type: object
      required: [legalEntityId, importSource, items]
      properties:
        legalEntityId: { type: string, format: uuid }
        importSource: { type: string, maxLength: 40, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$", description: "legacy system label, e.g. SAP-PRD" }
        atomic: { type: boolean, default: false, description: "true stores nothing unless every row is accepted" }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/OpeningItem" }
    OpeningItem:
      type: object
      required: [legacyKey, documentNumber, customerId, kind, side, documentDate, dueDate, currency, originalAmount, openAmount]
      properties:
        legacyKey: { type: string, maxLength: 120, description: "the row's key in the legacy system; unique per importSource" }
        documentNumber: { type: string, maxLength: 60, description: "legacy document number; unique per legal entity" }
        customerId: { type: string, format: uuid, description: the Depot customer the loader resolved }
        kind: { type: string, enum: [INVOICE, CREDIT_NOTE, PAYMENT, ADJUSTMENT] }
        side: { type: string, enum: [DEBIT, CREDIT] }
        documentDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        originalAmount: { $ref: "#/components/schemas/Money" }
        openAmount: { $ref: "#/components/schemas/Money" }
        cashDiscountDate: { type: [string, "null"], format: date }
        cashDiscountAmount: { $ref: "#/components/schemas/Money" }
    OpeningImportResult:
      type: object
      required: [batchId, legalEntityId, importSource, atomic, committed, created, updated, unchanged, rejected, results]
      properties:
        batchId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        importSource: { type: string }
        atomic: { type: boolean }
        committed: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        rejected: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, legacyKey, outcome]
            properties:
              index: { type: integer, description: position in the request }
              legacyKey: { type: string }
              outcome: { type: string, enum: [CREATED, UPDATED, UNCHANGED, REJECTED] }
              openItemId: { type: string, format: uuid }
              code:
                type: string
                description: |
                  AR-OPENING-INVALID (a field failed validation), AR-OPENING-DUPLICATE-KEY (repeated in the batch),
                  AR-OPENING-IDENTITY (legal entity, customer, currency, kind or side differ from the loaded item),
                  AR-OPENING-SETTLED (settled, paid, cleared, deducted or changed in Depot),
                  AR-OPENING-IN-COLLECTION (an active dispute or a holding promise to pay), AR-OPENING-DOCUMENT-EXISTS
                  (document number taken by another item in the legal entity) or AR-OPENING-REJECTED (atomic batch
                  refused elsewhere)
              detail: { type: string }
    OpeningImportSummary:
      type: object
      required: [importSource, legalEntityId, currency, itemCount, debitCount, creditCount, debitOpen, creditOpen, netOpen]
      properties:
        importSource: { type: string }
        legalEntityId: { type: string, format: uuid }
        currency: { type: string }
        itemCount: { type: integer }
        debitCount: { type: integer }
        creditCount: { type: integer }
        debitOpen: { $ref: "#/components/schemas/Money" }
        creditOpen: { $ref: "#/components/schemas/Money", description: "negative" }
        netOpen: { $ref: "#/components/schemas/Money" }
        lastImportedAt: { type: string, format: date-time }
    AgingTotal:
      type: object
      properties:
        currency: { type: string }
        bucket: { type: string, enum: ["CURRENT", "1-30", "31-60", "61-90", "91-180", "OVER-180"] }
        amount: { $ref: "#/components/schemas/Money" }
    MatchResult:
      type: object
      required: [decision, candidates]
      properties:
        decision: { type: string, enum: [AUTO_APPLY, SUGGESTED, ON_ACCOUNT] }
        candidates:
          type: array
          maxItems: 3
          items:
            type: object
            required: [openItemIds, score, rules]
            properties:
              openItemIds: { type: array, items: { type: string, format: uuid } }
              score: { type: integer }
              rules:
                type: array
                description: >-
                  R1 reference +60, R2 amount +30 (R2-SUBSET +25), R3 amount less cash discount +28, R4 payer account
                  bound to the customer +15, R5 payer name Jaro-Winkler >= 0.92 to a learned name +10, R6 value date
                  within 7 days of due +5, R7 short by < 1% or < 50.00 USD / 45.00 EUR with a reason +20 (BR-30.1).
                items: { type: string, enum: [R1, R2, R2-SUBSET, R3, R4, R5, R6, R7] }
    ApplyRequest:
      type: object
      additionalProperties: false
      properties:
        settlements:
          type: array
          items:
            type: object
            required: [openItemId, amount]
            properties:
              openItemId: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
              cashDiscount: { $ref: "#/components/schemas/Money" }
              writeOff: { $ref: "#/components/schemas/Money" }
              itemAmount:
                $ref: "#/components/schemas/Money"
                description: What the settlement takes off the item in the item's currency, with at most the currency's decimals, for an item in another currency than the payment (and then `amount` is the cash in the payment currency, with no discount or write-off). Left out, it is priced at what the cash is worth in the item's currency at the value-date rate. Given, it must be within the entity's FX tolerance (fx-settings; by default the BR-30.4 write-off tolerance, the larger of 5.00 and 0.5% of it) of that worth, else 422 AR-FX-TOLERANCE.
        onAccount: { $ref: "#/components/schemas/Money" }
    ApplyResult:
      type: object
      properties:
        applicationId: { type: string, format: uuid, description: The application this call created; name it in :reverse-application. }
        payment: { $ref: "#/components/schemas/Payment" }
        settlements:
          type: array
          items:
            type: object
            properties:
              openItemId: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
              cashDiscount: { $ref: "#/components/schemas/Money" }
              writeOff: { $ref: "#/components/schemas/Money" }
              openAfter: { $ref: "#/components/schemas/Money" }
              itemStatus: { type: string }
              itemCurrency: { type: string, description: Set for a cross-currency settlement. }
              itemAmount: { $ref: "#/components/schemas/Money" }
              realizedFx: { $ref: "#/components/schemas/Money", description: "Realized exchange difference in the functional currency, positive for a gain." }
    AutoApplyResult:
      type: object
      required: [applied, suggested, onAccount, failed, appliedPaymentIds]
      properties:
        applied: { type: integer }
        suggested: { type: integer, description: Left for the clerk; SUGGESTED is never applied automatically. }
        onAccount: { type: integer }
        failed: { type: integer, description: The matcher said AUTO_APPLY but the application was refused (item locked or settled meanwhile); the payment stays RECEIVED. }
        appliedPaymentIds: { type: array, items: { type: string, format: uuid } }
    LockboxImportRequest:
      type: object
      additionalProperties: false
      required: [legalEntityId, receivedDate, content]
      properties:
        legalEntityId: { type: string, format: uuid }
        receivedDate: { type: string, format: date, description: Date the checks were received (value date of each payment). }
        typeCodes:
          type: array
          description: Bank profile check credit codes (BAI2 credits, 100 to 399); defaults to 116, Item in Lockbox Deposit.
          items: { type: string, pattern: "^[1-3][0-9]{2}$" }
        content: { type: string, maxLength: 3145728, description: BAI2 file as received from the bank, UTF-8. }
        autoApply:
          type: boolean
          description: >
            Match each imported payment and apply the ones the matcher is sure of (AUTO_APPLY, BR-30.1), in file order,
            so a later payment sees the items an earlier one settled. Needs receivables.payment.post as well. A SUGGESTED
            payment is never applied without a clerk. The answer carries `autoApply` counts.
