        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, RECEIVED, CLEARED, RELEASED, CANCELLED] } }
        - { name: kind, in: query, schema: { type: string, enum: [DOWN_PAYMENT, SECURITY_DEPOSIT] } }
