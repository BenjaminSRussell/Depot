              openItemId: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
    PortalIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [STRIPE, ADYEN] }
        method: { type: string, enum: [CARD, ACH] }
        status: { type: string, enum: [REQUIRES_PAYMENT, PROCESSING, SUCCEEDED, FAILED, REFUNDED, DISPUTED] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        cardBrand: { type: string }
        last4: { type: string, description: Last four digits of the card or bank account; nothing more is stored }
        bankName: { type: string }
        failureMessage: { type: string, description: Why the payment failed, in plain language }
        createdAt: { type: string, format: date-time }
        allocations:
          type: array
          items:
            type: object
            properties:
              documentNumber: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
        clientSecret: { type: string, description: The PaymentIntent client secret for the hosted element; only on the create answer, never stored }
        publishableKey: { type: string }
        stripeAccount: { type: string, description: The Stripe Connect account of the legal entity, when there is one }
    GatewayPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        provider: { type: string, enum: [STRIPE, ADYEN] }
        providerAccount: { type: string }
        providerIntentId: { type: string }
        method: { type: string, enum: [CARD, ACH] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { type: string, enum: [REQUIRES_PAYMENT, PROCESSING, SUCCEEDED, FAILED, REFUNDED, DISPUTED] }
        cardBrand: { type: string }
        last4: { type: string }
        cardExpMonth: { type: integer }
        cardExpYear: { type: integer }
        bankName: { type: string }
        failureCode: { type: string }
        failureMessage: { type: string }
        paymentId: { type: string, format: uuid, description: The receivables payment a succeeded one became }
