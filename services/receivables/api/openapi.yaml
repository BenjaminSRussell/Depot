        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }, description: "Rows to skip in the stable order (riskiest first, then customer and currency), to page past the limit." }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Snapshot rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BalanceSnapshot" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
