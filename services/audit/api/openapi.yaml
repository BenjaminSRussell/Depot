openapi: 3.1.0
info:
  title: audit
  version: 0.1.0
  description: >-
    Append-only field-level audit log with a hash chain, fed over HTTP by verified services and by the CDC consumer
    (B-07) from the audited tables of the owning services.
servers:
  - url: https://app.local.depot.dev
paths:
  /v1/audit/changes:
    post:
      operationId: ingestChange
      summary: "Record a change to an audited record"
      description: >-
        Appends one field change to the tenant's hash chain (AUD-API-1, FR-5.10). Only a service that signs its call with
        a service token (X-Depot-Service-Token) may record a change; a call with identity headers only is refused with
        403 AUD-0007, because those headers prove nothing on this route. The actor is the verified caller, never a body
        value: a body that names userId is refused with AUD-0002. A token whose end user is a service principal is that
        service acting on its own (actorKind service, userId "service:<name>"). A token carrying an end user is the calling
        service recording a change it made for that user: userId "service:<calling service>", actorKind service (agent for
        the agent runtime), onBehalfOf the user. actorKind and onBehalfOf may be sent but must match what the verified
        caller is; onBehalfOf from a service acting on its own, or naming anyone but the user the token carries, is
        refused with AUD-0006.
      x-depot-duty: audit.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Change' } } }
      responses:
        '202':
          description: Change recorded on the hash chain.
        '403':
          description: The caller has no verified service token (AUD-0007), or lacks audit.write (AUTH-0003).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: >-
            The body names the actor (userId, AUD-0002), or claims an actorKind or onBehalfOf the verified caller cannot
            vouch for (AUD-0006).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/records:verify:
    get:
      operationId: verifyChangeChain
      summary: "Verify the tenant's change-chain hash chain"
      description: >-
        Walks the tenant's change chain (AUD-API-4, B-07) and reports whether every row recomputes and links to the one
        before it, from the genesis hash; with fromSeq and toSeq (inclusive) only that seq range, trusting the first
        row's prevHash. Every daily anchor whose head lies in the range must still be held by the chain (seq and hash),
        so a chain rewritten or cut short after its anchor fails. Rows written before B-06 that cannot recompute for a
        known reason (an occurredAt with a sub-microsecond part, recovered by trying each lost nanosecond; two rows linked
        to the same predecessor) are counted under knownBreaks and do not fail verification. The walk spans every legal
        entity of the tenant (the chain is one per tenant); the verdict names rows by seq and id only, never by content.
      x-depot-duty: audit.verify
      parameters:
        - { name: fromSeq, in: query, description: First seq to verify (inclusive)., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: toSeq, in: query, description: Last seq to verify (inclusive); not before fromSeq., schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: The verification verdict.
          content: { application/json: { schema: { $ref: '#/components/schemas/ChangeChain' } } }
        '400':
          description: fromSeq or toSeq is not a positive integer, or toSeq is before fromSeq (AUD-0008).
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/records/{entity}/{recordId}:
    get:
      operationId: queryRecord
      summary: "Get the audit history of one record"
      x-depot-duty: audit.read
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Field changes for the record, oldest first.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Record' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/alert-rules:
    post:
      operationId: createAlertRule
      summary: "Create an audit alert rule"
      x-depot-duty: audit.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } }
      responses:
        '201': { description: Rule created. }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/alerts:
    get:
      operationId: listAlerts
      summary: "List raised audit alerts"
      x-depot-duty: audit.read
      responses:
        '200': { description: Alert inbox. }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:
    post:
      operationId: recordPhiRead
      summary: "Record a read of protected health information"
      description: >-
        Appends one row to the tenant's PHI read-access log (HIPAA audit controls, #606): who read which record and fields,
        when, and why. The reader is the verified caller of the request (the end user in a service token), never a body value;
        a body that names userId is refused with AUD-0002. Called by the service that returned the data, not by a person.
      x-depot-duty: audit.read-log.write
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhiReadInput' } } }
      responses:
        '201':
          description: Read appended to the hash chain.
          content: { application/json: { schema: { $ref: '#/components/schemas/PhiRead' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: listPhiReads
      summary: "List PHI reads in chain order"
      x-depot-duty: audit.read-log.view
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: recordId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, description: Inclusive start, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive end, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: One page of reads, oldest first. nextCursor is present when more rows follow.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PhiRead' } }, nextCursor: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:export:
    get:
      operationId: exportPhiReads
      summary: "Export the tenant's PHI read log for an auditor"
      description: >-
        Streams the filtered rows as CSV or NDJSON in chain order. The whole chain is verified first and the verdict is in the
        X-Depot-Read-Chain-* response headers. Keep the head hash: a later export whose chain does not contain it was cut
        short. CSV neutralises cells that start with a formula character; NDJSON is lossless, so recompute hashes from it.
        The trailers X-Depot-Read-Export-Rows and X-Depot-Read-Export-Complete (true) follow the last row; a failure
        while rows are streaming aborts the connection, so a body without the completion trailer is incomplete.
      x-depot-duty: audit.read-log.export
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson], default: csv } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: recordId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: The read log. Cache-Control is no-store.
          headers:
            X-Depot-Read-Chain-Verified: { description: "true when every row links to the one before it from the genesis hash.", schema: { type: string, enum: ['true', 'false'] } }
            X-Depot-Read-Chain-Entries: { description: Rows in the whole chain., schema: { type: integer } }
            X-Depot-Read-Chain-Head: { description: Hash of the last verified row., schema: { type: string } }
            X-Depot-Read-Chain-Broken-At: { description: 0-based position of the first row that does not link; only when verified is false., schema: { type: integer } }
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:verify:
    get:
      operationId: verifyPhiReads
      summary: "Verify the tenant's PHI read-log hash chain"
      x-depot-duty: audit.read-log.export
      responses:
        '200':
          description: The verification result.
          content: { application/json: { schema: { $ref: '#/components/schemas/PhiReadChain' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads:break-glass:
    get:
      operationId: listBreakGlassReads
      summary: "List break-glass PHI reads with their review"
      description: >-
        Reads recorded with the reserved reason code BREAK-GLASS (a purpose that is "BREAK-GLASS" or starts with
        "BREAK-GLASS:" or "BREAK-GLASS "): emergency access to protected health information under a duty kept for
        emergencies (#606). Oldest first. status pending (the default) lists the ones nobody has reviewed yet.
      x-depot-duty: audit.read-log.review
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, reviewed, all], default: pending } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, description: The nextCursor of the previous page., schema: { type: string } }
      responses:
        '200':
          description: One page of break-glass reads. nextCursor is present when more rows follow.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BreakGlassRead' } }, nextCursor: { type: string } } }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/reads/{id}:review:
    post:
      operationId: reviewBreakGlassRead
      summary: "Review one break-glass PHI read"
      description: >-
        A second person's review of a break-glass read, made once: APPROVED, or FLAGGED with a note. The reviewer is the
        verified caller and may not be the person who read the record (AUD-0005, as for a read that is not break-glass or
        is already reviewed). The read-log row is not changed, so the hash chain still verifies.
      x-depot-duty: audit.read-log.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [APPROVED, FLAGGED] }
                note: { type: string, maxLength: 1000, description: Required when the outcome is FLAGGED. }
      responses:
        '200':
          description: The read with its review.
          content: { application/json: { schema: { $ref: '#/components/schemas/BreakGlassRead' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/audit/texts/expand:
    post:
      operationId: expandText
      summary: "Replace placeholders in a text with the given values"
      x-depot-duty: authenticated
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string }, vars: { type: object, additionalProperties: { type: string } } } } } }
      responses:
        '200': { description: Placeholders replaced. }
        default: { $ref: '#/components/responses/Problem' }
  /healthz:
    get:
      operationId: liveness
      x-depot-duty: public
      responses:
        '200': { description: Process is alive. }
  /readyz:
    get:
      operationId: readiness
      x-depot-duty: public
      responses:
        '200': { description: Database reachable. }
        '503': { description: Database unreachable. }
components:
  schemas:
    Change:
      type: object
      additionalProperties: false
      required: [entity, recordId, field]
      properties:
        entity: { type: string }
        recordId: { type: string }
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        userId: { type: string, description: Never accepted. The actor is the verified caller; sending it is refused with AUD-0002. }
        actorKind:
          type: string
          enum: [service, agent]
          description: Optional. Taken from the verified caller; a different value is refused with AUD-0006.
        onBehalfOf:
          type: string
          maxLength: 256
          description: >-
            Optional. Accepted only from a verified service token carrying an end user, and only naming that user; the
            change is then stored with actorKind service (agent for the agent runtime). Refused with AUD-0006 from a
            service acting on its own or when it names another user.
        traceId: { type: string, description: Defaults to the request id. }
        occurredAt: { type: string, format: date-time, description: Defaults to now. }
        reason: { type: string, maxLength: 1000, description: Why the change was made, as the person gave it. }
        changeSetId: { type: string, maxLength: 256, description: Groups the field changes of one save. }
        eventType: { type: string, maxLength: 256, description: Type of the business event that carried the change. }
        eventId: { type: string, maxLength: 256, description: Id of the business event that carried the change. }
        workflowInstanceId: { type: string, maxLength: 256, description: Workflow run that made the change. }
    Record:
      type: object
      required: [entity, recordId, field, userId, traceId, occurredAt]
      properties:
        id: { type: string }
        entity: { type: string }
        recordId: { type: string }
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        userId:
          type: string
          description: >-
            The verified actor: the person, "service:<name>" for a service or agent, or "system:<source service>" for a
            captured change without a verified actor.
        actorKind:
          type: string
          enum: [person, service, agent, system]
          description: >-
            Absent on changes recorded before AUD-API-1, whose actor was not checked. person and system come from the CDC
            feed (B-07): person is the person of the source transaction's depot.ctx message, system a captured change whose
            transaction carried none (with flag unattributed). This API records service and agent only. Every AUD-API-1
            and B-07 field is absent when empty.
        onBehalfOf: { type: string, description: The person a service or agent recorded the change for. }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
        reason: { type: string }
        changeSetId: { type: string }
        eventType: { type: string }
        eventId: { type: string }
        workflowInstanceId: { type: string }
        legalEntityId: { type: string, format: uuid, description: The changed record's legal entity; absent for a tenant-level record. }
        source: { type: string, description: The service whose database the change was captured from (CDC); absent for a change recorded over HTTP. }
        flag:
          type: string
          enum: [unattributed]
          description: unattributed for a captured change whose transaction carried no depot.ctx message (actorKind system).
        hash: { type: string }
    ChangeChain:
      type: object
      required: [verified, entries, fromSeq, toSeq, head, breaks, knownBreaks, anchors]
      properties:
        verified: { type: boolean, description: true when the range has no break; known legacy breaks do not count. }
        entries: { type: integer, format: int64, description: Rows walked. }
        fromSeq: { type: integer, format: int64, description: First seq walked (0 for an empty range). }
        toSeq: { type: integer, format: int64, description: Last seq walked (0 for an empty range). }
        head: { type: string, description: Hash of the last row walked (64 zeros for an empty chain). }
        breaks: { type: integer, format: int64, description: Breaks found; after a break the walk goes on from the broken row's stored hash. }
        firstBreak:
          type: object
          description: The first break in chain order; absent when verified.
          required: [seq, kind]
          properties:
            seq: { type: integer, format: int64 }
            id: { type: string, description: The row's id; absent for an anchored head the chain no longer holds. }
            kind:
              type: string
              enum: [hash-mismatch, link-mismatch, anchor-mismatch]
              description: >-
                hash-mismatch, a stored value changed; link-mismatch, a row removed, inserted or reordered;
                anchor-mismatch, a daily anchor names a head the chain no longer holds.
        knownBreaks:
          type: object
          required: [legacyPrecision, legacyFork]
          properties:
            legacyPrecision: { type: integer, format: int64, description: Rows from before B-06 hashed over a sub-microsecond time, recovered. }
            legacyFork: { type: integer, format: int64, description: Rows from before B-06 linked to the same predecessor as the row before. }
        anchors:
          type: object
          required: [checked, mismatched]
          properties:
            checked: { type: integer, format: int64 }
            mismatched: { type: integer, format: int64 }
    PhiReadInput:
      type: object
      additionalProperties: false
      required: [entity, recordId, fields, purpose]
      properties:
        entity: { type: string, maxLength: 128 }
        recordId: { type: string, maxLength: 128 }
        fields: { type: array, minItems: 1, maxItems: 64, items: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.\[\]-]*$' } }
        purpose: { type: string, minLength: 1, maxLength: 500, description: A reason code or a short reason for reading the data. }
        traceId: { type: string, maxLength: 128, description: Defaults to the request id. }
        occurredAt: { type: string, format: date-time, description: Defaults to now; not more than five minutes ahead. }
        userId: { type: string, description: Never accepted. The reader is the verified caller; sending it is refused with AUD-0002. }
    PhiRead:
      type: object
      required: [id, seq, entity, recordId, fields, purpose, userId, traceId, occurredAt, prevHash, hash]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        entity: { type: string }
        recordId: { type: string }
        fields: { type: array, items: { type: string } }
        purpose: { type: string }
        userId: { type: string, description: The verified caller who read the data. }
        sourceService: { type: string, description: The service that recorded the read. }
        traceId: { type: string }
        occurredAt: { type: string, format: date-time }
        prevHash: { type: string }
        hash: { type: string }
    BreakGlassRead:
      allOf:
        - { $ref: '#/components/schemas/PhiRead' }
        - type: object
          properties:
            review:
              type: object
              description: Absent while the read is pending review.
              required: [outcome, reviewerId, reviewedAt]
              properties:
                outcome: { type: string, enum: [APPROVED, FLAGGED] }
                note: { type: string }
                reviewerId: { type: string }
                reviewedAt: { type: string, format: date-time }
    PhiReadChain:
      type: object
      required: [verified, entries, head]
      properties:
        verified: { type: boolean }
        entries: { type: integer, format: int64 }
        head: { type: string }
        brokenAt: { type: integer, format: int64, description: 0-based position of the first row that does not link. }
    AlertRule:
      type: object
      additionalProperties: false
      required: [entity]
      properties:
        entity: { type: string }
        field: { type: string }
        kind: { type: string, enum: [change, due_date] }
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, instance: { type: string }, code: { type: string }, traceId: { type: string }, errors: { type: object, additionalProperties: { type: string } } }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
