asyncapi: 3.0.0
info:
  title: audit
  version: 0.1.0
channels:
  depot.audit.change:
    address: depot.audit.change
    messages:
      recorded:
        $ref: '#/components/messages/recorded'
  depot.cdc.party:
    address: depot.cdc.party
    description: >-
      Row changes of party's audited tables (vendor_bank_account, the B-07 pilot) and party's depot.ctx messages, written
      by the audit-cdc-party connector (deploy/kafka/connect.yaml) to one partition. Plain Debezium JSON, not CloudEvents.
    messages:
      rowChange:
        $ref: '#/components/messages/cdcRowChange'
      context:
        $ref: '#/components/messages/cdcContext'
operations:
  onRecorded:
    action: send
    channel:
      $ref: '#/channels/depot.audit.change'
    messages:
      - $ref: '#/channels/depot.audit.change/messages/recorded'
  receivePartyRowChange:
    action: receive
    channel:
      $ref: '#/channels/depot.cdc.party'
    messages:
      - $ref: '#/channels/depot.cdc.party/messages/rowChange'
      - $ref: '#/channels/depot.cdc.party/messages/context'
    summary: >-
      Record each changed field of a captured row change in the change chain, with the actor, reason and trace id of its
      source transaction's depot.ctx message, or as actorKind system with flag unattributed when it carried none
      (`audit cdc-consume`, group audit-cdc, dead-letter topic depot.audit.cdc.dlq)
components:
  messages:
    recorded:
      name: recorded
      title: Field change recorded
      description: >-
        The AUD-API-1 fields (actorKind, onBehalfOf, reason, changeSetId, eventType, eventId, workflowInstanceId) and the
        B-07 fields (legalEntityId, source, flag) are absent when empty, as in the Record of
        GET /v1/audit/records/{entity}/{recordId}.
      payload:
        type: object
        required: [entity, recordId, field, userId, traceId]
        properties:
          entity: { type: string }
          recordId: { type: string }
          field: { type: string }
          oldValue: { type: string }
          newValue: { type: string }
          userId: { type: string, description: 'The verified actor: the person, "service:<name>", or "system:<source>" for an unattributed captured change.' }
          actorKind: { type: string, enum: [person, service, agent, system], description: person and system come from the CDC feed (B-07). }
          onBehalfOf: { type: string }
          traceId: { type: string }
          reason: { type: string }
          changeSetId: { type: string }
          eventType: { type: string }
          eventId: { type: string }
          workflowInstanceId: { type: string }
          legalEntityId: { type: string, format: uuid }
          source: { type: string, description: The service the change was captured from (CDC). }
          flag: { type: string, enum: [unattributed] }
      x-depot-type: dev.depot.audit.change.recorded.v1
    cdcRowChange:
      name: cdcRowChange
      title: Captured row change (Debezium)
      description: >-
        A Debezium PostgreSQL change event, JSON without schemas: before and after rows (REPLICA IDENTITY FULL, P3
        columns excluded), source.txId and source.lsn (the CDC position, the consumer's idempotency key), source.ts_ms
        (the commit time, recorded as occurredAt), op c, u or d.
      payload:
        type: object
        required: [op, source]
        properties:
          before: { type: [object, 'null'] }
          after: { type: [object, 'null'] }
          op: { type: string, enum: [c, u, d] }
          ts_ms: { type: integer }
          source:
            type: object
            required: [name, schema, table, txId, lsn]
            properties:
              name: { type: string, description: The connector's topic.prefix, depot.cdc.<service>. }
              schema: { type: string }
              table: { type: string }
              txId: { type: integer }
              lsn: { type: integer }
              ts_ms: { type: integer }
    cdcContext:
      name: cdcContext
      title: depot.ctx message (Debezium)
      description: >-
        A transactional logical-decoding message with prefix depot.ctx (platform/go/auditctx.Emit), op m. message.content
        is the base64 of the JSON {v, tenantId, actor, actorKind, onBehalfOf, reason, traceId, changeSetId, eventType,
        eventId, workflowInstanceId}.
      payload:
        type: object
        required: [op, source, message]
        properties:
          op: { type: string, enum: [m] }
          ts_ms: { type: integer }
          source:
            type: object
            required: [name, txId, lsn]
            properties:
              name: { type: string }
              txId: { type: integer }
              lsn: { type: integer }
          message:
            type: object
            required: [prefix, content]
            properties:
              prefix: { type: string, enum: [depot.ctx] }
              content: { type: string, contentEncoding: base64 }
