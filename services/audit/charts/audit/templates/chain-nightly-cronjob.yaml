{{- if .Values.chainNightly.enabled }}
{{- if not .Values.chainNightly.tenantIds }}
{{- fail "chainNightly.tenantIds must list at least one tenant UUID when chainNightly.enabled is true" }}
{{- end }}
# `audit chain-nightly <tenant-id>...` (B-07): verifies each tenant's change chain, stores the day's anchor (head seq and
# hash, once per tenant per UTC day) and purges depot.ctx messages older than seven days. The job fails when a chain has
# a break (runbook docs/ops/runbooks/audit-chain-verify-failure.md). Tenants are listed because the app role cannot
# enumerate them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-chain-nightly
  labels:
    app.kubernetes.io/name: audit-chain-nightly
spec:
  schedule: {{ .Values.chainNightly.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit-chain-nightly
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: chain-nightly
              image: {{ include "audit.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - chain-nightly
                {{- range .Values.chainNightly.tenantIds }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                {{- include "depot.cloudEnv" $ | nindent 16 }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.databaseSecret }}
                      key: DATABASE_URL
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
