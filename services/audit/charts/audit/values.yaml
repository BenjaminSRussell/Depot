image: { repository: ghcr.io/benjaminsrussell/audit, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: audit-db
migrateOnStart: false
replicaCount: 2
# Deployment strategy; empty keeps the Kubernetes default (RollingUpdate, 25% surge). For a release whose new and
# old replicas must not serve side by side (B-06), set { type: Recreate } or
# { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: "100%" } } for that release only.
strategy: {}
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# Service tokens from hr (and engineering) for POST /v1/audit/reads and /v1/audit/changes, and the depot.ctx signatures
# of every service whose tables the CDC consumer captures (party for the pilot); publicKeys is the
# DEPOT_SERVICE_PUBLIC_KEYS value, name[:kid]=base64 Ed25519 public keys, comma separated. The API and the consumer read it.
serviceIdentity:
  publicKeys: ""
# The CDC consumer (B-07, args [cdc-consume], Deployment <release>-cdc, one replica): folds the row changes the
# audit-cdc-<service> connectors capture into the change chain. It exits at start unless service:audit-cdc is seeded
# in the service principal table. Its KafkaUser, ACLs and dead-letter topic are deploy/kafka/audit-consumer.yaml; off
# by default, like the other consumers, until it is turned on per environment.
consumer:
  enabled: false
  kafka:
    brokers: ""
    group: audit-cdc
    username: audit-consumer
    secret: ""
    dlqTopic: depot.audit.cdc.dlq
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
# CronJob running `audit chain-nightly <tenant-id>...` (B-07): verifies each tenant's change chain, stores the day's
# anchor and purges week-old depot.ctx messages; it fails when a chain has a break. Tenants are listed because the app
# role cannot enumerate them.
chainNightly:
  enabled: false
  schedule: "43 1 * * *"
  tenantIds: []

# >>> migrateJob: generated by deploy/scripts/gen_migrate_jobs.py (D28, ADR-0012 rule 3); do not edit, run the script.
# Owner-role migration Job (templates/migrate-job.yaml): an Argo CD PreSync hook that runs the image's migrate command
# as the schema owner before the release's pods change; a failed migration fails the sync. Serving pods keep
# MIGRATE_ON_START=false and connect as depot_app. ownerSecret holds the owner role's Postgres URL under ownerSecretKey
# (provisioned with the database). Override per environment in deploy/envs/<env>/values or the Application's values.
migrateJob:
  enabled: true
  # The Job pod is <podName>-migrate: the API Deployment's name label, as Postgres clientApps lists it.
  podName: audit
  command: []
  args: [migrate]
  ownerSecret: audit-db-owner
  ownerSecretKey: DATABASE_URL
  # MIGRATE_ALLOW_APP_ROLE: true only where depot_app really owns the schema (dev); otherwise the command refuses it.
  allowAppRole: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # The serving pods' tag without image.tag and image.digest when it is not the chart's appVersion.
  imageTagDefault: ""
  # Values path of the serving pods' MIGRATE_ON_START: the Job refuses to render while it is "true".
  servingMigrateOnStart: migrateOnStart
# <<< migrateJob

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [audit, audit-cdc, audit-chain-nightly]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: engineering
    podNames: [engineering]
  - name: hr
    podNames: [depot-hr, depot-hr-accrue, depot-hr-carryover-expiry, depot-hr-reseal-pii, depot-hr-retention-purge]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
