image: { repository: ghcr.io/benjaminsrussell/audit, digest: "", tag: "", pullPolicy: IfNotPresent }
databaseSecret: audit-db
migrateOnStart: false
replicaCount: 2
# Deployment strategy; empty keeps the Kubernetes default (RollingUpdate, 25% surge). For a release whose new and
# old replicas must not serve side by side (B-06), set { type: Recreate } or
# { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: "100%" } } for that release only.
strategy: {}
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
serviceMonitor: { enabled: false }
# Service tokens from hr (and engineering) for POST /v1/audit/reads and /v1/audit/changes; publicKeys is the
# DEPOT_SERVICE_PUBLIC_KEYS value, name[:kid]=base64 Ed25519 public keys, comma separated.
serviceIdentity:
  publicKeys: ""

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [audit]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers:
  - name: engineering
    podNames: [engineering]
  - name: hr
    podNames: [depot-hr, depot-hr-accrue, depot-hr-carryover-expiry, depot-hr-reseal-pii, depot-hr-retention-purge]
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
