name: record-release

on:
  push:
    branches: [main]
    paths: ['deploy/envs/**']

concurrency:
  group: record-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record-release:
    runs-on: ubuntu-24.04
    environment: platform-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Usability gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          if [ -z "${base//0/}" ]; then base=$(git rev-parse "$HEAD_SHA^"); fi
          releases=()
          for file in docs/releases/*.md; do
            if [ -f "$file" ] && [ "$(basename "$file")" != README.md ]; then releases+=("$file"); fi
          done
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "no release notes: commit docs/releases/<release-id>.md before a release is recorded" >&2
            exit 1
          fi
          newest="${releases[-1]}"
          unset 'releases[-1]'
          start=$(( ${#releases[@]} > 5 ? ${#releases[@]} - 5 : 0 ))
          previous=()
          for file in "${releases[@]:start}"; do previous+=(--previous "$file"); done
          node apps/web/scripts/check-usability-gate.mjs --notes "$newest" --range "$base..$HEAD_SHA" "${previous[@]}"
      - env:
          DEPOT_PLATFORM_API_URL: ${{ vars.DEPOT_PLATFORM_API_URL }}
          DEPOT_PLATFORM_API_TOKEN: ${{ secrets.DEPOT_PLATFORM_API_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          status=0
          for env in stage prod; do
            python3 deploy/scripts/stage_release.py record --env "$env" --since "$BEFORE" || status=$?
          done
          exit "$status"
