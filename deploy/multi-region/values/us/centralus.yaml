# Region file: centralus is PASSIVE (CNPG replica cluster and MirrorMaker 2 target) in the US pair. `depot-ops
# failover --to centralus` sets role PRIMARY here, role FENCED in eastus2.yaml and swaps mm2.sourceAlias/targetAlias in
# both files (docs/ops/runbooks/failover.md). Its backup block is ready for the day it is promoted: the storage account
# is in this region, so a failover never moves backups out of the US.
region:
  id: centralus
  role: PASSIVE
  provider: aks
  namespace: depot-data

postgres:
  primary:
    host: depot-pg-rw.eastus2.depot.internal

backup:
  store: azure-blob
  azure:
    storageAccount: depotpgbkpcentralus
    storageAccountRegion: centralus
    container: pg-backups

kafka:
  localAlias: centralus
  localBootstrap: depot-kafka-bootstrap.kafka.svc:9093
  remoteAlias: eastus2
  remoteBootstrap: depot-kafka-bootstrap.kafka.depot-eastus2.internal:9093

mm2:
  sourceAlias: eastus2
  targetAlias: centralus
