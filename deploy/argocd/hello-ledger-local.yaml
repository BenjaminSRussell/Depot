apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-ledger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Depot.git
    targetRevision: main
    path: services/platform-health/charts/hello-ledger
    helm:
      valuesObject:
        image:
          repository: depot-local/hello-ledger
          tag: local
        # The migration Job (D28) runs as the role that has owned this local schema since on-start migration, from the
        # hello-ledger-db Secret make deploy-local creates; stage and prod use the owner role's hello-ledger-db-owner.
        migrateJob:
          ownerSecret: hello-ledger-db
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
