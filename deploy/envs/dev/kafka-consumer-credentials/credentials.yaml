# Kafka credentials of the consumers dev turns on (D34, B-05b). Each consumer chart mounts a Secret with the KafkaUser's
# SCRAM password and the cluster CA (keys password and ca.crt) at /var/run/depot/kafka. The Strimzi User Operator writes
# the password into the Secret <user> next to the KafkaUser in namespace kafka (deploy/kafka/<user>.yaml), and the
# Cluster Operator the CA into depot-cluster-ca-cert, so External Secrets copies both into hello-ledger through the
# Kubernetes provider. The service account may only `get` those Secrets (Role depot-read-kafka-consumer-credentials in
# deploy/envs/dev/kafka-secrets/consumer-credentials-reader.yaml). A password the User Operator rotates reaches the
# copy within the refresh interval; restart the consumer to pick it up.
#
# To turn another consumer on in dev: add its ExternalSecret here, its user to that Role, KafkaTopics for its source
# topics in deploy/kafka/connect.yaml, and its chart's consumer values (brokers depot-kafka-bootstrap.kafka.svc:9093,
# secret <user>-kafka) in deploy/envs/dev/values/<app>.yaml, then drop it from DEV_OFF in deploy/scripts/test_kafka_consumers.py.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-consumer-credentials
  namespace: hello-ledger
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kafka-users
  namespace: hello-ledger
spec:
  provider:
    kubernetes:
      remoteNamespace: kafka
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kafka-consumer-credentials
---
# receiving's consumer (`receiving consume`: the ERS, ERS tax and erasure groups), deploy/kafka/receiving-consumer.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: receiving-consumer-kafka
  namespace: hello-ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kafka-users
  target:
    name: receiving-consumer-kafka
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: {key: receiving-consumer, property: password}
    - secretKey: ca.crt
      remoteRef: {key: depot-cluster-ca-cert, property: ca.crt}
