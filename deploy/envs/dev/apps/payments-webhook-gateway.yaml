apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-webhook-gateway
  namespace: argocd
  # The payment webhook edge (#30): its own Gateway and route for Stripe, kept apart from the API gateway kustomization.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    depot.dev/requires: envoy-gateway>=v1.4 with crds, a public certificate and the Stripe webhook endpoint (#213)
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Depot.git
    targetRevision: main
    path: deploy/gateway/payments-webhook
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
