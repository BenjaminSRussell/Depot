apiVersion: v1
kind: Namespace
metadata:
  name: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: receiving-cdc
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: depot
  target:
    name: receiving-cdc
    creationPolicy: Owner
  data:
    - secretKey: CDC_PASSWORD
      remoteRef:
        key: depot/dev/receiving-postgres/cdc-password
        property: value
