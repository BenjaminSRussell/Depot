---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
      annotations:
        # initdb scripts run only on an empty PGDATA; bump this whenever postgres-init changes so the pod restarts
        depot.dev/init-rev: "12"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          # One logical slot and one walsender per outbox connector on this Postgres (deploy/kafka/connect.yaml: 57 of
          # them), with headroom; deploy/scripts/test_argocd_apps.py fails when the connectors outgrow these limits.
          # max_slot_wal_keep_size caps the WAL a lagging or stopped connector's slot can hold at 4GB: past it Postgres
          # invalidates that slot (the connector must then be reset, see docs/runbooks/delivery/deploy-local.md) instead of
          # filling the data volume. A slot on a quiet database also lags while other databases write, because nothing
          # in its own database moves its confirmed position. logical_decoding_work_mem bounds each walsender's
          # decoding memory, so 57 walsenders stay inside the memory limit below.
          args: [-c, wal_level=logical, -c, max_replication_slots=64, -c, max_wal_senders=64, -c, max_slot_wal_keep_size=4GB,
                 -c, logical_decoding_work_mem=16MB]
          # Sized for the walsenders: 57 x (16MB decoding memory + a backend of a few MB) is about 1.2GiB at worst, plus
          # shared_buffers and the service backends.
          resources:
            requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 2Gi }
            limits: { memory: 3Gi, ephemeral-storage: 20Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - { name: POSTGRES_USER, value: depot }
            - { name: POSTGRES_DB, value: hello }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: POSTGRES_PASSWORD }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: APP_PASSWORD }
            - name: CDC_PASSWORD
