apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
      annotations:
        # initdb scripts run only on an empty PGDATA; bump this whenever postgres-init changes so the pod restarts
        depot.dev/init-rev: "10"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
          # One logical slot and one walsender per outbox connector on this Postgres (deploy/kafka/connect.yaml), with
          # headroom; deploy/scripts/test_argocd_apps.py fails when the connectors outgrow these limits.
          args: [-c, wal_level=logical, -c, max_replication_slots=32, -c, max_wal_senders=32]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - { name: POSTGRES_USER, value: depot }
            - { name: POSTGRES_DB, value: hello }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: POSTGRES_PASSWORD }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: APP_PASSWORD }
            - name: CDC_PASSWORD
              valueFrom:
                secretKeyRef: { name: receiving-cdc, key: CDC_PASSWORD }
            - name: CDC_EAM_PASSWORD
              valueFrom:
                secretKeyRef: { name: eam-cdc, key: CDC_PASSWORD }
            - name: CDC_TRANSPORT_PASSWORD
              valueFrom:
                secretKeyRef: { name: transport-cdc, key: CDC_PASSWORD }
            - name: CDC_SALES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sales-cdc, key: CDC_PASSWORD }
            - name: CDC_FULFILLMENT_PASSWORD
              valueFrom:
                secretKeyRef: { name: fulfillment-cdc, key: CDC_PASSWORD }
            - name: CDC_BILLING_PASSWORD
              valueFrom:
                secretKeyRef: { name: billing-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_BUDGETING_PASSWORD
              valueFrom:
                secretKeyRef: { name: budgeting-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_WAREHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: warehouse-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_INTERCOMPANY_PASSWORD
              valueFrom:
                secretKeyRef: { name: intercompany-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_FIELDSERVICE_PASSWORD
              valueFrom:
                secretKeyRef: { name: fieldservice-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_OPS_PASSWORD
              valueFrom:
                secretKeyRef: { name: ops-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_RECEIVABLES_PASSWORD
              valueFrom:
                secretKeyRef: { name: receivables-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_EXPENSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: expense-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_PROJECTS_PASSWORD
              valueFrom:
                secretKeyRef: { name: projects-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_PARTY_PASSWORD
              valueFrom:
                secretKeyRef: { name: party-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_PRODUCT_PASSWORD
              valueFrom:
                secretKeyRef: { name: product-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_PURCHASING_PASSWORD
              valueFrom:
                secretKeyRef: { name: purchasing-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_PRODUCTION_PASSWORD
              valueFrom:
                secretKeyRef: { name: production-cdc, key: CDC_PASSWORD, optional: true }
            - name: CDC_HR_PASSWORD
              valueFrom:
                secretKeyRef: { name: hr-cdc, key: CDC_PASSWORD, optional: true }
            - name: EAM_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: eam-database, key: APP_PASSWORD }
            - name: TRANSPORT_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: transport-db, key: APP_PASSWORD }
            - name: ORG_OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: hello-ledger-db, key: ORG_OWNER_PASSWORD, optional: true }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: [pg_isready, -U, depot, -d, hello]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 365 }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hello-ledger
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: receiving
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: org
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eam
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: transport
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
          podSelector:
            matchLabels:
              strimzi.io/cluster: depot-connect
              strimzi.io/kind: KafkaConnect
      ports:
        - { protocol: TCP, port: 5432 }
