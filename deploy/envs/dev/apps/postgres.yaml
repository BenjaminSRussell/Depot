# eam's DATABASE_URL (chart value database.secretName eam-database, key url): its own login role
# depot_eam_app in depot_eam, created by 60-eam-db.sh with the same Vault password (APP_PASSWORD). The
# password goes into the URL as is, so it must be URL-safe (hex, like the other dev passwords).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eam-database
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: depot
  target:
    name: eam-database
    creationPolicy: Owner
    template:
      data:
        url: "postgres://depot_eam_app:{{ .password }}@postgres.hello-ledger.svc:5432/depot_eam?sslmode=disable"
        APP_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: depot/dev/eam-postgres/app-password
        property: value
---
# transport's DATABASE_URL (chart value database.secretName transport-db, key url): its own login role
# depot_transport_app in depot_transport, created by 70-transport-db.sh with the same Vault password
# (APP_PASSWORD). URL-safe password, as for eam-database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transport-db
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: depot
  target:
    name: transport-db
    creationPolicy: Owner
    template:
      data:
        url: "postgres://depot_transport_app:{{ .password }}@postgres.hello-ledger.svc:5432/depot_transport?sslmode=disable"
        APP_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: depot/dev/transport-postgres/app-password
        property: value
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  10-app-role.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE ROLE depot_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$APP_PASSWORD';
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
  20-receiving-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE depot_receiving' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_receiving')\gexec
    GRANT CONNECT, CREATE ON DATABASE depot_receiving TO depot_app;
    \c depot_receiving
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
  30-fx-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE depot_fx' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_fx')\gexec
    GRANT CONNECT, CREATE ON DATABASE depot_fx TO depot_app;
    \c depot_fx
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
  40-org-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE ROLE depot_org_owner LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '$ORG_OWNER_PASSWORD';
    SELECT 'CREATE DATABASE depot_org OWNER depot_org_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_org')\gexec
    GRANT CONNECT ON DATABASE depot_org TO depot_app;
    SQL
  50-receiving-cdc.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    REVOKE CONNECT ON DATABASE hello FROM PUBLIC;
    REVOKE CONNECT ON DATABASE depot_fx FROM PUBLIC;
    REVOKE CONNECT ON DATABASE depot_org FROM PUBLIC;
    REVOKE CONNECT ON DATABASE depot_receiving FROM PUBLIC;
    GRANT CONNECT ON DATABASE hello TO depot_app;
    GRANT CONNECT ON DATABASE depot_fx TO depot_app;
    GRANT CONNECT ON DATABASE depot_org TO depot_app;
    GRANT CONNECT ON DATABASE depot_receiving TO depot_app, debezium_cdc;
    SQL
  60-eam-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_EAM_PASSWORD" -v app_password="$EAM_APP_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_eam LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    CREATE ROLE depot_eam_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD :'app_password';
    SELECT 'CREATE DATABASE depot_eam' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_eam')\gexec
    REVOKE CONNECT ON DATABASE depot_eam FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_eam TO depot_app, depot_eam_app;
    GRANT CONNECT ON DATABASE depot_eam TO debezium_cdc_eam;
    \c depot_eam
    GRANT ALL ON SCHEMA public TO depot_app, depot_eam_app;
    SQL
  70-transport-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_TRANSPORT_PASSWORD" -v app_password="$TRANSPORT_APP_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_transport LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    CREATE ROLE depot_transport_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD :'app_password';
    SELECT 'CREATE DATABASE depot_transport' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_transport')\gexec
    REVOKE CONNECT ON DATABASE depot_transport FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_transport TO depot_app, depot_transport_app;
    GRANT CONNECT ON DATABASE depot_transport TO debezium_cdc_transport;
    \c depot_transport
    GRANT ALL ON SCHEMA public TO depot_app, depot_transport_app;
    SQL
  80-sales-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_SALES_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_sales LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    SELECT 'CREATE DATABASE depot_sales' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_sales')\gexec
    REVOKE CONNECT ON DATABASE depot_sales FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_sales TO depot_app;
    GRANT CONNECT ON DATABASE depot_sales TO debezium_cdc_sales;
    \c depot_sales
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
  90-fulfillment-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_FULFILLMENT_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_fulfillment LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    SELECT 'CREATE DATABASE depot_fulfillment' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_fulfillment')\gexec
    REVOKE CONNECT ON DATABASE depot_fulfillment FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_fulfillment TO depot_app;
    GRANT CONNECT ON DATABASE depot_fulfillment TO debezium_cdc_fulfillment;
    \c depot_fulfillment
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
  # One 95- script per outbox connector database (deploy/kafka/connect.yaml): each creates its database and CDC role and
  # needs only depot_app from 10-app-role.sh, so they share a number and run in name order after the others. Their
  # passwords are optional: with its Vault key not yet written a script creates the database, skips the CDC role and logs
  # it, so the shared Postgres still starts; write the key and restart the pod (docs/runbooks/delivery/deploy-local.md).
  95-billing-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_billing' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_billing')\gexec
    REVOKE CONNECT ON DATABASE depot_billing FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_billing TO depot_app;
    \c depot_billing
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
    if [ -z "$CDC_BILLING_PASSWORD" ]; then
      echo "95-billing-db.sh: CDC_BILLING_PASSWORD is empty (Vault depot/dev/billing-postgres/cdc-password not written); debezium_cdc_billing not created"
    else
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_BILLING_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_billing LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    GRANT CONNECT ON DATABASE depot_billing TO debezium_cdc_billing;
    SQL
    fi
  95-budgeting-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_budgeting' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_budgeting')\gexec
    REVOKE CONNECT ON DATABASE depot_budgeting FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_budgeting TO depot_app;
    \c depot_budgeting
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
    if [ -z "$CDC_BUDGETING_PASSWORD" ]; then
      echo "95-budgeting-db.sh: CDC_BUDGETING_PASSWORD is empty (Vault depot/dev/budgeting-postgres/cdc-password not written); debezium_cdc_budgeting not created"
    else
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_BUDGETING_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_budgeting LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    GRANT CONNECT ON DATABASE depot_budgeting TO debezium_cdc_budgeting;
    SQL
    fi
  95-warehouse-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_warehouse' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_warehouse')\gexec
    REVOKE CONNECT ON DATABASE depot_warehouse FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_warehouse TO depot_app;
    \c depot_warehouse
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
    if [ -z "$CDC_WAREHOUSE_PASSWORD" ]; then
      echo "95-warehouse-db.sh: CDC_WAREHOUSE_PASSWORD is empty (Vault depot/dev/warehouse-postgres/cdc-password not written); debezium_cdc_warehouse not created"
    else
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_WAREHOUSE_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_warehouse LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    GRANT CONNECT ON DATABASE depot_warehouse TO debezium_cdc_warehouse;
    SQL
    fi
  95-intercompany-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_intercompany' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_intercompany')\gexec
    REVOKE CONNECT ON DATABASE depot_intercompany FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_intercompany TO depot_app;
    \c depot_intercompany
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
    if [ -z "$CDC_INTERCOMPANY_PASSWORD" ]; then
      echo "95-intercompany-db.sh: CDC_INTERCOMPANY_PASSWORD is empty (Vault depot/dev/intercompany-postgres/cdc-password not written); debezium_cdc_intercompany not created"
    else
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_INTERCOMPANY_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_intercompany LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    GRANT CONNECT ON DATABASE depot_intercompany TO debezium_cdc_intercompany;
    SQL
    fi
  95-fieldservice-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_fieldservice' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_fieldservice')\gexec
    REVOKE CONNECT ON DATABASE depot_fieldservice FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_fieldservice TO depot_app;
    \c depot_fieldservice
    GRANT ALL ON SCHEMA public TO depot_app;
    SQL
    if [ -z "$CDC_FIELDSERVICE_PASSWORD" ]; then
      echo "95-fieldservice-db.sh: CDC_FIELDSERVICE_PASSWORD is empty (Vault depot/dev/fieldservice-postgres/cdc-password not written); debezium_cdc_fieldservice not created"
    else
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v cdc_password="$CDC_FIELDSERVICE_PASSWORD" <<'SQL'
    CREATE ROLE debezium_cdc_fieldservice LOGIN NOSUPERUSER NOBYPASSRLS REPLICATION PASSWORD :'cdc_password';
    GRANT CONNECT ON DATABASE depot_fieldservice TO debezium_cdc_fieldservice;
    SQL
    fi
  95-ops-db.sh: |
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE DATABASE depot_ops' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_ops')\gexec
    REVOKE CONNECT ON DATABASE depot_ops FROM PUBLIC;
    GRANT CONNECT, CREATE ON DATABASE depot_ops TO depot_app;
    \c depot_ops
