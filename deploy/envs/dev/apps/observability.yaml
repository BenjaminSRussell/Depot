apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Depot.git
    targetRevision: main
    path: deploy/observability/charts/observability
    helm:
      valuesObject:
        # The Prometheus kube-prometheus-stack.yaml runs (release kube-prometheus-stack, namespace observability).
        prometheus:
          endpoint: http://kube-prometheus-stack-prometheus.observability.svc:9090
        # identity serves no policy bundle in dev (bundle.enabled off), so the ext_authz OPA is never ready: its
        # unavailability alert would fire for good (B-04).
        authz:
          opaUnavailableAlert: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # PrometheusRule / ServiceMonitor CRDs come from prometheus-operator-crds in kube-prometheus-stack.yaml (wave -2).
      - SkipDryRunOnMissingResource=true
