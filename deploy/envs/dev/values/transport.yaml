# Dev values for the transport Application (deploy/envs/dev/apps/services.yaml). The database is depot_transport
# in the shared dev Postgres (deploy/envs/dev/apps/postgres.yaml): the ExternalSecret `transport-db` writes the
# chart's DATABASE_URL (key url) for the role depot_transport_app, and the Postgres NetworkPolicy admits the
# transport pods. The migration Job (D28) runs as that role, which has owned the tables since transport migrated on
# start in dev, so migration 0012 can grant the outbox to debezium_cdc_transport for the outbox-transport connector.
migrateJob:
  enabled: true
  ownerSecret: transport-db
  ownerSecretKey: url
