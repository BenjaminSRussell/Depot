apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: depot-connect-read-debezium-cdc
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [debezium-cdc-metadata, debezium-cdc-batch, debezium-cdc-receiving, debezium-cdc-eam, debezium-cdc-transport, debezium-cdc-sales, debezium-cdc-fulfillment, debezium-cdc-budgeting, debezium-cdc-billing, debezium-cdc-fieldservice, debezium-cdc-warehouse, debezium-cdc-intercompany, debezium-cdc-ops, debezium-cdc-receivables, debezium-cdc-expense, debezium-cdc-projects, debezium-cdc-party, debezium-cdc-product, debezium-cdc-purchasing, debezium-cdc-production, debezium-cdc-hr]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: depot-connect-read-debezium-cdc
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: depot-connect-connect
    namespace: kafka
roleRef:
  kind: Role
  name: depot-connect-read-debezium-cdc
  apiGroup: rbac.authorization.k8s.io
