apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: debezium-cdc-metadata
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: depot
  target:
    name: debezium-cdc-metadata
    creationPolicy: Owner
    template:
      data:
        username: debezium_cdc
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: depot/dev/metadata-postgres/cdc-password
        property: value
---
