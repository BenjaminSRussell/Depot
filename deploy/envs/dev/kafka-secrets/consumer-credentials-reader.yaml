# Lets the kafka-users SecretStore in hello-ledger (deploy/envs/dev/kafka-consumer-credentials) read, in this namespace,
# the cluster CA and the Secret the User Operator writes for each KafkaUser whose consumer dev turns on (D34, B-05b).
# Strimzi writes a user's Secret only next to the KafkaUser, so a consumer in hello-ledger gets its copy through External
# Secrets. Only `get`, only these names: add a user here when its consumer is turned on in dev, and remove it when it
# is turned off (deploy/scripts/test_kafka_consumers.py checks the list against the consumers that are on).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: depot-read-kafka-consumer-credentials
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - depot-cluster-ca-cert
      - receiving-consumer
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: depot-read-kafka-consumer-credentials
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: depot-read-kafka-consumer-credentials
subjects:
  - kind: ServiceAccount
    name: kafka-consumer-credentials
    namespace: hello-ledger
