  secretName: postgres-tls
  dnsNames:
  - postgres
  - postgres.hello-ledger.svc
  - postgres.hello-ledger.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: depot-stage-ca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  pg_hba.conf: |
    local all all scram-sha-256
    hostssl all all all scram-sha-256
    hostssl replication all all scram-sha-256
  provision.sql: |
    -- Reconciles the roles and databases of this Postgres on every sync (gen_databases.py). Idempotent: a missing role or
    -- database is created, every password is set from the secret store, so rotating a Vault key and syncing rotates it.
    \set ON_ERROR_STOP on
    \set pw `cat /run/secrets/postgres/app-password`
    SELECT 'CREATE ROLE depot_app' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_app')\gexec
    ALTER ROLE depot_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    -- services/agents-ts/charts/agent-runtime (agent-runtime)
    \set pw `cat /run/secrets/postgres/agents-ts-owner-password`
    SELECT 'CREATE ROLE depot_agents_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_agents_owner')\gexec
    ALTER ROLE depot_agents_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    SELECT 'CREATE DATABASE depot_agents OWNER depot_agents_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_agents')\gexec
    ALTER DATABASE depot_agents OWNER TO depot_agents_owner;
    REVOKE ALL ON DATABASE depot_agents FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_agents TO depot_app;
    \set pw `cat /run/secrets/postgres/agents-ts-cdc-password`
    SELECT 'CREATE ROLE debezium_cdc_agents_ts' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc_agents_ts')\gexec
    ALTER ROLE debezium_cdc_agents_ts WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION NOBYPASSRLS PASSWORD :'pw';
    GRANT CONNECT ON DATABASE depot_agents TO debezium_cdc_agents_ts;
    -- services/analytics/charts/analytics (analytics)
    \set pw `cat /run/secrets/postgres/analytics-owner-password`
    SELECT 'CREATE ROLE depot_analytics_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_analytics_owner')\gexec
    ALTER ROLE depot_analytics_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    SELECT 'CREATE DATABASE depot_analytics OWNER depot_analytics_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_analytics')\gexec
    ALTER DATABASE depot_analytics OWNER TO depot_analytics_owner;
    REVOKE ALL ON DATABASE depot_analytics FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_analytics TO depot_app;
    \set pw `cat /run/secrets/postgres/analytics-cdc-password`
    SELECT 'CREATE ROLE debezium_cdc_analytics' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc_analytics')\gexec
    ALTER ROLE debezium_cdc_analytics WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION NOBYPASSRLS PASSWORD :'pw';
    GRANT CONNECT ON DATABASE depot_analytics TO debezium_cdc_analytics;
    -- services/assets/charts/assets (assets)
    \set pw `cat /run/secrets/postgres/assets-owner-password`
    SELECT 'CREATE ROLE depot_assets_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_assets_owner')\gexec
    ALTER ROLE depot_assets_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    SELECT 'CREATE DATABASE depot_assets OWNER depot_assets_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_assets')\gexec
    ALTER DATABASE depot_assets OWNER TO depot_assets_owner;
    REVOKE ALL ON DATABASE depot_assets FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_assets TO depot_app;
    \set pw `cat /run/secrets/postgres/assets-cdc-password`
    SELECT 'CREATE ROLE debezium_cdc_assets' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc_assets')\gexec
    ALTER ROLE debezium_cdc_assets WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION NOBYPASSRLS PASSWORD :'pw';
    GRANT CONNECT ON DATABASE depot_assets TO debezium_cdc_assets;
    -- services/audit/charts/audit (audit)
    \set pw `cat /run/secrets/postgres/audit-owner-password`
    SELECT 'CREATE ROLE depot_audit_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_audit_owner')\gexec
    ALTER ROLE depot_audit_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    SELECT 'CREATE DATABASE depot_audit OWNER depot_audit_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_audit')\gexec
    ALTER DATABASE depot_audit OWNER TO depot_audit_owner;
    REVOKE ALL ON DATABASE depot_audit FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_audit TO depot_app;
    \set pw `cat /run/secrets/postgres/audit-cdc-password`
    SELECT 'CREATE ROLE debezium_cdc_audit' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc_audit')\gexec
    ALTER ROLE debezium_cdc_audit WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION NOBYPASSRLS PASSWORD :'pw';
    GRANT CONNECT ON DATABASE depot_audit TO debezium_cdc_audit;
    -- services/billing/charts/billing (billing)
    \set pw `cat /run/secrets/postgres/billing-owner-password`
    SELECT 'CREATE ROLE depot_billing_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_billing_owner')\gexec
    ALTER ROLE depot_billing_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
    SELECT 'CREATE DATABASE depot_billing OWNER depot_billing_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_billing')\gexec
    ALTER DATABASE depot_billing OWNER TO depot_billing_owner;
    REVOKE ALL ON DATABASE depot_billing FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_billing TO depot_app;
    \set pw `cat /run/secrets/postgres/billing-cdc-password`
    SELECT 'CREATE ROLE debezium_cdc_billing' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc_billing')\gexec
    ALTER ROLE debezium_cdc_billing WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION NOBYPASSRLS PASSWORD :'pw';
    GRANT CONNECT ON DATABASE depot_billing TO debezium_cdc_billing;
    -- services/budgeting/charts/budgeting (budgeting)
    \set pw `cat /run/secrets/postgres/budgeting-owner-password`
    SELECT 'CREATE ROLE depot_budgeting_owner' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_budgeting_owner')\gexec
