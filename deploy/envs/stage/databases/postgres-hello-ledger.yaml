    printf 'postgres.%s.svc:5432:postgres:depot:%s\n' "$NAMESPACE" "$(sed 's/[\\:]/\\&/g' /run/secrets/superuser/postgres-password)" > /tmp/pgpass
    export PGPASSFILE=/tmp/pgpass
    exec psql "host=postgres.$NAMESPACE.svc port=5432 dbname=postgres user=depot sslmode=verify-full sslrootcert=/tls/ca.crt" -X -q -f /provision/provision.sql
