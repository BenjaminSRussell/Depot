apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-provision
        app.kubernetes.io/part-of: depot-databases
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        command:
        - sh
        - /provision/provision.sh
        env:
        - name: HOME
          value: /tmp
        - name: NAMESPACE
          value: hello-ledger
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: provision
          mountPath: /provision
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: superuser
          mountPath: /run/secrets/superuser
          readOnly: true
        - name: roles
          mountPath: /run/secrets/roles
          readOnly: true
      volumes:
      - name: provision
        configMap:
          name: postgres-config
          items:
          - key: provision.sql
            path: provision.sql
          - key: provision.sh
            path: provision.sh
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: postgres-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: superuser
        secret:
          secretName: postgres-superuser
          defaultMode: 288
      - name: roles
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: postgres-role-agents-ts
              optional: true
              items:
              - key: owner-password
                path: agents-ts-owner-password
              - key: app-password
                path: agents-ts-app-password
              - key: cdc-password
                path: agents-ts-cdc-password
          - secret:
              name: postgres-role-analytics
