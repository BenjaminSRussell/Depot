apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hello-ledger
  labels: &id001
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: depot-databases
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        args:
        - "-c"
        - ssl=on
        - "-c"
        - ssl_cert_file=/tls/tls.crt
        - "-c"
        - ssl_key_file=/tls/tls.key
        - "-c"
        - ssl_min_protocol_version=TLSv1.2
        - "-c"
        - hba_file=/etc/postgresql/pg_hba.conf
        - "-c"
        - password_encryption=scram-sha-256
        - "-c"
        - wal_level=logical
        - "-c"
        - max_replication_slots=65
        - "-c"
        - max_wal_senders=65
        - "-c"
        - max_slot_wal_keep_size=4GB
        - "-c"
        - logical_decoding_work_mem=16MB
        env:
        - name: POSTGRES_USER
          value: depot
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/superuser/postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: pg
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - "-h"
            - 127.0.0.1
            - "-U"
            - depot
            - "-d"
            - postgres
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: config
          mountPath: /etc/postgresql
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: superuser
          mountPath: /run/secrets/superuser
          readOnly: true
      volumes:
      - name: run
        emptyDir: {}
      - name: config
        configMap:
          name: postgres-config
          items:
          - key: pg_hba.conf
            path: pg_hba.conf
      - name: tls
        secret:
          secretName: postgres-tls
          defaultMode: 288
      - name: superuser
        secret:
          secretName: postgres-superuser
          defaultMode: 288
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
---
