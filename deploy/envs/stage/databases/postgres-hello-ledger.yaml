apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision
  namespace: hello-ledger
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-provision
        app.kubernetes.io/part-of: depot-databases
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        command:
        - sh
        - "-c"
        - PGPASSWORD="$(cat /run/secrets/postgres/postgres-password)" exec psql "host=postgres.hello-ledger.svc port=5432
          dbname=postgres user=depot sslmode=verify-full sslrootcert=/tls/ca.crt" -X -q -f /provision/provision.sql
        env:
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: provision
          mountPath: /provision
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: credentials
          mountPath: /run/secrets/postgres
          readOnly: true
      volumes:
      - name: provision
        configMap:
          name: postgres-config
          items:
          - key: provision.sql
            path: provision.sql
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: postgres-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: credentials
        secret:
          secretName: postgres-credentials
          defaultMode: 288
