kind: ConfigMap
metadata:
  name: postgres-config
  namespace: batch
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  pg_hba.conf: |
    local all all scram-sha-256
    hostssl all all all scram-sha-256
  provision.sql: |
    -- Reconciles the roles and databases of this Postgres (gen_databases.py), run by the PostSync Job and the CronJob.
    -- Idempotent. Every role first (NOLOGIN until its password file exists), then the databases, then CONNECT.
    \set ON_ERROR_STOP on
    REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
    REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;
    -- depot_app: the role the migrations grant to and the RLS policies name. No login, CONNECT nowhere; each database's
    -- <database>_app login role is a member and inherits its privileges.
    SELECT 'CREATE ROLE depot_app NOLOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_app')\gexec
    ALTER ROLE depot_app WITH NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD NULL;
    -- roles of services/batch/charts/batch (batch)
    SELECT 'CREATE ROLE debezium_cdc NOLOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'debezium_cdc')\gexec
    ALTER ROLE debezium_cdc WITH NOSUPERUSER NOCREATEDB NOCREATEROLE REPLICATION BYPASSRLS;
    \set ok `test -s /run/secrets/roles/batch-cdc-password && echo true || echo false`
    \if :ok
    \set pw `cat /run/secrets/roles/batch-cdc-password`
    ALTER ROLE debezium_cdc WITH LOGIN PASSWORD :'pw';
    \else
    \echo 'skipped: debezium_cdc cannot sign in yet, its password is not in the secret store (depot/stage/batch-postgres/cdc-password)'
    \endif
    SELECT 'CREATE ROLE depot_platform_app NOLOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_platform_app')\gexec
    ALTER ROLE depot_platform_app WITH NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    GRANT depot_app TO depot_platform_app;
    \set ok `test -s /run/secrets/roles/batch-app-password && echo true || echo false`
    \if :ok
    \set pw `cat /run/secrets/roles/batch-app-password`
    ALTER ROLE depot_platform_app WITH LOGIN PASSWORD :'pw';
    \else
    \echo 'skipped: depot_platform_app cannot sign in yet, its password is not in the secret store (depot/stage/batch-postgres/app-password)'
    \endif
    SELECT 'CREATE ROLE depot_platform_owner NOLOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'depot_platform_owner')\gexec
    ALTER ROLE depot_platform_owner WITH NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
    \set ok `test -s /run/secrets/roles/batch-owner-password && echo true || echo false`
    \if :ok
    \set pw `cat /run/secrets/roles/batch-owner-password`
    ALTER ROLE depot_platform_owner WITH LOGIN PASSWORD :'pw';
    \else
    \echo 'skipped: depot_platform_owner cannot sign in yet, its password is not in the secret store (depot/stage/batch-postgres/owner-password)'
    \endif
    -- database of services/batch/charts/batch (batch)
    SELECT 'CREATE DATABASE depot_platform OWNER depot_platform_owner' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'depot_platform')\gexec
    ALTER DATABASE depot_platform OWNER TO depot_platform_owner;
    REVOKE ALL ON DATABASE depot_platform FROM PUBLIC;
    REVOKE ALL ON DATABASE depot_platform FROM depot_app;
    GRANT CONNECT, TEMPORARY ON DATABASE depot_platform TO depot_platform_app;
    GRANT CONNECT ON DATABASE depot_platform TO debezium_cdc;
  provision.sh: |
    set -eu
    umask 077
    # The superuser's password goes into a pgpass file in the pod's /tmp, not the environment (pgpass escapes : and \).
    printf 'postgres.%s.svc:5432:postgres:depot:%s\n' "$NAMESPACE" "$(sed 's/[\\:]/\\&/g' /run/secrets/superuser/postgres-password)" > /tmp/pgpass
    export PGPASSFILE=/tmp/pgpass
    exec psql "host=postgres.$NAMESPACE.svc port=5432 dbname=postgres user=depot sslmode=verify-full sslrootcert=/tls/ca.crt" -X -q -f /provision/provision.sql
