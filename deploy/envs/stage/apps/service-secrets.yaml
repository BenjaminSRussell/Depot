kind: Application
metadata:
  name: metadata-secrets-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Depot.git
    targetRevision: v0.2.0
    path: deploy/envs/stage/service-secrets/metadata
  destination:
    name: stage
    namespace: metadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
---
