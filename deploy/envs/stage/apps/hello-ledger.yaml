apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-ledger-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/BenjaminSRussell/Depot.git
    # The stage release tag (deploy/envs/stage/release.yaml; stage_apps.py keeps this line and the tag below in step).
    targetRevision: v0.2.0
    path: services/platform-health/charts/hello-ledger
    helm:
      valuesObject:
        image:
          repository: ghcr.io/benjaminsrussell/hello-ledger
        replicaCount: 2
        ingress:
          enabled: true
          host: stage.depot.dev
          clusterIssuer: depot-stage-ca
      # Pinned to the release version until deploy/scripts/stage_release.py promotes a signed digest (it adds image.digest
      # above, which the chart prefers to the tag). Kyverno refuses the tag in stage, so nothing runs until then.
      parameters:
        - name: image.tag
          value: "0.2.0"
  destination:
    name: stage
    namespace: hello-ledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
