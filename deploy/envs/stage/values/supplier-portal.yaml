# supplier-portal in stage: served from supplier.stage.depot.dev, signing in against the realm on idp.stage.depot.dev.
# The client secret (supplier-portal-oidc) and the Ed25519 signing seed (supplier-portal-signing) are created outside Git
# (#213). One replica until sessionStore.url names a shared Valkey (the chart refuses more without it).
oidc:
  issuer: https://idp.stage.depot.dev/realms/depot
  redirectUri: https://supplier.stage.depot.dev/bff/callback
appOrigin: https://supplier.stage.depot.dev
# No clamd in stage yet: uploads are accepted unscanned, as in dev. Set scan.clamavAddr (and drop this) before stage holds
# real supplier documents.
scan:
  allowUnscanned: true
# The portal edge is the TCP peer of every request, so the public routes' per-address limit reads the client from
# X-Forwarded-For past the Envoy pods: the pod CIDR of the stage cluster. 10.244.0.0/16 is the AKS Azure CNI overlay default
# (deploy/tofu/cluster/modules/aks sets no pod_cidr); change it if the stage cluster uses another.
trustedProxies: 10.244.0.0/16
# The services this BFF calls, at the Service names and ports their charts render in namespace hello-ledger (the chart
# defaults name a namespace per service, which no environment has). deploy/scripts/test_gateway.py checks each against the
# dev Service table of deploy/scripts/gen_httproutes.py (D31, B-02a).
upstreams:
  purchasing: http://purchasing-purchasing.hello-ledger.svc:80
  receiving: http://receiving.hello-ledger.svc:8080
  party: http://party.hello-ledger.svc:8080
  payables: http://payables.hello-ledger.svc:8080
