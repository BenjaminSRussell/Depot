# Client side of the AS2 edge: TLS 1.2 or newer, and the Depot identity headers are removed before anything else
# runs. The edi AS2 listener ignores them anyway (it has no tenant middleware); removing them keeps the rule that only
# the gateway's JWT policy ever sets them.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: depot-as2-client
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: depot-as2
  tls:
    minVersion: "1.2"
  headers:
    earlyRequestHeaders:
      remove:
        - X-Depot-Tenant
        - X-Depot-Legal-Entity
        - X-Depot-User
        - X-Depot-Duties
        - X-Depot-Tier
        - X-Depot-Auth-Time
        - X-Depot-LegalEntity
        - X-Depot-LegalEntity-Scope
        - X-Depot-Service-Token
        - X-Depot-Gateway-Secret
