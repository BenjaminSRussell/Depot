# The AS2 edge (#483). Trading partners post AS2 messages and asynchronous MDNs without a Depot token; edi
# authenticates them by their AS2 signature against the certificate pinned on the partner's transport. This is a
# Gateway of its own, so SecurityPolicy/depot-api-jwt (which targets Gateway depot-api) can never apply to it, and
# its only route is HTTPRoute/edi-as2 (POST /as2/v1/, /cxml/v1/ and /punchout/v1/return/ to the edi-as2 Service). HTTPS only; the hostname is per
# environment (as2.<env>.depot.dev, like the IdP's idp.<env>.depot.dev). deploy/scripts/test_gateway.py checks
# that no other route attaches here and that every depot-api route stays behind the JWT policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: depot-as2
  namespace: hello-ledger
spec:
  gatewayClassName: depot-envoy
  listeners:
    - name: as2-https
      protocol: HTTPS
      port: 443
      hostname: as2.stage.depot.dev
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: depot-as2-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
