# The customer and supplier portal edge (#30, #511, #213). The portals sign in with their own Keycloak clients and keep a
# cookie session in their BFF (services/customer-portal-ts, services/supplier-portal-ts); their requests carry no Passage
# JWT, so they cannot sit on Gateway passage-api (SecurityPolicy/passage-api-jwt targets that whole Gateway). This is a
# Gateway of its own, like passage-as2 and passage-region: one HTTPS listener per portal host (customer.<env>.passage.dev,
# supplier.<env>.passage.dev), each with its cert-manager Certificate and one HTTPRoute to that portal's BFF and nothing
# else. The identity headers are stripped before any filter runs, each route allows only its own origin (CORS), and every
# client address is rate limited. The portal app's static files are not served here yet (no image hosts them); WAF rules
# are not expressible in Envoy Gateway and stay open. deploy/scripts/test_gateway.py (PortalEdge) checks all of this.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: passage-portals
  namespace: hello-ledger
spec:
  gatewayClassName: passage-envoy
  listeners:
    - name: customer-https
      protocol: HTTPS
      port: 443
      hostname: customer.dev.passage.dev
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: passage-portal-customer-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    - name: supplier-https
      protocol: HTTPS
      port: 443
      hostname: supplier.dev.passage.dev
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: passage-portal-supplier-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passage-portal-customer-tls
  namespace: hello-ledger
spec:
  secretName: passage-portal-customer-tls
  dnsNames:
    - customer.dev.passage.dev
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: passage-local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: passage-portal-supplier-tls
  namespace: hello-ledger
spec:
  secretName: passage-portal-supplier-tls
  dnsNames:
    - supplier.dev.passage.dev
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: passage-local-ca
---
# The customer portal BFF: only its sign-in and session routes (/bff/) and its API proxy (/api/v1/). Its health checks stay
# inside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customer-portal
  namespace: hello-ledger
spec:
  parentRefs:
    - name: passage-portals
      sectionName: customer-https
  hostnames:
    - customer.dev.passage.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bff/
        - path:
            type: PathPrefix
            value: /api/v1/
      backendRefs:
        - name: customer-portal
          port: 8080
---
# The supplier portal BFF: only its sign-in and session routes (/bff/) and its API proxy (/api/v1/). Its health checks stay
# inside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supplier-portal
  namespace: hello-ledger
spec:
  parentRefs:
    - name: passage-portals
      sectionName: supplier-https
  hostnames:
    - supplier.dev.passage.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bff/
        - path:
            type: PathPrefix
            value: /api/v1/
      backendRefs:
        - name: supplier-portal
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: passage-portals-client
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: passage-portals
  tls:
    minVersion: "1.2"
  headers:
    earlyRequestHeaders:
      remove:
        - X-Passage-Tenant
        - X-Passage-Legal-Entity
        - X-Passage-User
        - X-Passage-Duties
        - X-Passage-Tier
        - X-Passage-Auth-Time
        - X-Passage-LegalEntity
        - X-Passage-LegalEntity-Scope
        - X-Passage-Service-Token
        - X-Passage-Gateway-Secret
---
# Same-origin only: a browser on any other origin gets no CORS grant, so it can neither read a portal answer with the
# session cookie nor send the JSON or CSRF-header requests that need a preflight. The BFF checks Origin and the CSRF token
# itself as well. No JWT here: the portal signs in with its own Keycloak client and a cookie session, and its tokens carry
# no passage-api audience.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: passage-portal-customer-cors
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: customer-portal
  cors:
    allowOrigins:
      - https://customer.dev.passage.dev
    allowMethods: [GET, HEAD, POST, PUT, PATCH, DELETE]
    allowHeaders: [Content-Type, Idempotency-Key, If-Match, X-CSRF-Token, X-Customer, X-Legal-Entity]
    allowCredentials: true
    maxAge: 600s
---
# Same-origin only: a browser on any other origin gets no CORS grant, so it can neither read a portal answer with the
# session cookie nor send the JSON or CSRF-header requests that need a preflight. The BFF checks Origin and the CSRF token
# itself as well. No JWT here: the portal signs in with its own Keycloak client and a cookie session, and its tokens carry
# no passage-api audience.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: passage-portal-supplier-cors
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: supplier-portal
  cors:
    allowOrigins:
      - https://supplier.dev.passage.dev
    allowMethods: [GET, HEAD, POST, PUT, PATCH, DELETE]
    allowHeaders: [Content-Type, Idempotency-Key, If-Match, X-CSRF-Token, X-Customer, X-Legal-Entity]
    allowCredentials: true
    maxAge: 600s
---
# 1200 requests a minute per client address and portal (one bucket across /bff/ and /api/v1/ of that portal; the two portals
# count separately), on top of the BFFs' own limits (300 calls a minute per session; the supplier portal's public routes per
# address and hour, which needs the BFF's trustedProxies set to the Envoy pods). 1200 leaves room for several contacts behind
# one company NAT and caps a single address that floods sign-in or registration. Needs the real client address at Envoy
# (externalTrafficPolicy: Local on the Envoy Service, or PROXY protocol), as the AS2 edge does.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: passage-portal-customer-limits
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: customer-portal
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 1200
            unit: Minute
          # One bucket per address for the whole portal: without it Envoy Gateway counts each route match (/bff/, /api/v1/)
          # separately.
          shared: true
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 1200
            unit: Minute
          # One bucket per address for the whole portal: without it Envoy Gateway counts each route match (/bff/, /api/v1/)
          # separately.
          shared: true
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: passage-portal-supplier-limits
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: supplier-portal
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 1200
            unit: Minute
          # One bucket per address for the whole portal: without it Envoy Gateway counts each route match (/bff/, /api/v1/)
          # separately.
          shared: true
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 1200
            unit: Minute
          # One bucket per address for the whole portal: without it Envoy Gateway counts each route match (/bff/, /api/v1/)
          # separately.
          shared: true
