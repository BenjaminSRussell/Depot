apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - jwks-configmap.yaml
  - httproutes.yaml
  - clienttrafficpolicy.yaml
  - securitypolicy.yaml
  # One authorization enforcement model (B-04, ADR-0017): the OPA Envoy's ext_authz asks, and ext_authz after jwt_authn.
  - authz-opa.yaml
  - envoyproxy.yaml
  - backendtrafficpolicy.yaml
  # AS2 edge for trading partners (#483): a Gateway of its own, outside the JWT SecurityPolicy.
  - as2-gateway.yaml
  - as2-certificate.yaml
  - as2-httproute.yaml
  - as2-clienttrafficpolicy.yaml
  - as2-backendtrafficpolicy.yaml
  # Region health edge (DPT-50, OPS-1703): GET /healthz/region without a JWT, a Gateway of its own.
  - region-gateway.yaml
  # Plant edge for iot-edge connectors (#25): a Gateway of its own, mTLS with the edge CA, outside the JWT SecurityPolicy.
  - edge-gateway.yaml
  - edge-certificate.yaml
  - edge-httproute.yaml
  - edge-clienttrafficpolicy.yaml
  # Customer and supplier portal edge (#30, #511): cookie-session BFFs without a Depot JWT, a Gateway of its own.
  - portal-gateway.yaml
