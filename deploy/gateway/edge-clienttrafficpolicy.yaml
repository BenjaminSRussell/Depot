# Client side of the plant edge. The listener takes a client certificate but does not require one: a connector that
# redeems its enrollment token has none yet, and the token is that call's credential. Where a certificate is presented
# it must chain to the edge CA (Secret depot-edge-ca-trust, key ca.crt: the CA certificate of the shop floor service's
# edgePki issuer). Envoy then forwards it as X-Forwarded-Client-Cert with its subject (SanitizeSet: the header is built
# from the verified certificate, and any value the client sent is dropped), and the shop floor service reads the common
# name, edge:<node id>, as the caller and matches it to the node's bound connector subject. A call without a certificate
# has no identity, and the service answers it 401. The Depot identity headers are removed before anything else runs.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: depot-edge-client
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: depot-edge
  tls:
    minVersion: "1.2"
    clientValidation:
      optional: true
      caCertificateRefs:
        - group: ""
          kind: Secret
          name: depot-edge-ca-trust
  headers:
    xForwardedClientCert:
      mode: SanitizeSet
      certDetailsToAdd:
        - Subject
    earlyRequestHeaders:
      remove:
        - X-Depot-Tenant
        - X-Depot-Legal-Entity
        - X-Depot-User
        - X-Depot-Duties
        - X-Depot-Tier
        - X-Depot-Auth-Time
        - X-Depot-LegalEntity
        - X-Depot-LegalEntity-Scope
        - X-Depot-Service-Token
        - X-Depot-Gateway-Secret
