apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: depot-api-jwt
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: depot-api
  jwt:
    providers:
      - name: depot-dev-idp
        issuer: https://idp.dev.depot.dev/realms/dev
        audiences:
          - depot-api
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: depot-dev-jwks
        claimToHeaders:
          - claim: tid
            header: X-Depot-Tenant
          - claim: le
            header: X-Depot-Legal-Entity
          - claim: sub
            header: X-Depot-User
          - claim: duties
            header: X-Depot-Duties
          - claim: tier
            header: X-Depot-Tier
          - claim: auth_time
            header: X-Depot-Auth-Time
  # One enforcement model (B-04, ADR-0017): after the JWT filter (envoyproxy.yaml puts ext_authz after jwt_authn), every
  # request is decided by the OPA in authz-opa.yaml on the same policy devgateway and depot-server ask (data.authz.envoy).
  # Only the identity headers the JWT filter set and the request id go to OPA, never the bearer token or cookies. No
  # answer refuses the request (failOpen false). The services still check the route's duty themselves (defence in depth).
  extAuth:
    failOpen: false
    headersToExtAuth:
      - x-depot-tenant
      - x-depot-user
      - x-depot-legal-entity
      - x-request-id
    grpc:
      backendRefs:
        - name: depot-authz-opa
          port: 9191
  authorization:
    defaultAction: Allow
    rules:
      - name: deny-platform-nil-tenant
        action: Deny
        principal:
          jwt:
            provider: depot-dev-idp
            claims:
              - name: tid
                valueType: String
                values:
                  - "00000000-0000-0000-0000-000000000000"
