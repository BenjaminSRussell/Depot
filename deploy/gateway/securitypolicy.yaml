apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: depot-api-jwt
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: depot-api
  jwt:
    providers:
      - name: depot-dev-idp
        issuer: https://idp.dev.depot.dev/realms/dev
        audiences:
          - depot-api
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: depot-dev-jwks
        claimToHeaders:
          - claim: tid
            header: X-Depot-Tenant
          - claim: le
            header: X-Depot-Legal-Entity
          - claim: sub
            header: X-Depot-User
          - claim: duties
            header: X-Depot-Duties
          - claim: tier
            header: X-Depot-Tier
          - claim: auth_time
            header: X-Depot-Auth-Time
  authorization:
    defaultAction: Allow
    rules:
      - name: deny-platform-nil-tenant
        action: Deny
        principal:
          jwt:
            provider: depot-dev-idp
            claims:
              - name: tid
                valueType: String
                values:
                  - "00000000-0000-0000-0000-000000000000"
