apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: depot-api-strip-identity-headers
  namespace: hello-ledger
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: depot-api
  headers:
    earlyRequestHeaders:
      remove:
        - X-Depot-Tenant
        - X-Depot-Legal-Entity
        - X-Depot-User
        - X-Depot-Duties
        - X-Depot-Tier
        - X-Depot-Auth-Time
        - X-Depot-LegalEntity
        - X-Depot-Service-Token
        - X-Depot-Gateway-Secret
