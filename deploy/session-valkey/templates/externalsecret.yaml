{{- include "session-valkey.clients" . }}
{{- $prefix := include "session-valkey.prefix" . }}
{{- $commands := .Values.commands }}
# The server's ACL file and the readiness probe's password. The default user is off, so a connection that does not sign in
# as one of these users can run nothing. The ACL file holds only SHA-256 hashes of the passwords (#<hex>), so a password
# never sits in it in clear and no character in it can be read as another ACL rule.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session-valkey-acl
  labels:
    app.kubernetes.io/name: session-valkey
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: session-valkey-acl
    creationPolicy: Owner
    template:
      data:
        users.acl: |
          user default off
          user probe on #{{ "{{ .probe | sha256sum }}" }} -@all +ping
          {{- range .Values.clients }}
          user {{ .name }} on #{{ printf "{{ .%s | sha256sum }}" (include "session-valkey.var" .name) }} resetchannels ~{{ .keyPrefix }}* -@all{{ range $commands }} +{{ . }}{{ end }}
          {{- end }}
        probe-password: "{{ "{{ .probe }}" }}"
  data:
    - secretKey: probe
      remoteRef:
        key: {{ $prefix }}/session-valkey/probe-password
        property: value
    {{- range .Values.clients }}
    - secretKey: {{ include "session-valkey.var" .name }}
      remoteRef:
        key: {{ $prefix }}/session-valkey/{{ .name }}-password
        property: value
    {{- end }}
{{- range .Values.clients }}
---
# The client's copy of its password, and the rediss:// URL it connects with (the portal chart's sessionStore.url and
# sessionStore.passwordSecretName). Same Vault key as its ACL user above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-session-store
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: session-valkey
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecret.storeName }}
  target:
    name: {{ .name }}-session-store
    creationPolicy: Owner
    template:
      data:
        url: rediss://{{ .name }}@session-valkey.{{ $.Release.Namespace }}.svc:{{ $.Values.port }}
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $prefix }}/session-valkey/{{ .name }}-password
        property: value
{{- end }}
