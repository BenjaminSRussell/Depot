# The server certificate clients verify on rediss:// (issued by tls.issuer; cert-manager renews it). The server presents it
# and does not ask clients for one: they sign in with their ACL user instead.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: session-valkey-tls
  labels:
    app.kubernetes.io/name: session-valkey
spec:
  secretName: session-valkey-tls
  dnsNames:
    - session-valkey
    - session-valkey.{{ .Release.Namespace }}.svc
    - session-valkey.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: {{ required "tls.issuer is required: the session store serves TLS only" .Values.tls.issuer }}
