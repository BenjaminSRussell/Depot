database: ""
image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
persistence:
  size: 10Gi
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
clientApps: []
# Also admit each clientApps entry's owner-role migration Job pod (<entry>-migrate, component migrate; D28). Turn off
# for a client that is not a Depot service chart with migrations.
admitMigrateJobs: true
# enabled: false drops logical WAL, the debezium_cdc role, its Vault key and the Kafka Connect ingress (a database
# with no outbox, e.g. Apicurio Registry's); clientApps is then required.
cdc:
  enabled: true
  kafkaNamespace: kafka
secretName: ""
externalSecret:
  enabled: true
  storeName: depot
  environment: ""
  pathPrefix: depot/{env}
  refreshInterval: 1h
# TLS only (stage, prod): a cert-manager certificate from tls.issuer and a pg_hba that admits TCP only over TLS with SCRAM.
tls:
  enabled: false
  issuer: ""
