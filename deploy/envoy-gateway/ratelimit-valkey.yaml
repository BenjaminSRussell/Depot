# Backend of Envoy Gateway's global rate-limit service (#82, #213). The tenant limit (deploy/gateway/backendtrafficpolicy.yaml)
# and the per-address limits of the AS2, region and portal edges are global rules: Envoy Gateway runs its rate-limit service
# only when config.envoyGateway.rateLimit names a Redis-protocol backend (deploy/envs/dev/apps/envoy-gateway.yaml points it
# here). Counters only: no persistence, no auth, reachable from the envoy-gateway-system namespace alone. Losing the pod
# resets the counters, which a rate limit tolerates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit-valkey
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ratelimit-valkey
    app.kubernetes.io/part-of: passage-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratelimit-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratelimit-valkey
        app.kubernetes.io/part-of: passage-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1.9-alpine@sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1
          args: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit-valkey
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ratelimit-valkey
spec:
  selector:
    app.kubernetes.io/name: ratelimit-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratelimit-valkey
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ratelimit-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        # The rate-limit Deployment Envoy Gateway creates in this namespace.
        - podSelector: {}
      ports:
        - port: 6379
