# The payment-prediction consumer (#47, `python -m prediction.consumer`, group prediction) rescores invoices on receivables' payment,
# credit settlement, dispute, dunning letter, deduction, down payment and opening-item events. The chart's consumer.kafka.username names this
# user. Literal ACLs: it reads only those seven receivables topics and uses only its own group; it writes nothing (a refused event is
# recorded in the service's consumer_inbox, not on a dead-letter topic). The topics are created by an outbox connector for receivables'
# database, which does not exist in connect.yaml yet: until it is added no event reaches this consumer, which stays off in dev
# (prediction chart consumer.enabled=false).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: prediction-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: passage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: passage.receivables.payment, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.creditsettlement, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.dispute, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.dunningletter, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.deduction, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.downpayment, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: passage.receivables.openitem, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: group, name: prediction, patternType: literal}
        operations: [Read, Describe]
