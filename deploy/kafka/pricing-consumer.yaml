# The pricing replica cache consumer (FR-26.14, runs inside every pricing API pod while cacheConsumer.enabled) follows
# campaign.killed, campaign.restored, parameters.changed and tenantparameter.changed so each replica drops its caches,
# and parks what it cannot apply on depot.pricing.cache.dlq. Every replica reads under a group of its own,
# pricing-cache-<pod name> (cmd/pricing/cache_consumer.go ignores KAFKA_GROUP), so the group ACL is the one prefix
# grant here; the topic ACLs stay literal. The chart's cacheConsumer.username names this user. outbox-pricing in
# connect.yaml writes both topics (B-05b, D34).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: pricing-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.pricing.campaign, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.pricing.parameters, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.pricing.cache.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: pricing-cache-, patternType: prefix}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-pricing-cache-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.pricing.cache.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
