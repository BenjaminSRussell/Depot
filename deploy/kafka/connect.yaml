# Migration-factory routes by event type: dev.depot.<context>.<entity>.<verb>.v<n> goes to depot.<context>.<entity>, the AsyncAPI
# channels in tools/migration-factory/events/asyncapi.yaml.
# Also: it publishes under the migration and cutover contexts, so the route keeps <context>.<entity>; it shares
# depot.migration. with outbox-migration (different channels). The service lives under tools/migration-factory.
# A type that does not match keeps its own name as the topic, which no ACL allows, so the task fails instead of writing
# elsewhere. The ACLs above are literal per channel (a new entity needs an entry); deploy/scripts/test_argocd_apps.py routes every
# message of the AsyncAPI through the route, compares the ACLs with the channels and checks every type the service defines in code.
# snapshot.mode no_data: pgoutput streaming ignores RLS, so the CDC role needs neither BYPASSRLS nor a snapshot read of the forced-RLS outbox.
# debezium_cdc_migration_factory has REPLICATION; the dev Postgres init (95-migration-factory-db.sh) creates depot_migration_factory and that role,
# grants it CONNECT there only and revokes CONNECT from PUBLIC. The publication and the role's SELECT on outbox are
# the service's migrations 0033 and 0034.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-migration-factory
  namespace: kafka
  labels:
    strimzi.io/cluster: depot-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: postgres.hello-ledger.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-migration-factory:username}
    database.password: ${secrets:kafka/debezium-cdc-migration-factory:password}
    database.dbname: depot_migration_factory
    topic.prefix: depot.migrationfactory
    slot.name: depot_outbox_migration_factory
    publication.name: depot_outbox_migration_factory
    publication.autocreate.mode: disabled
    table.include.list: public.outbox
    snapshot.mode: no_data
    tombstones.on.delete: false
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 12
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: 604800000
    transforms: outbox,enrich
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.route.by.field: type
    transforms.outbox.route.topic.regex: 'dev\.depot\.(?<routedByValue>(?:migration|cutover)\.[a-z][a-z0-9]*)\.[a-z][a-z0-9]*\.v[0-9]+'
    transforms.outbox.route.topic.replacement: depot.${routedByValue}
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: tenant_id:header:tenantid
    transforms.enrich.type: dev.depot.connect.cloudevents.CloudEventsEnricher
    transforms.enrich.source.default: depot
    transforms.enrich.dataschema.template: https://schemas.depot.dev/{type}.json
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
---
# Audit table CDC (B-07, architecture gap D3): a connector type separate from the outbox relays. It captures row changes
# of a service's audited master-data tables (table.include.list, from the service's publication depot_audit_<service>)
# and the signed depot.ctx logical-decoding messages the service writes in the same transactions (auditctx.Emit,
# message.prefix.include.list), and routes both to the single topic depot.cdc.<service> (KafkaTopic below, one
# partition, so a transaction's message is read before its changes). The audit CDC consumer (`audit cdc-consume`,
# deploy/kafka/audit-consumer.yaml) turns each change into chain records with the message's actor, reason and trace id
# once the message's signature verifies against the service's key. Values are plain Debezium JSON, no CloudEvents
# envelope: numbers as strings (decimal.handling.mode string).
# P3 columns: their ciphertext is in the WAL (REPLICA IDENTITY FULL puts the old row there too) and reaches this worker
# over the replication connection; column.exclude.list drops it here, so it is never written to Kafka.
# Heartbeats: the captured table changes rarely while the rest of the database is busy, so the slot would hold WAL
# back. Every heartbeat.interval.ms the connector runs heartbeat.action.query, a non-transactional logical message
# (no table needed, and its prefix is not captured), which moves the slot on; the heartbeat record itself is routed
# into the same topic, where the consumer skips it.
# Gate: state stopped until the audit chart's consumer is enabled (consumer.enabled) in the same environment. Running
# the connector without its consumer lets captured changes age out of the topic (30-day retention) without ever
# reaching the chain. Set state: running (or remove the field) together with consumer.enabled.
# Adding a table or a service is wiring only (services/audit/internal/cdc/tables.go says how); deploy/scripts/test_argocd_apps.py
# checks the connector against the service's migrations, the consumer's table registry, the topic and the ACLs.
# The pilot table set is party's vendor bank accounts. debezium_cdc_party (the outbox-party role) reads them: party
# migration 0021 sets REPLICA IDENTITY FULL, creates depot_audit_party and grants SELECT on every column but the sealed
# ones. The slot is a second one on depot_party.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: audit-cdc-party
  namespace: kafka
  labels:
    strimzi.io/cluster: depot-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  state: stopped
  config:
    plugin.name: pgoutput
    database.hostname: postgres.hello-ledger.svc
    database.port: 5432
    database.user: ${secrets:kafka/debezium-cdc-party:username}
    database.password: ${secrets:kafka/debezium-cdc-party:password}
    database.dbname: depot_party
    topic.prefix: depot.cdc.party
    slot.name: depot_audit_party
    publication.name: depot_audit_party
    publication.autocreate.mode: disabled
    table.include.list: public.vendor_bank_account
    column.exclude.list: public.vendor_bank_account.account_number_sealed,public.vendor_bank_account.routing_number_sealed
    message.prefix.include.list: depot.ctx
    snapshot.mode: no_data
    tombstones.on.delete: false
    decimal.handling.mode: string
    heartbeat.interval.ms: 60000
    heartbeat.action.query: "SELECT pg_logical_emit_message(false, 'depot.heartbeat', '')"
    transforms: route
    transforms.route.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.route.regex: '(?:__debezium-heartbeat\.)?depot\.cdc\.party(?:\..+)?'
    transforms.route.replacement: depot.cdc.party
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    producer.override.acks: all
    producer.override.enable.idempotence: true
---
# The audit CDC topic of party: one partition (the depot.ctx message of a transaction must be read before its changes,
# which the consumer relies on) and 30 days of retention, longer than the outbox topics' 7, so a consumer outage does
# not lose captured changes before they reach the chain.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-cdc-party
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.cdc.party
  partitions: 1
  replicas: 3
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
# Source topics of the consumers dev turns on (D34, B-05b), declared so they exist before the first event: topic
# auto-creation is off, and an outbox relay creates a topic only when it relays that topic's first event, so a consumer
# that subscribes earlier would find no topic. Same settings as the relays' topic creation (12 partitions, 3 replicas,
# 7 days); a relay leaves an existing topic alone. deploy/scripts/test_kafka_consumers.py requires one for every topic of
# a consumer that is on in dev.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-receiving-receipt
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.receiving.receipt
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
