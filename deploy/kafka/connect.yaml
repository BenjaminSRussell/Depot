# Sales routes by event type, not aggregate_type: it writes many of its events under aggregate_type "order"
# (orderhold.*, creditcheck.evaluated, atp.promised and orderprogress.recorded among them), while its AsyncAPI channels
# (services/sales/events/asyncapi.yaml) and events.Topic name the topic after the type's entity. The route takes the
# entity out of dev.depot.sales.<entity>.<verb>.v<n>, so orderprogress.recorded lands on depot.sales.orderprogress
# (read by the inventory postings consumer, deploy/kafka/inventory-consumer.yaml) and order.confirmed on
# depot.sales.order. A type that does not match keeps its own name as the topic, which no ACL allows, so the task
# fails instead of writing elsewhere. The ACLs above are literal per AsyncAPI channel (a new entity needs an entry)
# and never cover depot.sales.order.dlq.
# snapshot.mode no_data: pgoutput streaming ignores RLS, so the CDC role needs neither BYPASSRLS nor a snapshot read of the forced-RLS outbox.
# debezium_cdc_sales has REPLICATION; the dev Postgres init grants it CONNECT on depot_sales only and revokes CONNECT from PUBLIC there.
