  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.receiving.ersselfbill
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-privacy-erasure
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.privacy.erasure
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
