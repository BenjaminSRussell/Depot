apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: depot-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.0.0
  replicas: 2
  bootstrapServers: depot-kafka-bootstrap:9093
  tls:
    trustedCertificates:
      - secretName: depot-cluster-ca-cert
        pattern: "*.crt"
  authentication:
    type: scram-sha-512
    username: debezium
    passwordSecret:
      secretName: debezium
      password: password
  config:
    group.id: depot-connect
    offset.storage.topic: depot-connect-offsets
    config.storage.topic: depot-connect-configs
    status.storage.topic: depot-connect-status
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  # Built from deploy/kafka-connect/Dockerfile by the connect-image job in .github/workflows/ci.yml:
  # Strimzi 0.46.0 / Kafka 4.0.0 plus the Debezium Postgres 3.0.7.Final connector and the
  # depot-cloudevents-enricher SMT. The tag names both versions; bump it with either.
  image: ghcr.io/benjaminsrussell/depot-connect:debezium-3.0.7-enricher-0.1.0
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: outbox-batch
  namespace: kafka
