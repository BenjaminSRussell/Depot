# The intercompany charge feed (#40, `intercompany consume`, group intercompany-charges) raises an intercompany charge for every expense
# line and project hour another legal entity bears, from expense's report.approved (depot.expense.report) and projects'
# transaction.posted (depot.projects.transaction), and parks what it cannot apply on depot.intercompany.charges.dlq. The chart's
# consumer.kafka.username names this user. Literal ACLs: it reads those two topics and writes only its dead-letter topic.
# The two topics are written by outbox-expense and outbox-projects (deploy/kafka/connect.yaml, routed by event type, #213); the
# consumer stays off in the chart until those connectors run on the cluster.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: intercompany-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.expense.report, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.projects.transaction, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.intercompany.charges.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: intercompany-charges, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-intercompany-charges-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.intercompany.charges.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
