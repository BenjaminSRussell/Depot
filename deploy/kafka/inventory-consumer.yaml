# The inventory postings consumer (#480, `inventory consume`, group inventory-postings) books receiving's
# receipt.posted / receipt.corrected / invoice.posted, sales' orderprogress.recorded and fulfillment's packingslip.cancelled, and with the
# truck handlers in the same consumer fieldservice's workorder.completed (#45), and parks what it cannot book on
# depot.inventory.postings.dlq. The chart's consumer.kafka.username names this user. Literal ACLs: the user reads only
# its five source topics and writes only its dead-letter topic. The source topics are created by the outbox-receiving,
# outbox-sales, outbox-fulfillment and outbox-fieldservice connectors (deploy/kafka/connect.yaml).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: inventory-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.receiving.receipt, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.receiving.vendorinvoice, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.sales.orderprogress, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.fulfillment.packingslip, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.service.workorder.completed, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.inventory.postings.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: inventory-postings, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-inventory-postings-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.inventory.postings.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
