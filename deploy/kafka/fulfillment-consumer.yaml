# The fulfillment order consumer (`fulfillment consume`, group fulfillment-order) stores sales' confirmed orders, their
# remainder cancellations and holds (a post is refused while a hold is active), and parks what it cannot apply on
# depot.sales.order.dlq. The chart's consumer.kafka.username names this user. Literal ACLs: the user reads only sales'
# order and orderhold topics (outbox-sales in connect.yaml writes both) and writes only its dead-letter topic
# (B-05b, D34).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: fulfillment-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.sales.order, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.sales.orderhold, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.sales.order.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: fulfillment-order, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-sales-order-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.sales.order.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
