# The production planned order intake (`production consume`, group production-planning, FR-22.10) turns planning's
# plannedorder.firmed into production orders and parks what it cannot apply on depot.planning.plannedorder.dlq. The
# chart's consumer.kafka.username names this user. Literal ACLs: the user reads only planning's plannedorder topic
# (outbox-planning in connect.yaml writes it) and writes only its dead-letter topic (B-05b, D34). The shop-floor job
# card consumer has its own user (production-shopfloor-consumer.yaml).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: production-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.planning.plannedorder, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.planning.plannedorder.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: production-planning, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-planning-plannedorder-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.planning.plannedorder.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
