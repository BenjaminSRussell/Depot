# The shop floor's production consumer (`shopfloor consume`, group shopfloor-production) stores production's
# operation.statuschanged (an operation finished or reopened) and parks what it cannot apply on
# depot.production.operation.dlq. The chart's consumer.kafka.username names this user. Literal ACLs: the user reads only
# production's operation topic (outbox-production in connect.yaml writes it) and writes only its dead-letter topic
# (B-05b, D34).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: shopfloor-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: depot.production.operation, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: topic, name: depot.production.operation.dlq, patternType: literal}
        operations: [Write, Describe]
      - resource: {type: group, name: shopfloor-production, patternType: literal}
        operations: [Read, Describe]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: depot-production-operation-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: depot
spec:
  topicName: depot.production.operation.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
