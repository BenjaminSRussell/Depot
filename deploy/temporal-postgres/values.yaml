image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
persistence:
  size: 10Gi
  storageClassName: ""
networkPolicy:
  clientComponents: [frontend, history, matching, worker, database]
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
externalSecret:
  storeName: depot
  environment: ""
  pathPrefix: depot/{env}
  refreshInterval: 1h
# TLS only (stage, prod): a cert-manager certificate from tls.issuer and a pg_hba that admits TCP only over TLS with SCRAM.
tls:
  enabled: false
  issuer: ""
