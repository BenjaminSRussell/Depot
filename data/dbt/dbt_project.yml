name: depot_analytics
version: "1.0.0"
config-version: 2
profile: depot_trino

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  depot_analytics:
    core:
      +schema: core
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    mart:
      +schema: mart
      +materialized: table

seeds:
  depot_analytics:
    +schema: core
