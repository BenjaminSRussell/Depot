image:
  repository: ghcr.io/benjaminsrussell/depot-migration-factory
  tag: "0.1.0"
  # Pin by digest in Argo CD overlays (deployment-cicd); the tag is a dev default.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

admin:
  port: 9090

# Secret holding DATABASE_URL for the depot_app role (no BYPASSRLS). Required: the service
# exits at start without it.
database:
  secretName: depot-migration-factory-db
  secretKey: DATABASE_URL

# Where the open_items pack is loaded (integration track S8). Leave both empty and the service starts, and the
# load step answers 503 MIG-1520. receivables.url is the receivables service base address; signing.secretName names
# a Secret holding the base64 32-byte Ed25519 seed the factory signs its service tokens with (the receivables
# service must hold the matching public key for the service "migration-factory").
receivables:
  url: ""
# payables.url is the payables service base address the AP lines of an open_items run are loaded into
# (POST /v1/payables/opening-batches); empty and the AP load answers 503 MIG-1550. It uses the same signing key.
payables:
  url: ""
# inventory.url and treasury.url are the service base addresses the staged opening stock (onhand pack,
# POST /v1/inventory/opening-batches) and opening bank balances (bank_balances pack, POST /v1/treasury/opening-balances)
# are loaded into; empty and the opening load answers 503 MIG-1560. They use the same signing key.
inventory:
  url: ""
treasury:
  url: ""
# sales.url and purchasing.url are the service base addresses the staged open order lines (open_orders pack) are loaded into
# (POST /v1/sales/opening-orders, POST /v1/procurement/opening-orders); empty and the orders load answers 503 MIG-1570.
# They use the same signing key.
sales:
  url: ""
purchasing:
  url: ""
# assets.url, production.url and payroll.url are the service base addresses the staged fixed_assets, wip_prod and payroll_ytd packs are loaded into
# (POST /v1/assets/opening-assets, POST /v1/production/opening-wip, POST /v1/payroll/opening-ytd); empty and the staged load answers 503 MIG-1580.
# They use the same signing key.
assets:
  url: ""
production:
  url: ""
payroll:
  url: ""
# The migration service, whose cross-reference resolves the legacy customers and vendors of an open-items run (H-S8-6, #49) and the items, customers and vendors of an open-orders load.
migration:
  url: ""
# The ledger the parallel-run replay and the rollback compensations post through (LEDGER_URL, same signing key); empty and they
# answer 503 MIG-1530.
ledger:
  url: ""
signing:
  secretName: ""
  secretKey: DEPOT_SERVICE_SIGNING_KEY

# Apply migrations at start. Turn off where a migration job runs them as the owner role.
migrateOnStart: false

env:
  DEPOT_ENV: dev
  SERVICE_NAME: migration-factory
  HISTORY_YEARS: "7"
  MASK_PII: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /healthz
  readiness:
    path: /readyz

serviceMonitor:
  enabled: false
  interval: 30s

# >>> ingressPolicy: generated by deploy/scripts/gen_networkpolicies.py (D1, ADR-0006 rule 6); do not edit, run the script.
# Default-deny ingress (templates/networkpolicy-ingress.yaml): only these Gateways' Envoy pods and these peer
# services reach the API port, only Prometheus the metrics port. Override per environment in deploy/envs/<env>/values;
# regenerate after changing the grant table (policies/authz/data.json), a chart's *_URL clients or an HTTPRoute.
ingressPolicy:
  enabled: true
  podNames: [depot-migration-factory]
  apiPort: 8080
  gateway:
    podsNamespace: envoy-gateway-system
    gatewaysNamespace: hello-ledger
    names: [depot-api]
  peers: []
  metricsPorts: [9090]
  prometheus:
    namespace: observability
    podLabels: {app.kubernetes.io/name: prometheus}
# <<< ingressPolicy
